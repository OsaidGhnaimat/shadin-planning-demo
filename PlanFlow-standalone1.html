  <script>
/* PlanFlow — الجدول الزمني: جدول أنشطة + Gantt + مسار حرج + سحب وإفلات */
(function (g) {
  const PF = g.PF;
  const D = PF.D, esc = PF.esc, S_ = () => PF.Store.state, C_ = () => PF.Store.C;
  const ROWH = 34;

  const UI = Object.assign({ sel: null, selG: null, collapsed: {}, filter: 'all', q: '', zoom: 12, float: true, base: true, links: true, tbl: true }, safeLoad());
  function safeLoad() { try { return JSON.parse(localStorage.getItem('planflow.ui') || '{}'); } catch (e) { return {}; } }
  if (window.innerWidth < 760 && safeLoad().tbl === undefined) UI.tbl = false;
  function saveUI() { try { localStorage.setItem('planflow.ui', JSON.stringify({ collapsed: UI.collapsed, zoom: UI.zoom, float: UI.float, base: UI.base, links: UI.links, tbl: UI.tbl })); } catch (e) { /* */ } }

  const FILTERS = [
    ['all', 'كل الأنشطة'], ['crit', 'الحرجة'], ['near', 'شبه الحرجة'], ['neg', 'Float سالب'], ['late', 'متأخرة عن خط الأساس'],
    ['prog', 'قيد التنفيذ'], ['todo', 'لم تبدأ'], ['done', 'مكتملة'], ['nolink', 'بدون علاقات'],
  ];
  const CONSTRAINTS = [['', 'بدون قيد'], ['SNET', 'يبدأ ليس قبل (SNET)'], ['FNET', 'ينتهي ليس قبل (FNET)'], ['SNLT', 'يبدأ ليس بعد (SNLT)'], ['FNLT', 'ينتهي ليس بعد (FNLT)'], ['MSO', 'يجب أن يبدأ في (MSO)'], ['MFO', 'يجب أن ينتهي في (MFO)']];

  function passes(a, S, C) {
    const r = C.byId[a.id];
    if (UI.q) { const q = UI.q.toLowerCase(); if (!(a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q))) return false; }
    const bl = PF.CPM.baselineOf(S);
    switch (UI.filter) {
      case 'crit': return r.critical;
      case 'near': return r.near;
      case 'neg': return r.tf < 0;
      case 'late': return !!(bl && bl.data[a.id] && r.status !== 'complete' && r.cal.wdb(bl.data[a.id].f, r.f) > 0);
      case 'prog': return r.status === 'inprogress';
      case 'todo': return r.status === 'notstarted';
      case 'done': return r.status === 'complete';
      case 'nolink': return !a.preds.length || !C.succ[a.id].length;
      default: return true;
    }
  }

  function render(root) {
    const S = S_(), C = C_();
    const bl = PF.CPM.baselineOf(S);
    const filtering = UI.filter !== 'all' || UI.q;
    // ---- الصفوف: ملخص المشروع ثم شجرة WBS (أي عمق) ثم الأنشطة
    const flat = PF.WBS.flat(S).map((x) => ({ ...x }));
    const orphan = S.activities.filter((a) => !S.wbs.some((w) => w.id === a.wbs));
    if (orphan.length) flat.push({ w: { id: '', name: 'بدون مجموعة', parent: '' }, depth: 0, hasKids: false });
    const direct = (w) => (w.id === '' ? orphan : S.activities.filter((a) => a.wbs === w.id));
    // هل في الشجرة تحت العنصر نشاط يطابق التصفية؟
    const visInSub = {};
    flat.forEach((x) => { const ids = x.w.id === '' ? [''] : PF.WBS.subtreeIds(S, x.w.id); visInSub[x.w.id] = S.activities.some((a) => (ids.includes(a.wbs) || (x.w.id === '' && orphan.includes(a))) && passes(a, S, C)); });
    const rows = [];
    const tot = PF.WBS.rollup(S, C, null, bl);
    rows.push({ t: 'p', ru: tot });
    const wcodes = PF.WBS.codes(S);
    let hideDepth = Infinity;
    flat.forEach((x) => {
      if (x.depth > hideDepth) return; // تحت عنصر مطوي
      hideDepth = Infinity;
      if (filtering && !visInSub[x.w.id]) return;
      const ru = x.w.id === '' ? PF.WBS.rollup({ ...S, wbs: [{ id: '', name: '', parent: '' }], activities: orphan.map((a) => ({ ...a, wbs: '' })) }, C, '', bl) : PF.WBS.rollup(S, C, x.w.id, bl);
      rows.push({ t: 'g', x, ru, code: wcodes[x.w.id] || '', n: direct(x.w).length });
      if (UI.collapsed[x.w.id]) { hideDepth = x.depth; return; }
      direct(x.w).filter((a) => passes(a, S, C)).forEach((a) => rows.push({ t: 'a', a, depth: x.depth + 1 }));
    });

    // نطاق الزمن
    let mn = Infinity, mx = -Infinity;
    S.activities.forEach((a) => {
      const r = C.byId[a.id];
      mn = Math.min(mn, r.s); mx = Math.max(mx, r.f, r.lf || 0);
      if (bl && bl.data[a.id]) { mn = Math.min(mn, bl.data[a.id].s); mx = Math.max(mx, bl.data[a.id].f); }
    });
    if (!isFinite(mn)) { mn = D.toNum(S.meta.startDate); mx = mn + 60; }
    let gs = mn - 4; while (D.dow(gs) !== 0) gs--;
    const ge = mx + 12;
    const dw = UI.zoom, W = (ge - gs) * dw;
    const X = (d) => (d - gs) * dw;
    const tblW = UI.tbl ? 860 : 330;
    const idx = {}; // صف كل نشاط
    rows.forEach((r, i) => { if (r.t === 'a') idx[r.a.id] = i; });

    // ---- الرأس
    let head = '';
    for (let y = D.parts(gs).y, m = D.parts(gs).m; ; m++) {
      if (m > 11) { m = 0; y++; }
      const st = Math.max(gs, Math.round(Date.UTC(y, m, 1) / 86400000));
      if (st >= ge) break;
      const en = Math.min(ge, Math.round(Date.UTC(y, m + 1, 1) / 86400000));
      head += `<div class="mth" style="left:${X(st)}px;width:${(en - st) * dw}px">${D.MONTHS[m]} ${y}</div>`;
    }
    for (let d = gs; d < ge; d += dw >= 22 ? 1 : 7) head += `<div class="wk" style="left:${X(d)}px;width:${(dw >= 22 ? 1 : 7) * dw}px">${dw >= 8 ? D.parts(d).d : ''}</div>`;

    // ---- خلفية العطل: عطلة أسبوعية + عطل رسمية (الشركة/التقويم) بأسمائها
    let bg = '';
    const hmap = PF.Store.holidayMap(S.meta.defaultCal);
    const wkCal = C.defCal;
    for (let d = gs; d < ge; d++) {
      if (hmap[d]) { bg += `<div class="hol ${hmap[d].src === 'calendar' ? 'cal' : ''}" style="left:${X(d)}px;width:${Math.max(2, dw)}px" title="${esc(hmap[d].name)} — ${D.fmt(d)}"></div>`; continue; }
      if (!wkCal.isWork(d)) { let e = d; while (e + 1 < ge && !wkCal.isWork(e + 1) && !hmap[e + 1]) e++; bg += `<div class="nw" style="left:${X(d)}px;width:${(e - d + 1) * dw}px"></div>`; d = e; }
    }
    const dd = D.toNum(S.meta.dataDate) + 1, td = D.today();
    bg += `<div class="dline" style="left:${X(dd)}px"><span>تاريخ البيانات</span></div>`;
    if (td >= gs && td <= ge && td !== dd) bg += `<div class="dline today" style="left:${X(td)}px"><span>اليوم</span></div>`;

    // ---- الصفوف
    const rowsHtml = rows.map((row) => {
      if (row.t === 'p' || row.t === 'g') {
        const ru = row.ru, has = ru.n > 0, isP = row.t === 'p';
        const id = isP ? '__p' : row.x.w.id, name = isP ? S.meta.name : row.x.w.name, depth = isP ? 0 : row.x.depth;
        const pad = depth * 16;
        const tfv = has && ru.tf != null ? ru.tf : null;
        return `<div class="srow grp ${isP ? 'proj' : ''} ${UI.collapsed[id] ? 'col' : ''} ${UI.selG === id ? 'sel' : ''}" data-g="${esc(id)}">
          <div class="scells"><div class="c c-id num">${isP ? '' : esc(row.code)}</div><div class="c c-name" ${isP ? '' : `data-gtoggle="${esc(id)}" title="انقر للطي والفتح — نقرتان لإعادة التسمية"`} style="padding-left:${pad}px">${isP ? '' : `<span class="caret ${row.x.hasKids || row.n ? '' : 'dim'}">${PF.icon('caret', 14)}</span>`}<span dir="auto">${esc(name)}</span><span class="t-mut" style="font-weight:400">(${has ? ru.n : 0})</span></div>
          <div class="c c-dur num">${has ? ru.dur : ''}</div><div class="c c-s num">${has ? D.fmt(ru.s) : ''}</div><div class="c c-f num">${has ? D.fmt(ru.f - 1) : ''}</div>
          <div class="c c-bs num">${has && ru.bs != null ? D.fmt(ru.bs) : ''}</div><div class="c c-bf num">${has && ru.bf != null ? D.fmt(ru.bf - 1) : ''}</div>
          <div class="c c-tf num tfv ${tfv == null ? '' : tfv < 0 ? 'neg' : tfv === 0 ? 'zero' : ''}">${tfv == null ? '' : tfv}</div>
          <div class="c c-pct num">${has ? ru.perf.toFixed(ru.perf % 1 ? 1 : 0) + '%' : ''}</div><div class="c c-sp num">${has && ru.sched != null ? ru.sched.toFixed(ru.sched % 1 ? 1 : 0) + '%' : ''}</div></div>
          <div class="gcell" style="width:${W}px">${has ? `<div class="gsum" style="left:${X(ru.s)}px;width:${Math.max(4, (ru.f - ru.s) * dw)}px"></div>` : ''}</div></div>`;
      }
      const a = row.a, r = C.byId[a.id], isM = a.type === 'milestone';
      const tf = r.tf, tfc = r.status === 'complete' ? '' : tf < 0 ? 'neg' : tf === 0 ? 'zero' : tf <= S.meta.nearCritical ? 'low' : '';
      const cls = r.status === 'complete' ? 'done' : r.critical ? 'crit' : r.near ? 'near' : '';
      const b = bl && bl.data[a.id];
      let g2 = '';
      if (UI.base && b) {
        if (b.dur > 0) g2 += `<div class="bl" style="left:${X(b.s)}px;width:${Math.max(3, (b.f - b.s) * dw)}px" title="خط الأساس: ${D.fmt(b.s)} → ${D.fmt(b.f - 1)}"></div>`;
        else g2 += `<div class="bl" style="left:${X(b.s) - 3}px;width:6px"></div>`;
      }
      let endX;
      if (isM) {
        g2 += `<div class="ms ${cls}" data-bar="${esc(a.id)}" style="left:${X(r.s)}px" title="${esc(a.name)} — ${D.fmt(r.s)}"></div>`;
        endX = X(r.s) + 12;
      } else {
        const bw = Math.max(3, (r.f - r.s) * dw);
        if (UI.float && r.status !== 'complete' && r.lf > r.f) g2 += `<div class="fl" style="left:${X(r.f)}px;width:${(r.lf - r.f) * dw}px" title="Float: ${tf} يوم"></div>`;
        const pct = r.status === 'complete' ? 100 : a.pct || 0;
        const drag = r.status === 'notstarted' ? '' : ' prog';
        g2 += `<div class="bar ${cls}${drag}" data-bar="${esc(a.id)}" style="left:${X(r.s)}px;width:${bw}px" title="${esc(a.name)}&#10;${D.fmt(r.s)} → ${D.fmt(r.lastDay)} · ${a.dur} يوم · إنجاز ${pct}%"><div class="pf" style="width:${pct}%"></div>${r.status === 'notstarted' ? '<div class="rh" data-rh></div>' : ''}</div>`;
        endX = X(r.s) + bw;
      }
      g2 += `<div class="blabel" style="left:${endX + 8}px" dir="auto">${esc(a.name)}</div>`;
      const dot = r.status === 'complete' ? 'done' : r.critical ? 'crit' : r.near ? 'near' : '';
      return `<div class="srow ${UI.sel === a.id ? 'sel' : ''}" data-row="${esc(a.id)}">
        <div class="scells">
          <div class="c c-id"><span class="sdot ${dot}"></span>${esc(a.id)}</div>
          <div class="c c-name" style="padding-left:${(row.depth || 0) * 16 + 18}px"><input class="cell-in" dir="auto" value="${esc(a.name)}" data-f="name" data-id="${esc(a.id)}" data-fkey="${esc(a.id)}:name"></div>
          <div class="c c-dur">${isM ? '<span class="t-mut">◆</span>' : `<input class="cell-in" type="number" min="1" value="${a.dur}" data-f="dur" data-id="${esc(a.id)}" data-fkey="${esc(a.id)}:dur" ${r.status === 'complete' ? 'disabled' : ''}>`}</div>
          <div class="c c-s num">${D.fmt(r.s)}</div><div class="c c-f num">${D.fmt(r.lastDay)}</div>
          <div class="c c-bs num">${b ? D.fmt(b.s) : ''}</div><div class="c c-bf num">${b ? D.fmt(b.dur > 0 ? r.cal.prev(b.f - 1) : b.s) : ''}</div>
          <div class="c c-tf num tfv ${tfc}">${r.status === 'complete' ? '—' : tf}</div>
          <div class="c c-pct"><input class="cell-in" type="number" min="0" max="100" value="${r.status === 'complete' ? 100 : a.pct || 0}" data-f="pct" data-id="${esc(a.id)}" data-fkey="${esc(a.id)}:pct"></div>
          <div class="c c-sp num">${b ? Math.round(PF.CPM.frac(C.cals[b.cal] || C.defCal, b.s, b.f, b.dur, D.toNum(S.meta.dataDate) + 1) * 100) + '%' : ''}</div>
        </div>
        <div class="gcell" style="width:${W}px">${g2}</div></div>`;
    }).join('');

    // ---- الروابط
    let links = '';
    if (UI.links) {
      const yc = (i) => i * ROWH + ROWH / 2;
      rows.forEach((row) => {
        if (row.t !== 'a') return;
        const a = row.a, r = C.byId[a.id], j = idx[a.id];
        a.preds.forEach((p) => {
          const pi = idx[p.id];
          if (pi == null) return;
          const pr = C.byId[p.id], t = p.type || 'FS';
          const fromFinish = t === 'FS' || t === 'FF', toStart = t === 'FS' || t === 'SS';
          const pxs = (pr.dur === 0 ? X(pr.s) + (fromFinish ? 8 : -8) : fromFinish ? X(pr.f) : X(pr.s));
          const sxs = (r.dur === 0 ? X(r.s) + (toStart ? -8 : 8) : toStart ? X(r.s) : X(r.f));
          const y1 = yc(pi), y2 = yc(j);
          const o1 = pxs + (fromFinish ? 7 : -7), o2 = sxs + (toStart ? -7 : 7);
          const ym = y2 > y1 ? y1 + ROWH / 2 : y1 - ROWH / 2;
          const crit = pr.critical && r.critical && pr.status !== 'complete' ? ' crit' : '';
          const dir = toStart ? 1 : -1;
          links += `<path class="${crit.trim()}" d="M${pxs} ${y1} L${o1} ${y1} L${o1} ${ym} L${o2} ${ym} L${o2} ${y2} L${sxs - dir * 1} ${y2}"/>`;
          links += `<polygon class="${crit.trim()}" points="${sxs},${y2} ${sxs - dir * 6},${y2 - 3.5} ${sxs - dir * 6},${y2 + 3.5}"/>`;
        });
      });
    }

    const selA = UI.sel && S.activities.find((a) => a.id === UI.sel);
    root.innerHTML = `
      <div class="stool no-print">
        <button class="btn primary" data-act="add">${PF.icon('plus')} نشاط</button>
        <button class="btn" data-act="addm">${PF.icon('plus')} معلم</button>
        <button class="btn" data-act="addg" title="يُضاف داخل المجموعة المحددة حالياً (أي عمق)">${PF.icon('plus')} مجموعة</button>
        <button class="btn" data-act="wbs">${PF.icon('wbs')} هيكل WBS</button>
        <button class="btn" data-act="edit" ${selA ? '' : 'disabled'}>${PF.icon('edit')} تفاصيل النشاط</button>
        <button class="btn" data-act="del" ${selA ? '' : 'disabled'}>${PF.icon('trash')} حذف</button>
        <span class="sp"></span>
        <select id="flt" aria-label="تصفية">${PF.opts(FILTERS, UI.filter)}</select>
        <input type="text" id="q" placeholder="بحث بالاسم أو الرقم…" value="${esc(UI.q)}" aria-label="بحث">
        <div class="seg" id="zoom">${[[5, 'شهري'], [12, 'أسبوعي'], [26, 'يومي']].map(([v, l]) => `<button data-z="${v}" class="${UI.zoom === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <label class="cb"><input type="checkbox" data-tg="float" ${UI.float ? 'checked' : ''}>Float</label>
        <label class="cb"><input type="checkbox" data-tg="base" ${UI.base ? 'checked' : ''}>خط الأساس</label>
        <label class="cb"><input type="checkbox" data-tg="links" ${UI.links ? 'checked' : ''}>الروابط</label>
        <button class="btn sm" data-act="tbl">${UI.tbl ? 'تصغير الجدول' : 'توسيع الجدول'}</button>
      </div>
      ${C.project.errors.length ? `<div class="note bad" style="margin:10px 16px 0">يوجد حلقة مغلقة في العلاقات بين الأنشطة: ${C.project.errors[0].ids.join('، ')} — عدّل العلاقات حتى يحسب الجدول بشكل صحيح.</div>` : ''}
      <div class="sgrid ${UI.tbl ? '' : 'collapsed-tbl'}" data-keepscroll="sched" style="--tblw:${tblW}px">
        <div class="sinner" style="width:${tblW + W}px">
          <div class="shead"><div class="scells">
            <div class="c c-id">الرقم</div><div class="c c-name" dir="rtl">اسم النشاط</div><div class="c c-dur">المدة</div><div class="c c-s">البداية</div><div class="c c-f">النهاية</div><div class="c c-bs" title="بداية خط الأساس">BL بداية</div><div class="c c-bf" title="نهاية خط الأساس">BL نهاية</div><div class="c c-tf" title="Total Float بأيام العمل">Float</div><div class="c c-pct" title="الإنجاز الفعلي (Performance %)">فعلي %</div><div class="c c-sp" title="الإنجاز المخطط حسب خط الأساس عند تاريخ البيانات (Schedule %)">مخطط %</div></div>
            <div style="position:relative;width:${W}px;flex:none">${head}</div></div>
          <div class="gbg" style="height:${rows.length * ROWH}px">${bg}</div>
          <div class="rows">${rowsHtml || '<div class="sched-empty"><b>لا توجد أنشطة مطابقة</b><br>غيّر التصفية أو أضف نشاطاً جديداً.</div>'}
            <svg class="links" width="${W}" height="${rows.length * ROWH}">${links}</svg></div>
        </div>
      </div>`;
    bind(root, { gs, dw });
  }

  function bind(root, geo) {
    const S = S_();
    const mut = (fn) => PF.Store.mutate(fn);
    root.onclick = (e) => {
      const t = e.target;
      const z = t.closest('[data-z]'); if (z) { UI.zoom = +z.dataset.z; saveUI(); PF.App.render(false); return; }
      const gt = t.closest('[data-gtoggle]');
      if (gt) { const id = gt.dataset.gtoggle; UI.collapsed[id] = !UI.collapsed[id]; UI.selG = id; saveUI(); PF.App.render(false); return; }
      const act = t.closest('[data-act]');
      if (act) { actions[act.dataset.act] && actions[act.dataset.act](); return; }
      if (t.closest('input,select')) return;
      const row = t.closest('[data-row]');
      if (row) { UI.sel = row.dataset.row; const a = S_().activities.find((x) => x.id === UI.sel); UI.selG = a ? a.wbs : null; PF.App.render(false); }
    };
    root.ondblclick = (e) => {
      const gt = e.target.closest('[data-gtoggle]');
      if (gt) { renameGroup(gt.dataset.gtoggle); return; }
      const row = e.target.closest('[data-row]');
      if (row && !e.target.closest('input')) editActivity(row.dataset.row);
    };
    root.onchange = (e) => {
      const t = e.target;
      if (t.id === 'flt') { UI.filter = t.value; PF.App.render(false); return; }
      if (t.dataset.tg) { UI[t.dataset.tg] = t.checked; saveUI(); PF.App.render(false); return; }
      if (!t.dataset.f) return;
      const id = t.dataset.id;
      mut((st) => {
        const a = st.activities.find((x) => x.id === id);
        if (t.dataset.f === 'name') a.name = t.value.trim() || a.name;
        else if (t.dataset.f === 'dur') a.dur = Math.max(1, Math.round(+t.value || 1));
        else if (t.dataset.f === 'pct') PF.Actions.setPct(st, a, t.value);
      });
    };
    const q = root.querySelector('#q');
    if (q) q.oninput = () => { UI.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { PF.App.render(false); const n = PF.$('#q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); };

    // ---- سحب الأشرطة
    root.onpointerdown = (e) => {
      const bar = e.target.closest('.bar');
      if (!bar || e.button !== 0) return;
      const id = bar.dataset.bar, r = PF.Store.C.byId[id];
      if (bar.classList.contains('prog')) { PF.toast('النشاط بدأ تنفيذه — عدّل التقدّم من صفحة «تحديث التقدّم».'); return; }
      const resize = !!e.target.closest('[data-rh]');
      const x0 = e.clientX, w0 = bar.offsetWidth;
      let days = 0, moved = false;
      bar.setPointerCapture(e.pointerId);
      bar.classList.add('dragging');
      const mv = (ev) => {
        const dx = ev.clientX - x0;
        days = Math.round(dx / geo.dw);
        if (Math.abs(dx) > 3) moved = true;
        if (resize) bar.style.width = Math.max(3, w0 + days * geo.dw) + 'px';
        else bar.style.transform = `translateX(${days * geo.dw}px)`;
      };
      const up = () => {
        bar.removeEventListener('pointermove', mv);
        bar.removeEventListener('pointerup', up);
        bar.classList.remove('dragging');
        if (!moved || days === 0) { bar.style.transform = ''; bar.style.width = w0 + 'px'; UI.sel = id; PF.App.render(false); return; }
        if (resize) {
          const newLast = r.lastDay + days;
          const nd = Math.max(1, r.cal.wdb(r.s, newLast + 1));
          mut((st) => { st.activities.find((a) => a.id === id).dur = nd; });
          PF.toast('المدة الجديدة: ' + nd + ' يوم عمل', 'ok');
        } else {
          const want = r.cal.next(r.s + days);
          mut((st) => { const a = st.activities.find((x) => x.id === id); a.constraint = { type: 'SNET', date: D.toIso(want) }; });
          const got = PF.Store.C.byId[id].s;
          if (got !== want) PF.toast('الجدول محكوم بالعلاقات — لن يبدأ النشاط قبل ' + D.fmt(got) + '. عدّل العلاقة من «تفاصيل النشاط».');
          else PF.toast('تم تثبيت قيد: يبدأ ليس قبل ' + D.fmt(want) + ' (يمكن إزالته من التفاصيل)', 'ok');
        }
      };
      bar.addEventListener('pointermove', mv);
      bar.addEventListener('pointerup', up);
      e.preventDefault();
    };
  }

  const actions = {
    add() { addActivity('task'); },
    addm() { addActivity('milestone'); },
    async addg() {
      const S = S_(), parent = UI.selG && PF.WBS.byId(S, UI.selG) ? UI.selG : '';
      const where = parent ? 'داخل «' + PF.WBS.byId(S, parent).name + '»' : 'في المستوى الأول';
      const n = await PF.prompt('عنصر WBS جديد ' + where, 'الاسم', '');
      if (n) { PF.Store.mutate((st) => { PF.WBS.add(st, parent, n); }); if (parent) UI.collapsed[parent] = false; }
    },
    wbs() { location.hash = '#/wbs'; },
    edit() { UI.sel && editActivity(UI.sel); },
    async del() {
      const S = S_(), a = S.activities.find((x) => x.id === UI.sel);
      if (!a) return;
      if (await PF.confirm(`حذف النشاط «${a.name}»؟ ستُحذف علاقاته أيضاً (يمكنك التراجع بـ Ctrl+Z).`, 'حذف', true)) {
        PF.Store.mutate((st) => PF.Actions.deleteActivity(st, a.id));
        UI.sel = null; PF.App.render(false);
      }
    },
    tbl() { UI.tbl = !UI.tbl; saveUI(); PF.App.render(false); },
  };

  function addActivity(type) {
    const S = S_();
    const sel = UI.sel && S.activities.find((a) => a.id === UI.sel);
    const id = PF.Actions.nextId(S);
    PF.Store.mutate((st) => {
      const wbs = sel ? sel.wbs : UI.selG && PF.WBS.byId(st, UI.selG) ? UI.selG : st.wbs[0] ? st.wbs[0].id : '';
      const a = { id, name: type === 'milestone' ? 'معلم جديد' : 'نشاط جديد', wbs, type, dur: type === 'milestone' ? 0 : 5, cal: '', constraint: null, pct: 0, actualStart: null, actualFinish: null, remaining: null, budget: 0, actualCost: 0, notes: '', preds: sel ? [{ id: sel.id, type: 'FS', lag: 0 }] : [], resources: [] };
      const i = sel ? st.activities.findIndex((x) => x.id === sel.id) : st.activities.length - 1;
      st.activities.splice(i + 1, 0, a);
    });
    UI.sel = id;
    PF.App.render(false);
    editActivity(id);
  }

  async function renameGroup(id) {
    const w = S_().wbs.find((x) => x.id === id);
    if (!w) return;
    const n = await PF.prompt('إعادة تسمية المجموعة', 'الاسم', w.name);
    if (n) PF.Store.mutate((st) => { st.wbs.find((x) => x.id === id).name = n; });
  }

  // ---------- نافذة تفاصيل النشاط ----------
  function editActivity(id) {
    const S = S_(), C = C_();
    const orig = S.activities.find((a) => a.id === id);
    if (!orig) return;
    const d = PF.clone(orig);
    const r = C.byId[id];
    const others = S.activities.filter((a) => a.id !== id);
    const REL = [['FS', 'نهاية→بداية (FS)'], ['SS', 'بداية→بداية (SS)'], ['FF', 'نهاية→نهاية (FF)'], ['SF', 'بداية→نهاية (SF)']];

    const body = () => `
      <div class="msec"><h4>البيانات الأساسية</h4>
        <div class="row"><label class="fld" style="flex:3 1 260px"><span>اسم النشاط</span><input dir="auto" data-p="name" value="${esc(d.name)}"></label>
          <label class="fld"><span>الرقم</span><input value="${esc(d.id)}" disabled></label></div>
        <div class="row">
          <label class="fld"><span>المجموعة (WBS)</span><select data-p="wbs">${PF.opts(PF.WBS.flat(S).map((x) => [x.w.id, '\u00a0\u00a0'.repeat(x.depth) + x.w.name]), d.wbs)}</select></label>
          <label class="fld"><span>النوع</span><select data-p="type">${PF.opts([['task', 'نشاط'], ['milestone', 'معلم (مدة صفر)']], d.type)}</select></label>
          <label class="fld"><span>المدة (أيام عمل)</span><input type="number" min="0" data-p="dur" data-n value="${d.type === 'milestone' ? 0 : d.dur}" ${d.type === 'milestone' ? 'disabled' : ''}></label>
          <label class="fld"><span>التقويم</span><select data-p="cal">${PF.opts([['', 'تقويم المشروع'], ...S.calendars.map((c) => [c.id, c.name])], d.cal || '')}</select></label>
        </div>
        <div class="row">
          <label class="fld"><span>القيد الزمني</span><select data-p="constraint.type">${PF.opts(CONSTRAINTS, d.constraint ? d.constraint.type : '')}</select></label>
          <label class="fld"><span>تاريخ القيد</span><input type="date" data-p="constraint.date" value="${d.constraint ? d.constraint.date || '' : ''}" ${d.constraint ? '' : 'disabled'}></label>
          <label class="fld"><span>الميزانية (${esc(S.meta.currency)})</span><input type="number" min="0" data-p="budget" data-n value="${d.budget}"></label>
          <label class="fld"><span>التكلفة الفعلية</span><input type="number" min="0" data-p="actualCost" data-n value="${d.actualCost}"></label>
        </div></div>
      <div class="msec"><h4>الأنشطة السابقة (Predecessors)</h4>
        ${d.preds.map((p, i) => `<div class="rel"><select data-p="preds.${i}.id">${PF.opts(others.map((a) => [a.id, a.id + ' — ' + a.name]), p.id)}</select>
          <select data-p="preds.${i}.type">${PF.opts(REL, p.type)}</select>
          <input type="number" data-p="preds.${i}.lag" data-n value="${p.lag || 0}" title="التأخير (Lag) بأيام العمل — سالب = تقدّم"><button class="btn icon-btn" data-del-pred="${i}" title="حذف">${PF.icon('trash', 15)}</button></div>`).join('') || '<div class="t-mut" style="margin-bottom:8px">لا يوجد سابق — يبدأ النشاط مع بداية المشروع.</div>'}
        <button class="btn sm" data-add-pred>${PF.icon('plus', 14)} إضافة سابق</button>
        <div class="sub" style="margin:8px 0 0">اللاحقة: ${C.succ[id].map((e) => esc(e.to)).join('، ') || 'لا يوجد'}</div></div>
      <div class="msec"><h4>التقدّم</h4>
        <div class="row">
          <label class="fld"><span>نسبة الإنجاز %</span><input type="number" min="0" max="100" data-p="pct" data-n value="${d.pct}"></label>
          <label class="fld"><span>البداية الفعلية</span><input type="date" data-p="actualStart" value="${d.actualStart || ''}"></label>
          <label class="fld"><span>النهاية الفعلية</span><input type="date" data-p="actualFinish" value="${d.actualFinish || ''}"></label>
          <label class="fld"><span>المتبقي (أيام)</span><input type="number" min="0" data-p="remaining" data-n value="${d.remaining == null ? '' : d.remaining}" placeholder="تلقائي"></label></div></div>
      <div class="msec"><h4>الموارد المطلوبة (وحدات/يوم)</h4>
        ${d.resources.map((x, i) => `<div class="rel res"><select data-p="resources.${i}.rid">${PF.opts(S.resources.map((q) => [q.id, q.name]), x.rid)}</select>
          <input type="number" min="0" data-p="resources.${i}.perDay" data-n value="${x.perDay}"><button class="btn icon-btn" data-del-res="${i}">${PF.icon('trash', 15)}</button></div>`).join('')}
        <button class="btn sm" data-add-res ${S.resources.length ? '' : 'disabled'}>${PF.icon('plus', 14)} إضافة مورد</button></div>
      <div class="msec"><h4>ملاحظات</h4><textarea data-p="notes" dir="auto">${esc(d.notes || '')}</textarea></div>
      <div class="sub">الحالي: ${D.fmt(r.s)} → ${D.fmt(r.lastDay)} · Float: ${r.tf} · Free Float: ${r.ff}</div>`;

    const m = PF.modal({
      title: `${orig.id} — ${orig.name}`, body: body(), wide: true, noFocus: true,
      actions: [
        { label: 'إلغاء' },
        { label: 'حفظ', kind: 'primary', onClick: () => save() },
      ],
    });
    const redraw = () => { const sc = m.body.scrollTop; m.body.innerHTML = body(); m.body.scrollTop = sc; };
    const val = (el) => (el.dataset.n !== undefined ? (el.value === '' ? null : +el.value) : el.value);

    m.body.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset.p) return;
      const p = el.dataset.p;
      if (p === 'constraint.type') return;
      if (p === 'constraint.date') { d.constraint = d.constraint || { type: 'SNET' }; d.constraint.date = el.value; return; }
      PF.setPath(d, p, val(el));
    });
    m.body.addEventListener('change', (e) => {
      const el = e.target, p = el.dataset.p;
      if (p === 'constraint.type') { d.constraint = el.value ? { type: el.value, date: (d.constraint && d.constraint.date) || D.toIso(C.byId[id].s) } : null; redraw(); }
      else if (p === 'type') { d.type = el.value; if (d.type === 'milestone') d.dur = 0; else if (!d.dur) d.dur = 5; redraw(); }
      else if (p === 'actualFinish') { PF.Actions.setActualFinish(S, d, el.value); redraw(); }
      else if (p === 'actualStart') { PF.Actions.setActualStart(S, d, el.value); redraw(); }
      else if (p === 'pct') { const f = { meta: S.meta }; PF.Actions.setPct(f, d, el.value); redraw(); }
    });
    m.body.addEventListener('click', (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.hasAttribute('data-add-pred')) { const free = others.find((a) => !d.preds.some((p) => p.id === a.id)); if (free) { d.preds.push({ id: free.id, type: 'FS', lag: 0 }); redraw(); } }
      else if (t.dataset.delPred != null) { d.preds.splice(+t.dataset.delPred, 1); redraw(); }
      else if (t.hasAttribute('data-add-res')) { d.resources.push({ rid: S.resources[0].id, perDay: 1 }); redraw(); }
      else if (t.dataset.delRes != null) { d.resources.splice(+t.dataset.delRes, 1); redraw(); }
    });

    function save() {
      if (!String(d.name || '').trim()) { PF.toast('اكتب اسم النشاط', 'err'); return false; }
      if (d.type !== 'milestone' && !(+d.dur >= 1)) { PF.toast('المدة يجب أن تكون يوماً واحداً على الأقل', 'err'); return false; }
      if (d.constraint && !d.constraint.date) { PF.toast('حدّد تاريخ القيد أو اختر «بدون قيد»', 'err'); return false; }
      d.preds = d.preds.filter((p, i, arr) => p.id && arr.findIndex((q) => q.id === p.id && q.type === p.type) === i);
      const test = PF.clone(PF.Store.state);
      Object.assign(test.activities.find((a) => a.id === id), d);
      if (PF.Actions.wouldCycle(test)) { PF.toast('هذه العلاقات تُنشئ حلقة مغلقة (نشاط يعتمد على نفسه) — عدّل السوابق.', 'err'); return false; }
      PF.Store.mutate((st) => { Object.assign(st.activities.find((a) => a.id === id), d); });
      return true;
    }
  }

  PF.Views.schedule = { render, flush: true, edit: editActivity, setFilter(f) { UI.filter = f; UI.q = ''; } };
})(window);

</script>
  <script>
/* PlanFlow — تحديث التقدّم الدوري (Data Date + نسب الإنجاز + سجل الفترات) */
(function (g) {
  const PF = g.PF;
  const D = PF.D, esc = PF.esc, CPM = PF.CPM;
  let filter = 'attention';

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    const bl = CPM.baselineOf(S);
    const dd = D.toNum(S.meta.dataDate), t = dd + 1;

    const rowsAll = S.activities.map((a) => {
      const r = C.byId[a.id], b = bl && bl.data[a.id];
      const planned = b ? Math.round(CPM.frac(C.cals[b.cal] || C.defCal, b.s, b.f, b.dur, t) * 100) : null;
      const actual = r.status === 'complete' ? 100 : a.pct || 0;
      // يحتاج تحديث: كان مفروضاً أن يبدأ/يتقدم حسب الخطة ولم يُسجَّل
      const needs = r.status !== 'complete' && planned != null && (planned > actual + 4 || (planned >= 100 && actual < 100) || (b && b.s <= dd && r.status === 'notstarted'));
      return { a, r, b, planned, actual, needs };
    });
    const flt = { attention: (x) => x.needs, prog: (x) => x.r.status === 'inprogress', todo: (x) => x.r.status === 'notstarted', done: (x) => x.r.status === 'complete', all: () => true };
    const list = rowsAll.filter(flt[filter]);
    const cnt = (k) => rowsAll.filter(flt[k]).length;
    const last = S.snapshots[S.snapshots.length - 1];

    root.innerHTML = `
      <div class="pagehead"><h2>تحديث التقدّم</h2><span class="sp"></span></div>
      <div class="card" style="margin-bottom:14px">
        <div class="row">
          <label class="fld" style="max-width:200px"><span>تاريخ البيانات (نهاية اليوم)</span><input type="date" id="dd" value="${S.meta.dataDate}"></label>
          <div class="fld" style="flex:2 1 300px"><span>&nbsp;</span><div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" data-act="week">ترحيل أسبوع</button>
            <button class="btn primary" data-act="snap">${PF.icon('check')} حفظ فترة التحديث</button></div></div>
        </div>
        <div class="sub" style="margin:0">سجّل الإنجاز حتى نهاية هذا التاريخ؛ العمل المتبقي سيُعاد جدولته من اليوم التالي. «حفظ فترة التحديث» يضيف نقطة للمنحنى الفعلي في صفحة S-Curve${last ? ` (آخر فترة محفوظة: ${D.fmtLong(D.toNum(last.date))})` : ''}.</div>
      </div>
      <div class="chips" style="margin-bottom:12px">
        ${[['attention', 'تحتاج تحديثاً'], ['prog', 'قيد التنفيذ'], ['todo', 'لم تبدأ'], ['done', 'مكتملة'], ['all', 'الكل']].map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${l}<i>${cnt(k)}</i></button>`).join('')}
      </div>
      <div class="tw"><table class="t">
        <thead><tr><th>الرقم</th><th>النشاط</th><th class="n">المخطط %</th><th class="n">الفعلي %</th><th>بداية فعلية</th><th>نهاية فعلية</th><th class="n">متبقي (يوم)</th><th class="n">النهاية المتوقعة</th><th class="n">الانحراف</th><th></th></tr></thead>
        <tbody>${list.map(({ a, r, b, planned, actual, needs }) => {
          const v = b && r.status !== 'complete' ? r.cal.wdb(b.f, r.f) : b ? r.cal.wdb(b.f, r.f) : null;
          const isM = a.type === 'milestone';
          return `<tr>
            <td class="t-mut">${esc(a.id)}</td><td dir="auto">${esc(a.name)} ${needs ? '<span class="tag risk">يحتاج تحديثاً</span>' : ''}</td>
            <td class="n num">${planned == null ? '—' : planned + '%'}</td>
            <td class="n" style="width:80px">${isM ? `<input type="checkbox" data-id="${esc(a.id)}" data-f="ms" ${actual === 100 ? 'checked' : ''} title="تحقّق المعلم">` : `<input type="number" min="0" max="100" value="${actual}" data-id="${esc(a.id)}" data-f="pct" data-fkey="${esc(a.id)}:pct">`}</td>
            <td style="width:140px"><input type="date" value="${a.actualStart || ''}" data-id="${esc(a.id)}" data-f="as" data-fkey="${esc(a.id)}:as"></td>

  const D = PF.D, esc = PF.esc;
  const WD = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

  function csv(S, C) {
    const bl = PF.CPM.baselineOf(S);
    const head = ['الرقم', 'النشاط', 'المجموعة', 'المدة', 'البداية', 'النهاية', 'Total Float', 'Free Float', 'الإنجاز %', 'حرج', 'بداية الأساس', 'نهاية الأساس', 'الميزانية', 'التكلفة الفعلية'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')];
    S.activities.forEach((a) => {
      const r = C.byId[a.id], b = bl && bl.data[a.id], w = S.wbs.find((x) => x.id === a.wbs);
      lines.push([a.id, a.name, w ? w.name : '', a.dur, D.toIso(r.s), D.toIso(r.lastDay), r.tf, r.ff, r.status === 'complete' ? 100 : a.pct, r.critical ? 'نعم' : '', b ? D.toIso(b.s) : '', b ? D.toIso(b.dur > 0 ? r.cal.prev(b.f - 1) : b.s) : '', a.budget, a.actualCost].map(q).join(','));
    });
    return '﻿' + lines.join('\r\n'); // BOM لعرض العربية صحيحاً في Excel
  }


  // استيراد XER: قراءة → اختيار المشروع إن تعدّدت → ملخص ومقارنة مع تواريخ P6 → تأكيد
  function importXer(buf, fname) {
    let P;
    try { P = PF.XER.parse(PF.XER.decode(buf)); } catch (x) { PF.toast('تعذّر قراءة الملف: ' + x.message, 'err'); return; }
    if (P.projects.length > 1) {
      let pick = P.projects[0].id;
      const m = PF.modal({
        title: 'اختر المشروع', body: '<p style="margin-top:0">الملف يحتوي أكثر من مشروع. أي واحد تريد استيراده؟</p><select id="xp" style="width:100%">' + P.projects.map((p) => `<option value="${esc(p.id)}">${esc(p.name)} (${p.tasks} نشاط)</option>`).join('') + '</select>',
        actions: [{ label: 'إلغاء' }, { label: 'متابعة', kind: 'primary', onClick: (api) => { pick = api.body.querySelector('#xp').value; setTimeout(() => review(P, pick, fname), 0); } }],
      });
      return m;
    }
    review(P, P.projects[0] && P.projects[0].id, fname);
  }

  function review(P, projId, fname) {
    let R, C2, cmp;
    try { R = PF.XER.toState(P, { projId }); C2 = PF.CPM.run(R.state); cmp = PF.XER.compare(R.state, C2, R.p6); } catch (x) { PF.toast('تعذّر الاستيراد: ' + x.message, 'err'); return; }
    const S = R.state, n = S.activities.length;
    const rel = S.activities.reduce((k, a) => k + a.preds.length, 0);
    const pctOf = (k) => (cmp.total ? Math.round((k / cmp.total) * 100) : 0);
    const good = cmp.total && cmp.matchStart === cmp.total && cmp.matchFinish === cmp.total;
    const rows = cmp.diffs.slice(0, 8).map((d) => `<tr><td class="num">${esc(d.id)}</td><td dir="auto">${esc(d.name)}</td><td class="n num">${D.fmt(D.toNum(d.p6s))} ← ${D.fmt(D.toNum(d.p6f))}</td><td class="n num">${D.fmt(D.toNum(d.s))} ← ${D.fmt(D.toNum(d.f))}</td></tr>`).join('');
    const body = `
      <p style="margin:0 0 8px"><b dir="auto">${esc(S.meta.name)}</b> — ${n} نشاط، ${rel} علاقة، ${S.calendars.length} تقويم، ${S.resources.length} مورد. تاريخ البيانات ${D.fmtLong(D.toNum(S.meta.dataDate))}.</p>
      <div class="note ${good ? '' : 'warn'}" style="margin:8px 0">${cmp.total
        ? `<b>مقارنة مع P6:</b> تطابقت بداية ${cmp.matchStart} من ${cmp.total} نشاط (${pctOf(cmp.matchStart)}%) ونهاية ${cmp.matchFinish} من ${cmp.total} (${pctOf(cmp.matchFinish)}%).${good ? ' الحسابات مطابقة تماماً.' : ' الفروقات أدناه (P6 | PlanFlow):'}`
        : 'لا توجد تواريخ مبكرة في الملف للمقارنة.'}</div>
      ${rows ? `<div class="tw" style="max-height:220px;overflow:auto"><table class="t"><thead><tr><th>الرقم</th><th>النشاط</th><th class="n">P6</th><th class="n">PlanFlow</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${cmp.diffs.length > 8 ? `<div class="sub">+${cmp.diffs.length - 8} فروقات أخرى.</div>` : ''}
        <div class="sub">أسباب الفروقات الشائعة: خيار Progress Override بدل Retained Logic في P6، أو تقويم مختلف للـ Lag، أو قيود غير مدعومة.</div>` : ''}
      ${R.warnings.length ? `<ul class="sub" style="margin:10px 0 0;padding-inline-start:18px">${R.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="xbl" checked> احفظ الجدول المستورد كخط أساس (لتظهر مقارنة الإنجاز وSPI)</label>
      <p class="sub" style="margin:10px 0 0">سيُستبدل المشروع الحالي. صدّر نسخة احتياطية أولاً إن كنت تحتاجه.</p>`;
    PF.modal({
      title: 'استيراد من Primavera (XER)', body, wide: true,
      actions: [{ label: 'إلغاء' }, {
        label: 'استيراد', kind: 'primary',
        onClick: (api) => {
          const withBl = api.body.querySelector('#xbl').checked;
          // الاستيراد إضافة لا استبدال: تبقى بيانات المشروع (Master) والتغييرات والدفعات ويُحدَّث الجدول فقط
          const old = PF.Store.state, oi = old.info || {}, ni = S.info || {};
          const merged = Object.assign({}, ni); Object.keys(oi).forEach((k) => { if (oi[k] !== '' && oi[k] != null && !(Array.isArray(oi[k]) && !oi[k].length)) merged[k] = oi[k]; });
          S.info = merged; S.checklist = old.checklist;
          PF.Store.replace(S, { type: 'import', title: 'رفع ملف Primavera (XER): ' + (S.meta.name || ''), detail: [n + ' نشاط، ' + rel + ' علاقة، تاريخ البيانات ' + S.meta.dataDate].concat(cmp.total ? ['تطابق مع P6: ' + cmp.matchStart + '/' + cmp.total + ' بداية، ' + cmp.matchFinish + '/' + cmp.total + ' نهاية'] : []), source: fname || 'XER' });
          if (withBl) PF.Store.mutate((st) => { PF.Actions.captureBaseline(st, PF.Store.C, 'عند الاستيراد من XER'); });
          PF.toast('تم استيراد ' + n + ' نشاط من XER', 'ok');
          PF.App.show('checklist');
        },
      }],
    });
  }

  // استيراد Master Sheet (Excel): يختار مشروعاً من الصفوف ويحدّث بيانات المشروع الحالي
  async function importMaster(buf, fname) {
    let sheet, P;
    try {
      const wb = await PF.Xlsx.read(buf);
      sheet = wb.sheets.find((x) => PF.Master.findHeader(x.rows) >= 0);
      if (!sheet) throw new Error('لم أجد جدولاً فيه عمود Project ID');
      P = PF.Master.parse(sheet.rows);
    } catch (x) { PF.toast('تعذّر قراءة الملف: ' + x.message, 'err'); return; }
    if (!P.projects.length) { PF.toast('لا توجد مشاريع في الملف', 'err'); return; }
    const cur = PF.Store.state, curNo = (cur.info.projectNo || '').toLowerCase(), curName = (cur.meta.name || '').toLowerCase();
    let sel = P.projects.findIndex((p) => (curNo && p.id.toLowerCase() === curNo) || (curName && p.name.toLowerCase() === curName));
    const m = PF.modal({
      title: 'استيراد Master Sheet', wide: true,
      body: `<p style="margin-top:0">الورقة «${esc(sheet.name)}» — ${P.projects.length} مشروع. اختر المشروع الذي تريد سحب بياناته${sel >= 0 ? ' (طابقتُ المشروع الحالي تلقائياً)' : ''}:</p>
        <select id="mp" style="width:100%">${P.projects.map((p, i) => `<option value="${i}" ${i === (sel < 0 ? 0 : sel) ? 'selected' : ''}>${esc(p.id || '—')} — ${esc(p.name)} (${esc(p.status)})</option>`).join('')}</select>
        <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="mfill"> املأ الحقول الفارغة فقط (لا تستبدل ما أدخلته)</label>
        <p class="sub" style="margin:10px 0 0">يُسجَّل الاستيراد في «سجل التحديثات» مع الحقول التي تغيّرت. لا يمس الأنشطة والجدول.</p>`,
      actions: [{ label: 'إلغاء' }, {
        label: 'استيراد', kind: 'primary',
        onClick: (api) => {
          const pr = P.projects[+api.body.querySelector('#mp').value], fillOnly = api.body.querySelector('#mfill').checked;
          const R = PF.Master.toInfo(sheet.rows, pr.row), lab = Object.fromEntries(PF.Info.FIELDS.map((f) => [f[0], f[1]]));
          const detail = [];
          PF.Store.mutate((st) => {
            const info = st.info;
            Object.keys(R.info).forEach((k) => {
              const v = R.info[k];
              if (Array.isArray(v)) { if (!v.length) return; if (fillOnly && info[k].length) return; if (JSON.stringify(info[k]) !== JSON.stringify(v)) { detail.push((k === 'vos' ? 'أوامر التغيير VO' : 'طلبات التغيير COR') + ': ' + info[k].length + ' ← ' + v.length); info[k] = v; } return; }
              if (fillOnly && info[k] !== '' && info[k] != null) return;
              if (String(info[k] == null ? '' : info[k]) !== String(v)) { detail.push((lab[k] || k) + ': ' + (info[k] === '' || info[k] == null ? '—' : info[k]) + ' ← ' + v); info[k] = v; }
            });
            if (R.currency && st.meta.currency !== R.currency) { detail.push('العملة: ' + st.meta.currency + ' ← ' + R.currency); st.meta.currency = R.currency; }
            if (R.meta.name && (!fillOnly || /^(مشروع جديد|)$/.test(st.meta.name))) { if (st.meta.name !== R.meta.name) detail.push('اسم المشروع: ' + st.meta.name + ' ← ' + R.meta.name); st.meta.name = R.meta.name; }
          }, { type: 'import', title: 'رفع Master Sheet: ' + (pr.id || pr.name), detail: ['(جارٍ الحساب)'], source: fname || 'Master.xlsx' });
          // استبدل تفاصيل المدخل الأخير بقائمة التغييرات الفعلية
          const st2 = PF.Store.state, last = st2.log[st2.log.length - 1];
          if (last && last.type === 'import') { last.detail = detail.length ? detail.slice(0, 40) : ['لا تغييرات: البيانات مطابقة']; PF.Store.persist(); }
          PF.toast('تم استيراد ' + detail.length + ' تغيير من الماستر', 'ok');
          PF.App.show('projectdata');
        },
      }],
    });
    return m;
  }

  // موزّع الملفات: XER أو Excel أو JSON — كل رفع يُسجَّل تحديثاً
  function importFile(f) {
    const rd = new FileReader();
    if (/\.xer$/i.test(f.name)) { rd.onload = () => importXer(rd.result, f.name); rd.readAsArrayBuffer(f); }
    else if (/\.xls[xm]$/i.test(f.name)) { rd.onload = () => importMaster(rd.result, f.name); rd.readAsArrayBuffer(f); }
    else { rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.activities || !o.meta) throw new Error('ملف غير صالح'); const co = o.company; delete o.company; if (co && co.holidays && co.holidays.length && !PF.Store.company.holidays.length) PF.Store.setCompany((x) => { x.holidays = PF.Company.merge(x.holidays, co.holidays); x.country = co.country || x.country; x.weekend = co.weekend || x.weekend; x.name = x.name || co.name || ''; }); PF.Store.replace(o, { type: 'import', title: 'رفع نسخة PlanFlow (JSON): ' + (o.meta.name || ''), detail: [(o.activities || []).length + ' نشاط'], source: f.name }); PF.toast('تم استيراد المشروع', 'ok'); } catch (x) { PF.toast('تعذّر الاستيراد: ' + x.message, 'err'); } }; rd.readAsText(f); }
  }

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    root.innerHTML = `
      <div class="pagehead"><h2>الإعدادات والبيانات</h2></div>
      <div class="grid g2" style="margin-bottom:14px">
        <div class="card"><h3>بيانات المشروع</h3>
          <label class="fld"><span>اسم المشروع</span><input dir="auto" data-m="name" value="${esc(S.meta.name)}"></label>
          <div class="row"><label class="fld"><span>الرمز</span><input data-m="code" value="${esc(S.meta.code)}"></label><label class="fld"><span>العميل</span><input dir="auto" data-m="client" value="${esc(S.meta.client)}"></label></div>
          <div class="row"><label class="fld"><span>تاريخ البداية</span><input type="date" data-m="startDate" value="${S.meta.startDate}"></label>
            <label class="fld"><span>العملة</span><input data-m="currency" value="${esc(S.meta.currency)}"></label></div>
          <div class="row"><label class="fld"><span>تقويم المشروع الافتراضي</span><select data-m="defaultCal">${PF.opts(S.calendars.map((c) => [c.id, c.name]), S.meta.defaultCal)}</select></label></div>
          <div class="row"><label class="fld"><span>النشاط حرج إذا Float ≤</span><input type="number" data-m="criticalFloat" data-n value="${S.meta.criticalFloat}"></label>
            <label class="fld"><span>شبه حرج إذا Float ≤</span><input type="number" data-m="nearCritical" data-n value="${S.meta.nearCritical}"></label></div>
        </div>
        <div class="card"><h3>البيانات والنسخ الاحتياطي</h3>
          <p class="sub" style="margin-top:0">كل شيء يُحفظ تلقائياً في هذا المتصفح فقط. صدّر نسخة احتياطية بانتظام، أو لنقل المشروع لجهاز آخر.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <button class="btn primary" data-act="json">${PF.icon('download')} تصدير المشروع (JSON)</button>
            <button class="btn" data-act="csv">${PF.icon('download')} تصدير الجدول (CSV/Excel)</button>
            <button class="btn" data-act="xer">${PF.icon('download')} تصدير XER</button></div>
          <h3 style="margin-top:18px">رفع تحديث</h3>
          <p class="sub" style="margin-top:0">ارفع أي نوع: ملف Primavera (XER) يحدّث الجدول مع مقارنة بتواريخ P6، أو Master Sheet (Excel) يحدّث بيانات المشروع، أو نسخة PlanFlow (JSON). كل رفع يُسجَّل في <a class="link" href="#/log">سجل التحديثات</a> بتاريخه.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <button class="btn primary" data-act="import">${PF.icon('upload')} رفع ملف (XER / Excel / JSON)</button><input type="file" id="file" accept=".json,.xer,.xlsx,.xlsm,application/json" hidden></div>
          <h3 style="margin-top:18px">ابدأ من جديد</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" data-act="blank">مشروع فارغ</button>
            <button class="btn" data-act="sample">استعادة المشروع التجريبي</button></div>
          <p class="sub" style="margin:10px 0 0">هذه الأزرار تستبدل المشروع الحالي (يمكن التراجع عنها بـ Ctrl+Z في نفس الجلسة).</p>
        </div>
      </div>
      <div class="card"><h3>التقويمات<span class="sp"></span><button class="btn sm" data-act="addcal">${PF.icon('plus', 14)} تقويم جديد</button></h3>
        <p class="sub" style="margin-top:0">التقويم يحدد أيام العمل والعطل. يمكن إسناد تقويم مختلف لأي نشاط من «تفاصيل النشاط» (مثلاً أعمال الموقع 6 أيام في الأسبوع).</p>
        ${S.calendars.map((c, ci) => `
          <div class="card" style="margin-bottom:10px;background:#fff">
            <div class="row"><label class="fld" style="flex:3 1 260px"><span>اسم التقويم</span><input dir="auto" data-cal="${ci}" data-k="name" value="${esc(c.name)}"></label>
              <div class="fld"><span>&nbsp;</span>${S.calendars.length > 1 ? `<button class="btn sm" data-delcal="${ci}">حذف التقويم</button>` : ''}</div></div>
            <div class="fld"><span>أيام العمل</span><div style="display:flex;gap:12px;flex-wrap:wrap">${WD.map((n, d) => `<label style="display:inline-flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" data-cal="${ci}" data-wd="${d}" ${c.workdays.includes(d) ? 'checked' : ''}>${n}</label>`).join('')}</div></div>
            <label style="display:flex;gap:8px;align-items:center;margin:4px 0 10px;cursor:pointer"><input type="checkbox" data-cal="${ci}" data-usecomp ${c.useCompany === false ? '' : 'checked'}> طبّق عطل الشركة (${PF.Store.company.holidays.length} يوم) على هذا التقويم <a href="#/company" class="link">إدارة</a></label>
            <div class="fld"><span>عطل خاصة بهذا التقويم فقط</span><div class="chips">${(c.holidays || []).map((h, hi) => `<span class="chip">${D.fmtLong(D.toNum(h))} <button class="link" style="margin-inline-start:6px;text-decoration:none" data-cal="${ci}" data-delhol="${hi}" aria-label="حذف">✕</button></span>`).join('') || '<span class="t-mut">لا توجد عطل</span>'}
              <input type="date" data-cal="${ci}" data-addhol style="width:auto" aria-label="إضافة عطلة"></div></div>
          </div>`).join('')}
      </div>
      <div class="sub" style="margin-top:14px">محرك الجدولة: مسار حرج (CPM) بعلاقات FS/SS/FF/SF مع Lag، قيود زمنية، تقويمات متعددة، Total/Free Float. ${C.project.errors.length ? '' : 'لا توجد أخطاء في العلاقات.'}</div>`;

    root.onchange = (e) => {
      const el = e.target;
      if (el.dataset.m) { PF.Store.mutate((st) => { st.meta[el.dataset.m] = el.dataset.n !== undefined ? +el.value : el.value; }); return; }
      if (el.id === 'file') {
        const f = el.files[0]; if (!f) return;
        importFile(f);
        el.value = ''; return;
      }
      if (el.dataset.cal == null) return;
      const ci = +el.dataset.cal;
      if (el.dataset.k === 'name') PF.Store.mutate((st) => { st.calendars[ci].name = el.value; });
      else if (el.hasAttribute('data-usecomp')) PF.Store.mutate((st) => { st.calendars[ci].useCompany = el.checked; });
      else if (el.dataset.wd != null) {
        const d = +el.dataset.wd;
        const cur = S.calendars[ci].workdays.filter((x) => x !== d).concat(el.checked ? [d] : []);
        if (!cur.length) { PF.toast('يجب أن يبقى يوم عمل واحد على الأقل', 'err'); PF.App.render(false); return; }
        PF.Store.mutate((st) => { st.calendars[ci].workdays = cur.sort(); });
      } else if (el.hasAttribute('data-addhol') && el.value) PF.Store.mutate((st) => { const h = st.calendars[ci].holidays; if (!h.includes(el.value)) h.push(el.value); h.sort(); });
    };
    root.onclick = async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'json') PF.download((S.meta.code || 'project') + '.planflow.json', JSON.stringify(Object.assign({}, S, { company: PF.Store.company }), null, 1), 'application/json');
      else if (a === 'csv') PF.download((S.meta.code || 'schedule') + '.csv', csv(S, C), 'text/csv;charset=utf-8');
      else if (a === 'xer') PF.download((S.meta.code || 'project') + '.xer', PF.XER.fromState(S, C), 'text/plain;charset=utf-8');
      else if (a === 'import') PF.$('#file').click();
      else if (a === 'blank') { if (await PF.confirm('سيُستبدل المشروع الحالي بمشروع فارغ. هل تريد المتابعة؟', 'متابعة', true)) PF.Store.blank(); }
      else if (a === 'sample') { if (await PF.confirm('سيُستبدل المشروع الحالي بالمشروع التجريبي. هل تريد المتابعة؟', 'متابعة', true)) PF.Store.reset(); }
      else if (a === 'addcal') PF.Store.mutate((st) => st.calendars.push({ id: PF.uid('cal'), name: 'تقويم جديد', workdays: [0, 1, 2, 3, 4], holidays: [] }));
      else if (b.dataset.delcal != null) {
        const ci = +b.dataset.delcal, id = S.calendars[ci].id;
        PF.Store.mutate((st) => { st.calendars.splice(ci, 1); st.activities.forEach((x) => { if (x.cal === id) x.cal = ''; }); if (st.meta.defaultCal === id) st.meta.defaultCal = st.calendars[0].id; });
      } else if (b.dataset.delhol != null) PF.Store.mutate((st) => st.calendars[+b.dataset.cal].holidays.splice(+b.dataset.delhol, 1));
    };
  }

  PF.Views.settings = { render, importXer, importMaster, importFile };
})(window);

</script>
  <script>
/* PlanFlow — التنقل وإعادة الرسم */
(function (g) {
  const PF = g.PF;
  const D = PF.D;
  PF.Views = PF.Views || {};

  const NAV = [
    ['dashboard', 'الداشبورد التنفيذي', 'dashboard'],
    ['projectdata', 'بيانات المشروع', 'info'],
    ['checklist', 'قائمة التحقق', 'checklist'],
    ['wbs', 'هيكل WBS', 'wbs'],
    ['schedule', 'الجدول الزمني', 'schedule'],
    ['progress', 'تحديث التقدّم', 'progress'],
    ['baselines', 'خط الأساس', 'baselines'],
    ['scurve', 'منحنى S والأداء', 'scurve'],
    ['resources', 'الموارد', 'resources'],
    ['company', 'إعدادات الشركة والعطل', 'company'],
    ['log', 'سجل التحديثات', 'calendar'],
    ['settings', 'البيانات والاستيراد', 'settings'],
  ];

  let cur = 'dashboard';
  const scrollMem = {};

  function route() {
    const h = (location.hash || '').replace(/^#\/?/, '');
    return PF.Views[h] ? h : 'dashboard';
  }

  function drawNav() {
    const M = PF.Calc.metrics(PF.Store.state, PF.Store.C);
    PF.$('#nav').innerHTML = NAV.map(([id, label, ic]) => {
      let badge = '';
      if (id === 'schedule' && M.neg) badge = `<span class="badge" title="أنشطة بـ Float سالب">${M.neg}</span>`;
      if (id === 'checklist') { const k = PF.Info.summary(PF.Store.state, PF.Store.C).missing; if (k) badge = `<span class="badge" title="بنود ناقصة">${k}</span>`; }
      return `<a href="#/${id}" class="${id === cur ? 'on' : ''}">${PF.icon(ic)}<span>${label}</span>${badge}</a>`;
    }).join('');
  }

  function drawTop() {
    const S = PF.Store.state, st = PF.Store;
    const nv = NAV.find((n) => n[0] === cur), label = nv ? nv[1] : 'البداية';
    PF.$('#top').innerHTML = `
      <h1>${label}</h1>
      <span class="proj">${PF.esc(S.meta.name)}</span>
      <span class="sp"></span>
      <span class="pill" title="تاريخ البيانات: آخر يوم تم تحديث التقدّم حتى نهايته">تاريخ البيانات <b class="num">${D.fmtLong(D.toNum(S.meta.dataDate))}</b></span>
      <button class="btn icon-btn" id="undo" title="تراجع (Ctrl+Z)" ${st.canUndo ? '' : 'disabled'}>${PF.icon('undo')}</button>
      <button class="btn icon-btn" id="redo" title="إعادة (Ctrl+Y)" ${st.canRedo ? '' : 'disabled'}>${PF.icon('redo')}</button>
      <button class="btn icon-btn" id="print" title="طباعة">${PF.icon('print')}</button>`;
    PF.$('#undo').onclick = () => st.undo();
    PF.$('#redo').onclick = () => st.redo();
    PF.$('#print').onclick = () => window.print();
  }

  function render(first) {
    const main = PF.$('#view');
    // حفظ مواضع التمرير والتركيز
    main.querySelectorAll('[data-keepscroll]').forEach((el) => (scrollMem[el.dataset.keepscroll] = [el.scrollLeft, el.scrollTop]));
    const mainTop = main.scrollTop;
    const ae = document.activeElement;
    const fkey = ae && ae.dataset && ae.dataset.fkey;
    const sel = ae && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;

    document.title = 'PlanFlow — ' + PF.Store.state.meta.name;
    drawNav();
    drawTop();
    const v = PF.Views[cur];
    main.className = 'view' + (v.flush ? ' flush' : '');
    ['onclick', 'onchange', 'ondblclick', 'oninput', 'onpointerdown'].forEach((k) => (main[k] = null));
    main.innerHTML = '';
    v.render(main);

    main.querySelectorAll('[data-keepscroll]').forEach((el) => { const m = scrollMem[el.dataset.keepscroll]; if (m && !first) { el.scrollLeft = m[0]; el.scrollTop = m[1]; } });
    if (!first && !v.flush) main.scrollTop = mainTop;
    if (fkey) {
      const el = main.querySelector('[data-fkey="' + fkey.replace(/"/g, '\\"') + '"]');
      if (el) { el.focus(); try { if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); else el.select && el.select(); } catch (e) { /* date/number */ } }
    }
  }

  function show(id) {
    if (!PF.Views[id]) return;
    try { history.replaceState(null, '', '#/' + id); } catch (e) { /* معاينة معزولة */ }
    cur = id; render(true);
  }
  function go() {
    const next = route();
    if (next !== cur) { cur = next; render(true); }
  }

  function boot() {
    PF.Store.init();
    cur = (PF.Store.fresh && !location.hash) ? 'start' : route();
    window.addEventListener('hashchange', () => { cur = route(); render(true); });
    // تنقّل لا يعتمد على الـ hash (يعمل أيضاً داخل المعاينات المعزولة)
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#/"]');
      if (!a) return;
      e.preventDefault();
      const id = a.getAttribute('href').slice(2);
      if (!PF.Views[id]) return;
      try { history.replaceState(null, '', '#/' + id); } catch (err) { /* معاينة معزولة */ }
      if (a.hasAttribute('data-crit') && PF.Views.schedule.setFilter) PF.Views.schedule.setFilter('crit');
      cur = id; render(true);
    });
    PF.Store.subscribe(() => render(false));
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? PF.Store.redo() : PF.Store.undo(); }
      if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); PF.Store.redo(); }
    });
    render(true);
  }

  PF.App = { go, show, render, NAV };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
</body>
</html>
