<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanFlow — إدارة الجداول الزمنية للمشاريع</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --bg: #eceeed; --panel: #fbfbfa; --ink: #14202b; --muted: #667380; --line: #d9dedc; --line2: #e8ebe9;
  --side: #12202c; --side2: #1b2d3c; --side-ink: #b9c6d2;
  --hv: #f4c20d;            /* لون السلامة (أصفر الموقع) */
  --primary: #1f56c4; --primary-d: #17429c;
  --crit: #d9482b; --near: #e08a00; --ok: #1e8f63; --bar: #3a64c8; --done: #8a97a3;
  --r: 8px; --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.num, td.n, .tabular { font-variant-numeric: tabular-nums; }

/* ---------- الهيكل ---------- */
.app { display: grid; grid-template-columns: 228px 1fr; height: 100vh; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding: 18px 12px; gap: 6px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; color: #fff; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
.brand small { display: block; font-size: 11px; color: var(--side-ink); font-weight: 400; margin-top: -2px; }
.mark { width: 34px; height: 34px; background: var(--hv); border-radius: 7px; position: relative; flex: none; }
.mark::before, .mark::after { content: ''; position: absolute; height: 5px; background: var(--side); border-radius: 2px; }
.mark::before { right: 7px; top: 9px; width: 14px; }
.mark::after { left: 7px; top: 19px; width: 17px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 7px; color: var(--side-ink); text-decoration: none; position: relative; cursor: pointer; transition: background .15s, color .15s; }
.nav a:hover { background: var(--side2); color: #fff; }
.nav a.on { background: var(--side2); color: #fff; font-weight: 600; }
.nav a.on::before { content: ''; position: absolute; right: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 3px 0 0 3px; background: var(--hv); }
.nav .badge { margin-inline-start: auto; background: var(--crit); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 600; }
.side .foot { margin-top: auto; font-size: 11.5px; color: #7f91a2; padding: 10px 8px 0; line-height: 1.7; }
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { font-size: 18px; }
.top .proj { color: var(--muted); font-size: 13px; }
.top .sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 3px 11px; font-size: 12.5px; white-space: nowrap; }
.pill b { font-weight: 600; }
.view { flex: 1; overflow: auto; padding: 20px 22px 40px; min-height: 0; }
.view.flush { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- أزرار وحقول ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 13px; cursor: pointer; font-weight: 500; transition: background .12s, border-color .12s; white-space: nowrap; }
.btn:hover { background: #f1f3f2; border-color: #c4cbc8; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-d); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 32px; height: 32px; padding: 0; justify-content: center; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.fld > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea { border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 6px 9px; min-width: 0; width: 100%; }
input:not([type=checkbox]):not([type=hidden]), select { height: 34px; }
textarea { height: auto; }
.num { direction: ltr; unicode-bidi: isolate; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }
textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row > .fld { flex: 1 1 130px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip i { font-style: normal; opacity: .65; margin-inline-start: 4px; }

/* ---------- بطاقات ---------- */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g21 { grid-template-columns: 2fr 1fr; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card > h3 { font-size: 14.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.kpi { padding: 14px 16px; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi .v { font-size: 25px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.bad { border-top: 3px solid var(--crit); } .kpi.warn { border-top: 3px solid var(--near); } .kpi.good { border-top: 3px solid var(--ok); } .kpi.neutral { border-top: 3px solid var(--line); }
.t-bad { color: var(--crit); } .t-warn { color: var(--near); } .t-good { color: var(--ok); } .t-mut { color: var(--muted); }
.bar-track { height: 7px; background: var(--line2); border-radius: 4px; overflow: hidden; position: relative; margin-top: 7px; }
.bar-track i { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 4px; }
.bar-track b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.stack { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: var(--line2); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 12.5px; margin: -4px 0 12px; }
.pagehead { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.pagehead h2 { font-size: 20px; } .pagehead .sp { flex: 1; }

/* ---------- جداول ---------- */
.tw { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { background: #f0f2f1; text-align: start; font-weight: 600; font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: #f6f8f7; }
table.t td.n, table.t th.n { text-align: center; }
table.t input, table.t select { padding: 3px 6px; font-size: 13px; }
table.t input[type=number] { text-align: center; }
.tag { display: inline-block; border-radius: 5px; padding: 1px 8px; font-size: 12px; font-weight: 500; background: var(--line2); white-space: nowrap; }
.tag.late, .tag.crit { background: #fbe3dd; color: #a6301a; } .tag.risk, .tag.near { background: #fdecd0; color: #8f5600; }
.tag.ok, .tag.done { background: #d9f0e6; color: #146845; } .tag.info { background: #dfe8fa; color: #1d3f8f; }
.tag.none { background: var(--line2); color: var(--muted); }
.link { color: var(--primary); cursor: pointer; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line2); }
.qrow:last-child { border-bottom: 0; }
.qrow .c { min-width: 28px; text-align: center; font-weight: 700; border-radius: 5px; padding: 0 6px; background: #d9f0e6; color: #146845; }
.qrow .c.bad { background: #fbe3dd; color: #a6301a; } .qrow .c.warn { background: #fdecd0; color: #8f5600; }

/* ---------- الجدول الزمني + Gantt ---------- */
.stool { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.stool .sp { flex: 1; }
.stool input[type=text], .stool select { width: auto; min-width: 120px; }
.stool label.cb { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; cursor: pointer; }
.sgrid { flex: 1; overflow: auto; background: #fff; direction: ltr; position: relative; min-height: 0; }
.sinner { position: relative; min-width: 100%; }
.shead, .srow { display: flex; }
.shead { position: sticky; top: 0; z-index: 6; height: 44px; background: #eef0ef; border-bottom: 1px solid var(--line); }
.scells { display: flex; align-items: center; flex: none; position: sticky; left: 0; z-index: 4; background: #fff; border-right: 2px solid var(--line); width: var(--tblw, 860px); }
.shead .scells { background: #eef0ef; z-index: 7; font-size: 12px; font-weight: 600; height: 100%; }
.c { flex: none; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.c-id { width: 74px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.c-name { width: 244px; }
.c-dur { width: 52px; text-align: center; } .c-s, .c-f, .c-bs, .c-bf { width: 80px; text-align: center; font-size: 12.5px; } .c-bs, .c-bf { color: var(--muted); } .c-sp { width: 56px; text-align: center; font-size: 12.5px; color: var(--muted); } .c-tf { width: 52px; text-align: center; } .c-pct { width: 56px; text-align: center; }
.srow { height: 34px; border-bottom: 1px solid var(--line2); }
.srow .scells { height: 34px; }
.srow.sel .scells, .srow.sel .gcell { background: #eaf0fc; }
.srow:hover .scells { background: #f6f8f7; } .srow.sel:hover .scells { background: #eaf0fc; }
.srow.grp .scells { background: #f0f2f1; font-weight: 600; }
.srow.grp .c-name { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.srow.grp .caret { transition: transform .15s; } .srow.grp.col .caret { transform: rotate(90deg); }
.cell-in { border: 1px solid transparent !important; background: transparent !important; width: 100%; padding: 3px 4px !important; border-radius: 5px; height: 26px; }
.cell-in:hover { border-color: var(--line) !important; } .cell-in:focus { border-color: var(--primary) !important; background: #fff !important; }
.cell-in[type=number] { text-align: center; -moz-appearance: textfield; }
.cell-in::-webkit-outer-spin-button, .cell-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); flex: none; } .sdot.crit { background: var(--crit); } .sdot.near { background: var(--near); } .sdot.done { background: var(--ok); }
.tfv.neg { color: var(--crit); font-weight: 700; } .tfv.zero { color: var(--crit); font-weight: 600; } .tfv.low { color: var(--near); }
.gcell { position: relative; flex: none; height: 34px; }
.mth, .wk { position: absolute; top: 0; border-left: 1px solid var(--line); font-size: 11.5px; padding: 0 5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.mth { height: 22px; line-height: 22px; font-weight: 600; color: var(--ink); direction: rtl; } .wk { top: 22px; height: 22px; line-height: 22px; }
.gbg { position: absolute; top: 44px; bottom: 0; left: var(--tblw, 640px); right: 0; pointer-events: none; z-index: 0; }
.nw { position: absolute; top: 0; bottom: 0; background: rgba(20, 32, 43, .045); }
.dline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--crit); z-index: 2; } .dline.today { border-left: 1.5px dashed var(--primary); }
.dline span { position: absolute; top: 2px; left: 4px; font-size: 11px; background: var(--crit); color: #fff; padding: 0 5px; border-radius: 3px; direction: rtl; white-space: nowrap; } .dline.today span { background: var(--primary); }
.rows { position: relative; }
.links { position: absolute; top: 0; left: var(--tblw, 640px); pointer-events: none; z-index: 1; overflow: visible; }
.links path { fill: none; stroke: #8b98a5; stroke-width: 1.2; } .links path.crit { stroke: var(--crit); stroke-width: 1.5; } .links polygon { fill: #8b98a5; } .links polygon.crit { fill: var(--crit); }
.bar { position: absolute; top: 8px; height: 18px; border-radius: 4px; background: var(--bar); z-index: 3; cursor: grab; min-width: 3px; box-shadow: 0 1px 0 rgba(0,0,0,.12); touch-action: none; }
.bar.crit { background: var(--crit); } .bar.near { background: var(--near); } .bar.done { background: var(--done); cursor: default; } .bar.prog { cursor: default; }
.bar .pf { position: absolute; inset: 0 auto 0 0; background: rgba(0, 0, 0, .32); border-radius: 4px 0 0 4px; }
.bar .rh { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.bar.dragging { opacity: .75; cursor: grabbing; z-index: 8; }
.ms { position: absolute; top: 9px; width: 16px; height: 16px; background: var(--ink); transform: translateX(-8px) rotate(45deg); z-index: 3; border-radius: 2px; cursor: default; } .ms.crit { background: var(--crit); } .ms.done { background: var(--done); }
.gsum { position: absolute; top: 12px; height: 8px; background: var(--ink); z-index: 3; border-radius: 1px; }
.gsum::before, .gsum::after { content: ''; position: absolute; top: 5px; border: 5px solid transparent; border-top: 6px solid var(--ink); } .gsum::before { left: 0; } .gsum::after { right: 0; }
.fl { position: absolute; top: 16px; height: 3px; background: repeating-linear-gradient(90deg, rgba(20, 32, 43, .35) 0 3px, transparent 3px 5px); z-index: 2; }
.bl { position: absolute; top: 27px; height: 4px; background: #9aa6b0; border-radius: 2px; z-index: 2; }
.blabel { position: absolute; top: 8px; line-height: 18px; font-size: 12px; color: #45525e; white-space: nowrap; z-index: 3; direction: rtl; pointer-events: none; }
.sched-empty { padding: 40px; text-align: center; color: var(--muted); direction: rtl; }
.collapsed-tbl .c-dur, .collapsed-tbl .c-s, .collapsed-tbl .c-f, .collapsed-tbl .c-bs, .collapsed-tbl .c-bf, .collapsed-tbl .c-tf, .collapsed-tbl .c-pct, .collapsed-tbl .c-sp { display: none; }

/* ---------- نوافذ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 25, 35, .5); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; z-index: 100; overflow-y: auto; }
.modal { background: var(--panel); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); animation: pop .16s ease-out; }
.modal.wide { width: min(860px, 100%); }
@keyframes pop { from { transform: translateY(8px); opacity: .4; } }
.modal header { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal header h3 { flex: 1; font-size: 16px; }
.modal .x { border: 0; background: none; font-size: 16px; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; } .modal .x:hover { background: var(--line2); }
.mbody { padding: 16px 18px; max-height: 68vh; overflow-y: auto; }
.modal footer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); justify-content: flex-start; }
.msec { margin-bottom: 18px; } .msec > h4 { font-size: 13.5px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line2); }
.rel { display: grid; grid-template-columns: 1fr 86px 78px 32px; gap: 6px; margin-bottom: 6px; align-items: center; }
.rel.res { grid-template-columns: 1fr 100px 32px; }
#toasts { position: fixed; bottom: 18px; left: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); font-size: 13.5px; animation: pop .2s; transition: opacity .3s; max-width: 380px; }
.toast.err { background: var(--crit); } .toast.ok { background: var(--ok); } .toast.out { opacity: 0; }

/* ---------- مخططات ---------- */
.chart { width: 100%; } .chart-svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line2); stroke-width: 1; } .chart .grid.v { stroke: #f0f2f1; }
.chart .ax { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-inline-end: 6px; vertical-align: middle; }

.note { background: #fff8e1; border: 1px solid #f0dc9a; border-radius: 8px; padding: 9px 13px; font-size: 13px; margin-bottom: 14px; }
.note.bad { background: #fdeceb; border-color: #f1b9ae; }

@media (max-width: 1100px) { .g4, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; } .g21 { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
  .side { flex-direction: row; overflow-x: auto; padding: 8px; align-items: center; } .brand, .side .foot { display: none; }
  .nav { display: flex; gap: 4px; } .nav a { white-space: nowrap; padding: 8px 11px; } .nav a.on::before { display: none; }
  .main { height: auto; } .view { overflow: visible; padding: 14px; } .g2, .g3, .g4, .g6 { grid-template-columns: 1fr; }
  .view.flush { min-height: 80vh; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print {
  .side, .top .btn, .stool, .no-print { display: none !important; } .app { display: block; height: auto; } .main, .view { height: auto; overflow: visible; }
  body { background: #fff; } .card { break-inside: avoid; }
}

/* WBS شجري + صف ملخص المشروع */
.srow.grp.proj .scells { background: #1d3a6b; color: #fff; font-weight: 700; }
.srow.grp.proj .c-name { cursor: default; }
.srow.grp.proj .t-mut { color: #b9c6e0; }
.srow.grp.sel .scells { background: #e3ebfb; }
.srow.grp .caret.dim { opacity: .3; }
.srow.grp .c-id { font-weight: 500; }
.srow .c-name { box-sizing: border-box; }
.srow:not(.grp) .c-name .cell-in { width: 100%; }

/* صفحة WBS */
.wtool { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.vsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.wtree { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.wrow { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-bottom: 1px solid var(--line2); cursor: pointer; }
.wrow:last-child { border-bottom: 0; }
.wrow:hover { background: #f6f8f7; } .wrow.sel { background: #eaf0fc; }
.wcode { width: 64px; color: var(--muted); font-size: 12.5px; flex: none; }
.wname { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.wname .cell-in { flex: 1; min-width: 0; }
.wdot { width: 9px; height: 9px; border-radius: 2px; background: var(--line); flex: none; } .wdot.par { background: var(--ink); }
.wcnt { color: var(--muted); font-size: 12.5px; width: 70px; text-align: center; flex: none; }

/* إعدادات الشركة: شبكة السنة + عطل على الـ Gantt */
.ygrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ymon { font-size: 11px; } .ymon b { display: block; font-size: 12px; margin-bottom: 3px; }
.yd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; direction: ltr; }
.yd i { font-style: normal; text-align: center; height: 17px; line-height: 17px; font-size: 10px; border-radius: 2px; color: var(--muted); }

  <script>
/* PlanFlow — أدوات التواريخ. التاريخ يُخزَّن كنص ISO ويُحسب كرقم أيام (أيام منذ 1970-01-01). */
(function (g) {
  const PF = (g.PF = g.PF || {});
  const MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const D = {
    MONTHS, DAYS,
    toNum(iso) {
      const p = String(iso).slice(0, 10).split('-');
      return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
    },
    toIso(n) { return new Date(n * 86400000).toISOString().slice(0, 10); },
    dow(n) { return (((n + 4) % 7) + 7) % 7; }, // 0 = الأحد
    parts(n) { const d = new Date(n * 86400000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; },
    fmt(n) {
      if (n == null || isNaN(n)) return '';
      const p = D.parts(n);
      return String(p.d).padStart(2, '0') + '/' + String(p.m + 1).padStart(2, '0') + '/' + String(p.y).slice(2);
    },
    fmtLong(n) { const p = D.parts(n); return p.d + ' ' + MONTHS[p.m] + ' ' + p.y; },
    today() { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000); },
    daysInMonth(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); },
  };
  PF.D = D;
  if (typeof module !== 'undefined' && module.exports) module.exports = D;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* PlanFlow — محرك الجدولة (CPM)
 * النموذج: كل نشاط له بداية S (أول يوم عمل) ونهاية F (حصرية = اليوم التالي لآخر يوم عمل).
 * المعلم (milestone): S = F. الـ Lag بأيام عمل. الـ Float بأيام عمل حسب تقويم النشاط.
 * تاريخ البيانات (dataDate) = نهاية ذلك اليوم؛ العمل المتبقي يبدأ من اليوم التالي.
 */
(function (g) {
  const PF = (g.PF = g.PF || {});
  const D = PF.D || (typeof require !== 'undefined' ? require('./dates.js') : null);

  function makeCal(c) {
    const wd = new Set(c && c.workdays && c.workdays.length ? c.workdays : [0, 1, 2, 3, 4, 5, 6]);
    const hol = new Set(((c && c.holidays) || []).map((x) => D.toNum(typeof x === 'string' ? x : x.date)));
    const isWork = (n) => wd.has(D.dow(n)) && !hol.has(n);
    const next = (n) => { let k = 0; while (!isWork(n) && k++ < 3700) n++; return n; };
    const prev = (n) => { let k = 0; while (!isWork(n) && k++ < 3700) n--; return n; };
    const s2f = (S, dur) => { if (dur <= 0) return S; let l = next(S); for (let i = 1; i < dur; i++) l = next(l + 1); return l + 1; };
    const f2s = (F, dur) => { if (dur <= 0) return F; let s = prev(F - 1); for (let i = 1; i < dur; i++) s = prev(s - 1); return s; };
    const shift = (d, lag) => { let x = next(d); for (let i = 0; i < lag; i++) x = next(x + 1); for (let i = 0; i < -lag; i++) x = prev(x - 1); return x; };
    const unshift = (d, lag) => { let x = d; for (let i = 0; i < lag; i++) x = prev(x - 1); for (let i = 0; i < -lag; i++) x = next(x + 1); return x; };
    const wdb = (a, b) => {
      if (a === b) return 0;
      let c = 0;
      if (a < b) { for (let x = a; x < b; x++) if (isWork(x)) c++; return c; }
      for (let x = b; x < a; x++) if (isWork(x)) c++;
      return -c;
    };
    const lastDay = (S, F, dur) => (dur <= 0 ? S : prev(F - 1));
    return { isWork, next, prev, s2f, f2s, shift, unshift, wdb, lastDay };
  }

  function run(P) {
    const meta = P.meta;
    const cals = {};
    (P.calendars || []).forEach((c) => (cals[c.id] = makeCal(c)));
    const defCal = cals[meta.defaultCal] || makeCal(null);
    const calOf = (a) => (a.cal && cals[a.cal]) || defCal;
    const acts = P.activities;
    const byAct = {};
    acts.forEach((a) => (byAct[a.id] = a));
    const succ = {};
    acts.forEach((a) => (succ[a.id] = []));
    acts.forEach((a) => (a.preds || []).forEach((r) => { if (byAct[r.id] && r.id !== a.id) succ[r.id].push({ to: a.id, r }); }));

    // ترتيب طوبولوجي
    const indeg = {};
    acts.forEach((a) => (indeg[a.id] = (a.preds || []).filter((r) => byAct[r.id] && r.id !== a.id).length));
    const q = acts.filter((a) => indeg[a.id] === 0).map((a) => a.id);
    const order = [];
    while (q.length) {
      const id = q.shift();
      order.push(id);
      succ[id].forEach((e) => { if (--indeg[e.to] === 0) q.push(e.to); });
    }
    const errors = [];
    if (order.length < acts.length) {
      const left = acts.filter((a) => !order.includes(a.id)).map((a) => a.id);
      errors.push({ type: 'cycle', ids: left });
      left.forEach((id) => order.push(id));
    }

    const dataDate = D.toNum(meta.dataDate);
    const projStart = D.toNum(meta.startDate);
    const res = {};

    // ---- الاتجاه الأمامي ----
    for (const id of order) {
      const a = byAct[id];
      const cal = calOf(a);
      const dur = a.type === 'milestone' ? 0 : Math.max(0, +a.dur || 0);
      const r = { id, dur, cal };
      r.status = a.actualFinish ? 'complete' : a.actualStart ? 'inprogress' : 'notstarted';
      if (r.status === 'complete') {
        const af = D.toNum(a.actualFinish);
        const as = a.actualStart ? D.toNum(a.actualStart) : af;
        r.s = as; r.f = dur === 0 ? af : af + 1; r.rem = 0;
      } else if (r.status === 'inprogress') {
        const as = D.toNum(a.actualStart);
        const rem = a.remaining != null && a.remaining !== '' ? Math.max(1, +a.remaining) : Math.max(1, Math.ceil((dur * (100 - (+a.pct || 0))) / 100));
        r.rem = rem;
        r.s = as;
        r.f = cal.s2f(cal.next(Math.max(dataDate + 1, as)), rem);
      } else {
        r.rem = dur;
        let sMin = cal.next(Math.max(projStart, dataDate + 1));
        let fMin = -Infinity;
        for (const p of a.preds || []) {
          const pr = res[p.id];
          if (!pr) continue;
          const lag = +p.lag || 0, t = p.type || 'FS';
          if (t === 'FS') sMin = Math.max(sMin, cal.shift(pr.f, lag));
          else if (t === 'SS') sMin = Math.max(sMin, cal.shift(pr.s, lag));
          else if (t === 'FF') { const L = pr.dur > 0 ? pr.cal.prev(pr.f - 1) : pr.s; fMin = Math.max(fMin, cal.shift(L, lag) + 1); }
          else if (t === 'SF') fMin = Math.max(fMin, cal.shift(pr.s, lag) + 1);
        }
        const c = a.constraint;
        const cd = c && c.date ? D.toNum(c.date) : null;
        if (c && cd != null) {
          if (c.type === 'SNET') sMin = Math.max(sMin, cal.next(cd));
          else if (c.type === 'FNET') fMin = Math.max(fMin, cd + 1);
        }
        let S = sMin, F = cal.s2f(S, dur);
        if (fMin > F) { if (dur === 0) { S = F = Math.max(S, cal.next(fMin - 1)); } else { F = fMin; S = cal.f2s(F, dur); } }
        if (c && cd != null) {
          if (c.type === 'MSO') { S = cal.next(cd); F = cal.s2f(S, dur); }
          else if (c.type === 'MFO') { if (dur === 0) S = F = cd; else { F = cd + 1; S = cal.f2s(F, dur); } }
        }
        r.s = S; r.f = F;
      }
      r.lastDay = cal.lastDay(r.s, r.f, dur);
      res[id] = r;
    }

    let projF = -Infinity, projLast = -Infinity, projS = Infinity;
    acts.forEach((a) => { const r = res[a.id]; projF = Math.max(projF, r.f); projLast = Math.max(projLast, r.lastDay); projS = Math.min(projS, r.s); });
    if (!acts.length) { projF = projStart; projLast = projStart; projS = projStart; }

    // ---- الاتجاه الخلفي ----
    for (let i = order.length - 1; i >= 0; i--) {
      const id = order[i];
      const a = byAct[id], r = res[id], cal = r.cal, dur = r.dur;
      if (r.status === 'complete') { r.ls = r.s; r.lf = r.f; continue; }
      let lf = Infinity;
      for (const e of succ[id]) {
        const sr = res[e.to];
        if (!sr || sr.lf === undefined) continue;
        const lag = +e.r.lag || 0, t = e.r.type || 'FS', sc = sr.cal;
        let cand;
        if (t === 'FS') cand = sc.unshift(sr.ls, lag);
        else if (t === 'SS') cand = cal.s2f(sc.unshift(sr.ls, lag), dur);
        else {
          const Ls = sr.dur > 0 ? sc.prev(sr.lf - 1) : sr.ls;
          if (t === 'FF') cand = sc.unshift(Ls, lag) + (dur > 0 ? 1 : 0);
          else cand = cal.s2f(sc.unshift(Ls, lag), dur);
        }
        lf = Math.min(lf, cand);
      }
      if (lf === Infinity) lf = projF;
      const c = a.constraint;
      const cd = c && c.date ? D.toNum(c.date) : null;
      if (c && cd != null) {
        if (c.type === 'FNLT') lf = Math.min(lf, cd + 1);
        else if (c.type === 'SNLT') lf = Math.min(lf, cal.s2f(cal.next(cd), dur));
        else if (c.type === 'MFO') lf = cd + 1;
        else if (c.type === 'MSO') lf = cal.s2f(cal.next(cd), dur);
      }
      r.lf = lf;
      r.ls = cal.f2s(lf, dur);
    }

    // ---- Float ----
    const thr = meta.criticalFloat != null ? +meta.criticalFloat : 0;
    const near = meta.nearCritical != null ? +meta.nearCritical : 5;
    let negCount = 0, critCount = 0;
    for (const id of order) {
      const r = res[id], cal = r.cal;
      if (r.status === 'complete') { r.tf = 0; r.ff = 0; r.critical = false; r.near = false; continue; }
      const sf = cal.wdb(r.s, r.ls), ff0 = cal.wdb(r.f, r.lf);
      r.tf = r.status === 'inprogress' ? ff0 : Math.min(sf, ff0);
      let ff = Infinity;
      for (const e of succ[id]) {
        const sr = res[e.to];
        if (!sr) continue;
        const lag = +e.r.lag || 0, t = e.r.type || 'FS', sc = sr.cal;
        let v;
        if (t === 'FS') v = sc.wdb(sc.shift(r.f, lag), sr.s);
        else if (t === 'SS') v = sc.wdb(sc.shift(r.s, lag), sr.s);
        else {
          const L = r.dur > 0 ? cal.prev(r.f - 1) : r.s;
          v = t === 'FF' ? sc.wdb(sc.shift(L, lag) + 1, sr.f) : sc.wdb(sc.shift(r.s, lag) + 1, sr.f);
        }
        ff = Math.min(ff, v);
      }
      r.ff = ff === Infinity ? cal.wdb(r.f, projF) : ff;
      r.critical = r.tf <= thr;
      r.near = !r.critical && r.tf <= near;
      if (r.tf < 0) negCount++;
      if (r.critical) critCount++;
    }

    return {
      byId: res, order, succ, cals, defCal,
      project: { start: projS, finish: projF, last: projLast, errors, negCount, critCount },
    };
  }

  // نسبة إنجاز نشاط (حسب خط الأساس) عند بداية اليوم t
  function frac(cal, s, f, dur, t) {
    if (dur <= 0) return t > s ? 1 : 0;
    if (t <= s) return 0;
    if (t >= f) return 1;
    const total = cal.wdb(s, f);
    if (total <= 0) return 1;
    return cal.wdb(s, t) / total;
  }

  function baselineOf(P, id) {
    const bid = id || P.meta.activeBaseline;
    return (P.baselines || []).find((b) => b.id === bid) || null;
  }

  function evm(P, C) {
    const t = D.toNum(P.meta.dataDate) + 1;
    const bl = baselineOf(P);
    let bac = 0, pv = 0, ev = 0, ac = 0;
    P.activities.forEach((a) => {
      const r = C.byId[a.id];
      const b = +a.budget || 0;
      bac += b; ac += +a.actualCost || 0;
      const pct = r.status === 'complete' ? 100 : r.status === 'inprogress' ? +a.pct || 0 : 0;
      ev += (b * pct) / 100;
      if (bl && bl.data[a.id]) {
        const e = bl.data[a.id];
        pv += (+e.budget || 0) * frac(C.cals[e.cal] || C.defCal, e.s, e.f, e.dur, t);
      }
    });
    const spi = pv > 0 ? ev / pv : null, cpi = ac > 0 ? ev / ac : null;
    return { bac, pv, ev, ac, sv: ev - pv, cv: ev - ac, spi, cpi, eac: cpi ? bac / cpi : null, hasBaseline: !!bl };
  }

  // منحنى تراكمي لمجموعة أنشطة {cal,s,f,dur,budget}
  function curve(entries, t0, t1, step) {
    const out = [];
    for (let t = t0; t <= t1 + step; t += step) {
      let v = 0;
      entries.forEach((e) => (v += (+e.budget || 0) * frac(e.cal, e.s, e.f, e.dur, t)));
      out.push([t, v]);
    }
    return out;
  }

  function qualityChecks(P, C) {
    const acts = P.activities;
    const list = [];
    const hasSucc = (id) => C.succ[id] && C.succ[id].length > 0;
    const open = acts.filter((a) => C.byId[a.id].status !== 'complete');
    const noPred = open.filter((a) => !(a.preds || []).length && a.id !== acts[0]?.id);
    const noSucc = open.filter((a) => !hasSucc(a.id) && a.id !== acts[acts.length - 1]?.id);
    list.push({ key: 'nopred', label: 'أنشطة بدون سابق (Predecessor)', items: noPred.map((a) => a.id), bad: true });
    list.push({ key: 'nosucc', label: 'أنشطة بدون لاحق (Successor)', items: noSucc.map((a) => a.id), bad: true });
    list.push({ key: 'neg', label: 'أنشطة بـ Float سالب', items: open.filter((a) => C.byId[a.id].tf < 0).map((a) => a.id), bad: true });
    list.push({ key: 'hard', label: 'قيود صارمة (يجب أن يبدأ/ينتهي في… / لا يتجاوز)', items: open.filter((a) => a.constraint && ['MSO', 'MFO', 'SNLT', 'FNLT'].includes(a.constraint.type)).map((a) => a.id), bad: false });
    list.push({ key: 'long', label: 'مدة أطول من 30 يوم عمل', items: open.filter((a) => (+a.dur || 0) > 30).map((a) => a.id), bad: false });
    list.push({ key: 'highfloat', label: 'Float أكبر من 30 يوم', items: open.filter((a) => C.byId[a.id].tf > 30).map((a) => a.id), bad: false });
    const neg = [];
    acts.forEach((a) => (a.preds || []).forEach((p) => { if ((+p.lag || 0) < 0) neg.push(a.id); }));
    list.push({ key: 'lead', label: 'علاقات بـ Lead سالب', items: neg, bad: true });
    return list;
  }

  PF.CPM = { run, makeCal, frac, evm, curve, baselineOf, qualityChecks };
  if (typeof module !== 'undefined' && module.exports) module.exports = PF.CPM;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* PlanFlow — أدوات مساعدة للواجهة */
(function (g) {
  const PF = (g.PF = g.PF || {});
  PF.Views = PF.Views || {};

  PF.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  PF.uid = (p) => (p || 'x') + Math.random().toString(36).slice(2, 8);
  PF.num = (n, d = 0) => (n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: d }));
  PF.compact = (n) => {
    if (n == null || isNaN(n)) return '—';
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
    if (a >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return Math.round(n) + '';
  };
  PF.pct = (n, d = 0) => (n == null || isNaN(n) ? '—' : (n * 100).toFixed(d) + '%');
  PF.ltr = (s) => '<bdi dir="ltr">' + s + '</bdi>';
  PF.clone = (o) => JSON.parse(JSON.stringify(o));
  PF.$ = (s, r) => (r || document).querySelector(s);
  PF.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  // أيقونات خطية بسيطة
  const I = {
    dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    schedule: '<path d="M4 6h9M8 12h12M6 18h9"/><path d="M3 3v18" opacity=".4"/>',
    progress: '<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/>',
    wbs: '<path d="M4 5h6v4H4zM14 11h6v4h-6zM14 17h6v4h-6zM7 9v10h7M7 13h7"/>',

    company: '<path d="M4 21V7l8-4 8 4v14M9 21v-5h6v5M8 10h2M14 10h2M8 13h2M14 13h2"/>',
    info: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',

/* PlanFlow — هيكل WBS متعدد المستويات (شجرة بعمق غير محدود).

      while (p) { if (seen.has(p)) { w.parent = ''; break; } seen.add(p); const x = S.wbs.find((y) => y.id === p); p = x ? x.parent : ''; }

  // قائمة مسطّحة بالترتيب العمودي (depth-first) مع العمق
  function flat(S) {
    const out = [];

    walk('', 0);

  // معرّفات العنصر وكل أحفاده
  function subtreeIds(S, id) {
    const out = [id];

    walk(id);
    return out;

  function indent(S, id) {

  function rollup(S, C, id, bl) {
    const ids = id == null ? null : new Set(subtreeIds(S, id));

    let bs = null, bf = null, sched = null;
    if (bl) {
      const bs_ = acts.map((a) => bl.data[a.id]).filter(Boolean);
      if (bs_.length) {
        bs = Math.min(...bs_.map((b) => b.s)); bf = Math.max(...bs_.map((b) => b.f));

        const tw = bs_.reduce((t, b) => t + Math.max(1, b.dur || 0), 0) || 1;

    return { n: acts.length, s, f, dur, perf, tf, bs, bf, sched };

    let unsupported = 0;

    tasks.forEach((t) => {
      const hd = dayHr(t.clndr_id || defCid);

      const mile = t.task_type === 'TT_Mile' || t.task_type === 'TT_FinMile';
      const dur = mile ? 0 : target > 0 ? Math.max(1, Math.round(target / hd)) : 0;
      const a = {
        id: idMap[t.task_id], name: (t.task_name || '').trim() || idMap[t.task_id], wbs: wbsIdOf(t),
        dur, type: mile || dur === 0 ? 'milestone' : 'task',
        cal: t.clndr_id && 'c' + t.clndr_id !== defCal.id && calendars.find((c) => c.id === 'c' + t.clndr_id) ? 'c' + t.clndr_id : '',

  // يقارن تواريخ PlanFlow المحسوبة بتواريخ P6 المخزّنة في الملف (Early Start / Early Finish)
  function compare(S, C, p6) {

    S.activities.forEach((a) => {

      n++;
      const s = D.toIso(r.s), f = D.toIso(r.lastDay);
      const gs = s === ref.s, gf = f === ref.f;
      if (gs) okS++;
      if (gf) okF++;
      if (!gs || !gf) diffs.push({ id: a.id, name: a.name, p6s: ref.s, p6f: ref.f, s, f, ds: D.toNum(s) - D.toNum(ref.s), df: D.toNum(f) - D.toNum(ref.f) });
    });
    diffs.sort((x, y) => Math.max(Math.abs(y.ds), Math.abs(y.df)) - Math.max(Math.abs(x.ds), Math.abs(x.df)));

  function fromState(S, C) {

    const bl = CPM.baselineOf(S);
    const dt = (iso, t) => (iso ? iso + ' ' + (t || '08:00') : '');
    const taskRows = S.activities.map((a) => {
      const r = C.byId[a.id], mile = a.type === 'milestone';

      return [tid[a.id], PROJ, wid[a.wbs] || ROOT, cid[a.cal] || defCid, a.pct, status === 'TK_Active' ? 'CP_Phys' : 'CP_Drtn', mile ? 'TT_Mile' : 'TT_Task', 'DT_FixedDUR2', status, a.id, a.name,

    if (S.resources.length) {

        S.resources.map((r) => [rid[r.id], '', defCid, r.name, 'R' + rid[r.id], RTYPE_BACK[r.type] || 'RT_Labor', 'Y']));

          tr.push([tn++, tid[a.id], PROJ, rid[x.rid], qty, w.length ? Math.round((+a.budget || 0) / w.length) : 0, Math.round((+a.actualCost || 0) / (w.length || 1))]);

/* PlanFlow — رسوم SVG بسيطة (بدون مكتبات) */
(function (g) {

  const MS = ['ك2', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'ت1', 'ت2', 'ك1'];

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  // مخطط خطوط على محور زمني
  // opts: {w,h,series:[{name,color,pts:[[t,v]],dash,width,dots}], xmin,xmax, vlines:[{x,label,color}], yfmt}
  function lines(o) {
    const w = o.w || 760, h = o.h || 320, pl = 56, pr = 14, pt = 16, pb = 34;
    const iw = w - pl - pr, ih = h - pt - pb;

    const Y = (v) => pt + ih - (v / ymax) * ih;

    let s = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'مخطط')}">`;
    for (let i = 0; i <= 4; i++) {
      const v = (ymax / 4) * i, y = Y(v);
      s += `<line x1="${pl}" x2="${w - pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl - 8}" y="${y + 4}" class="ax" text-anchor="end">${yfmt(v)}</text>`;
    }
    // تسميات الأشهر
    const p0 = D.parts(xmin);
    let y0 = p0.y, m0 = p0.m + 1;
    if (m0 > 11) { m0 = 0; y0++; }

    let k = 0;

    });

      if (!se.pts.length) return;
      const d = se.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
      s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2.2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;

    });
    s += '</svg>';
    const legend = `<div class="legend">${o.series.map((se) => `<span><i style="background:${se.color};${se.dash ? 'background:repeating-linear-gradient(90deg,' + se.color + ' 0 4px,transparent 4px 7px)' : ''}"></i>${esc(se.name)}</span>`).join('')}</div>`;

  }

  // أعمدة أسبوعية مع خط سعة. opts: {values:[{t,v}], cap, w,h, label}
  function bars(o) {

    let s = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'مخطط')}">`;
    for (let i = 0; i <= 4; i++) { const v = (ymax / 4) * i; s += `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pl - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${PF.num(v)}</text>`; }
    o.values.forEach((x, i) => {

    });
    if (o.cap) s += `<line x1="${pl}" x2="${w - pr}" y1="${Y(o.cap)}" y2="${Y(o.cap)}" stroke="#172033" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${w - pr}" y="${Y(o.cap) - 5}" class="ax" text-anchor="end">السعة ${o.cap}</text>`;

  }

  PF.Charts = { lines, bars, stack };

  <script>
/* PlanFlow — إدارة هيكل WBS: شجرة بعمق غير محدود (إضافة، إزاحة، نقل، حذف) */
(function (g) {
  const PF = g.PF;
  const esc = PF.esc;
  let sel = null;

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    const flat = PF.WBS.flat(S);
    const codes = PF.WBS.codes(S);
    const orphan = S.activities.filter((a) => !S.wbs.some((w) => w.id === a.wbs)).length;
    const maxDepth = flat.reduce((m, x) => Math.max(m, x.depth + 1), 0);
    if (sel && !PF.WBS.byId(S, sel)) sel = null;
    const selW = sel && PF.WBS.byId(S, sel);

    const rowHtml = flat.map((x) => {
      const ru = PF.WBS.rollup(S, C, x.w.id, null);
      const direct = S.activities.filter((a) => a.wbs === x.w.id).length;
      return `<div class="wrow ${sel === x.w.id ? 'sel' : ''}" data-w="${esc(x.w.id)}">
        <span class="wcode num">${esc(codes[x.w.id])}</span>
        <span class="wname" style="padding-inline-start:${x.depth * 22}px">
          <span class="wdot ${x.hasKids ? 'par' : ''}"></span>
          <input class="cell-in" dir="auto" value="${esc(x.w.name)}" data-rename="${esc(x.w.id)}" data-fkey="w:${esc(x.w.id)}">
        </span>
        <span class="wcnt" title="أنشطة مباشرة / الكل">${direct}${ru.n !== direct ? ' / ' + ru.n : ''}</span></div>`;
    }).join('');

    root.innerHTML = `
      <div class="pagehead"><div><h2>هيكل تقسيم العمل (WBS)</h2>
        <div class="sub" style="margin:2px 0 0">أنشئ مستويات بقدر ما تحتاج: اختر عنصراً ثم أضف تحته عنصراً فرعياً، أو أزحه لليمين ليصبح ابناً لما فوقه. الأنشطة تُسند لأي مستوى.</div></div>
        <span class="sp"></span>
        <button class="btn primary" data-act="addroot">${PF.icon('plus')} عنصر في المستوى الأول</button></div>
      <div class="card" style="margin-bottom:14px">
        <div class="wtool no-print">
          <button class="btn" data-act="child" ${selW ? '' : 'disabled'}>${PF.icon('plus', 15)} عنصر فرعي</button>
          <button class="btn" data-act="sib" ${selW ? '' : 'disabled'}>${PF.icon('plus', 15)} عنصر بنفس المستوى</button>
          <span class="vsep"></span>
          <button class="btn" data-act="indent" ${selW ? '' : 'disabled'} title="يصبح ابناً للعنصر الذي فوقه">إزاحة ←</button>
          <button class="btn" data-act="outdent" ${selW && selW.parent ? '' : 'disabled'} title="يصبح بنفس مستوى أبيه">→ إرجاع</button>
          <button class="btn" data-act="up" ${selW ? '' : 'disabled'}>↑ أعلى</button>
          <button class="btn" data-act="down" ${selW ? '' : 'disabled'}>↓ أسفل</button>
          <span class="vsep"></span>
          <button class="btn" data-act="del" ${selW ? '' : 'disabled'}>${PF.icon('trash', 15)} حذف</button>
          <span class="sp"></span>
          <span class="t-mut" style="font-size:12.5px">${flat.length} عنصر · ${maxDepth} مستوى${orphan ? ' · <b class="t-warn">' + orphan + ' نشاط بلا مجموعة</b>' : ''}</span>
        </div>
        <div class="wtree">${rowHtml || '<div class="empty"><b>لا يوجد هيكل WBS</b>ابدأ بإضافة عنصر في المستوى الأول (مثلاً: الأعمال المدنية، الميكانيك، الكهرباء).</div>'}</div>
        ${selW ? `<div class="sub" style="margin:10px 0 0">المسار: ${esc(PF.WBS.path(S, sel))}</div>` : ''}
      </div>`;

    root.onclick = async (e) => {
      const b = e.target.closest('button[data-act]');
      if (b) return act(b.dataset.act);
      const row = e.target.closest('[data-w]');
      if (row && !e.target.closest('input')) { sel = row.dataset.w; PF.App.render(false); }
      else if (row) { if (sel !== row.dataset.w) { sel = row.dataset.w; PF.App.render(false); } }
    };
    root.onchange = (e) => {
      const el = e.target;
      if (el.dataset.rename) PF.Store.mutate((st) => { const w = PF.WBS.byId(st, el.dataset.rename); if (w) w.name = el.value.trim() || w.name; });
    };
  }

  async function act(a) {
    const S = PF.Store.state, mut = PF.Store.mutate;
    const w = sel && PF.WBS.byId(S, sel);
    if (a === 'addroot') { const n = await PF.prompt('عنصر WBS جديد (المستوى الأول)', 'الاسم', ''); if (n) mut((st) => { sel = PF.WBS.add(st, '', n); }); }
    else if (a === 'child' && w) { const n = await PF.prompt('عنصر فرعي داخل «' + w.name + '»', 'الاسم', ''); if (n) mut((st) => { sel = PF.WBS.add(st, w.id, n); }); }
    else if (a === 'sib' && w) { const n = await PF.prompt('عنصر بنفس مستوى «' + w.name + '»', 'الاسم', ''); if (n) mut((st) => { sel = PF.WBS.add(st, w.parent, n); }); }
    else if (a === 'indent' && w) { let ok; mut((st) => { ok = PF.WBS.indent(st, w.id); }); if (!ok) PF.toast('لا يوجد عنصر فوقه بنفس المستوى ليصبح أباً له'); }
    else if (a === 'outdent' && w) mut((st) => { PF.WBS.outdent(st, w.id); });
    else if (a === 'up' && w) mut((st) => { PF.WBS.move(st, w.id, -1); });
    else if (a === 'down' && w) mut((st) => { PF.WBS.move(st, w.id, 1); });
    else if (a === 'del' && w) {
      const n = PF.WBS.subtreeIds(S, w.id).length - 1, na = S.activities.filter((x) => x.wbs === w.id).length;
      const msg = `حذف «${w.name}»؟ ${n ? 'عناصره الفرعية (' + n + ') ' : ''}${na ? 'وأنشطته (' + na + ') ' : ''}ستنتقل إلى المستوى الأعلى ولن تُحذف.`;
      if (await PF.confirm(msg, 'حذف', true)) { mut((st) => PF.WBS.remove(st, w.id)); sel = null; }
    }
  }

  PF.Views.wbs = { render };
})(window);

</script>

            ${list.map((h) => `<tr><td class="num">${D.fmt(D.toNum(h.date))}</td><td>${WD[D.dow(D.toNum(h.date))]}${c.weekend.includes(D.dow(D.toNum(h.date))) ? ' <span class="t-mut" title="يوم عطلة أسبوعية أصلاً">(عطلة أسبوعية)</span>' : ''}</td>
              <td><input class="cell-in" dir="auto" value="${esc(h.name)}" data-hname="${h.date}"></td>
              <td><button class="btn sm icon-btn" data-hdel="${h.date}" title="حذف">${PF.icon('trash', 15)}</button></td></tr>`).join('') || `<tr><td colspan="4"><div class="empty"><b>لا توجد عطل لسنة ${year}</b>أضف عطلة أو استخدم قالب الدولة.</div></td></tr>`}
          </tbody></table></div>
          <div>${yearGrid(c)}<div class="sub" style="margin-top:6px"><span class="lg h"></span> عطلة رسمية &nbsp; <span class="lg w"></span> عطلة أسبوعية</div></div>
        </div>
      </div>`;

    root.onclick = async (e) => {
      const y = e.target.closest('[data-y]'); if (y) { year = +y.dataset.y; PF.App.render(false); return; }
      const del = e.target.closest('[data-hdel]');
      if (del) { PF.Store.setCompany((x) => { x.holidays = x.holidays.filter((h) => h.date !== del.dataset.hdel); }); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      const val = (id) => (root.querySelector('#' + id) || {}).value;
      const a = b.dataset.act;
      if (a === 'add1') {
        const d = val('h1d'); if (!d) { PF.toast('اختر التاريخ', 'err'); return; }
        year = +d.slice(0, 4);
        PF.Store.setCompany((x) => { x.holidays = CO().merge(x.holidays, [{ date: d, name: (val('h1n') || '').trim() || 'عطلة رسمية' }]); });
      } else if (a === 'addrange') {
        const f = val('hrf'), t = val('hrt'); if (!f || !t || t < f) { PF.toast('حدّد نطاقاً صحيحاً (من ≤ إلى)', 'err'); return; }
        year = +f.slice(0, 4);
        PF.Store.setCompany((x) => { x.holidays = CO().merge(x.holidays, CO().rangeOf(f, t, (val('hrn') || '').trim() || 'عطلة رسمية')); });
        PF.toast('أُضيفت أيام النطاق', 'ok');
      } else if (a === 'preset') {
        PF.Store.setCompany((x) => { x.holidays = CO().merge(x.holidays, CO().presetFor(x.country, year)); });
      } else if (a === 'copynext') {
        PF.Store.setCompany((x) => { x.holidays = CO().merge(x.holidays, x.holidays.filter((h) => +h.date.slice(0, 4) === year).map((h) => ({ date: (year + 1) + h.date.slice(4), name: h.name }))); });
        year += 1;
        PF.toast('نُسخت العطل. راجع التواريخ المتغيرة (الأعياد الهجرية) وعدّلها.', 'ok');
      } else if (a === 'applywe') {
        PF.Store.mutate((st) => { const cal = st.calendars.find((k) => k.id === st.meta.defaultCal) || st.calendars[0]; const we = PF.Store.company.weekend; cal.workdays = [0, 1, 2, 3, 4, 5, 6].filter((d) => !we.includes(d)); });
        PF.toast('تم تحديث أيام العمل في تقويم المشروع', 'ok');
      }
    };
    root.onchange = (e) => {
      const el = e.target;
      if (el.dataset.k === 'name') PF.Store.setCompany((x) => { x.name = el.value; });
      else if (el.dataset.k === 'country') PF.Store.setCompany((x) => { x.country = el.value; x.weekend = cc[el.value].weekend.slice(); });
      else if (el.dataset.we != null) {
        const d = +el.dataset.we, cur = PF.Store.company.weekend.filter((x) => x !== d).concat(el.checked ? [d] : []);
        if (cur.length >= 7) { PF.toast('لا يمكن أن تكون كل الأيام عطلة', 'err'); PF.App.render(false); return; }
        PF.Store.setCompany((x) => { x.weekend = cur.sort(); });
      } else if (el.dataset.hname) PF.Store.setCompany((x) => { const h = x.holidays.find((k) => k.date === el.dataset.hname); if (h) h.name = el.value.trim() || h.name; });
    };
  }

  PF.Views.company = { render };
})(window);

  <script>
/* PlanFlow — قائمة التحقق: ما الموجود وما الناقص. البنود تلقائية (تُحسب من البيانات) + يدوية، وكل بند قابل للإخفاء */
(function (g) {
  const PF = g.PF;
  const esc = PF.esc;
  let showHidden = false, onlyMissing = false;

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    PF.Info.ensure(S);
    const all = PF.Info.evaluate(S, C);
    const vis = all.filter((x) => !x.hidden), done = vis.filter((x) => x.done).length, pct = vis.length ? done / vis.length : 1;
    const groups = []; all.forEach((x) => { let g = groups.find((y) => y.name === x.group); if (!g) groups.push((g = { name: x.group, items: [] })); g.items.push(x); });
    const missing = vis.filter((x) => !x.done);
    root.innerHTML = `
      <div class="pagehead"><div><h2>قائمة التحقق</h2><div class="sub" style="margin:2px 0 0">البنود التلقائية تُحسب من بيانات المشروع فور تعبئتها (يدوياً أو من ملف XER). أخفِ أي بند لا يلزمكم.</div></div>
        <span class="sp"></span><label class="chip ${onlyMissing ? 'on' : ''}"><input type="checkbox" id="om" ${onlyMissing ? 'checked' : ''} hidden>الناقص فقط</label>
        <label class="chip ${showHidden ? 'on' : ''}"><input type="checkbox" id="sh" ${showHidden ? 'checked' : ''} hidden>إظهار المخفي</label></div>
      <div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:baseline;gap:12px"><span style="font-size:30px;font-weight:600" class="num">${Math.round(pct * 100)}%</span>
        <span class="sub" style="margin:0">اكتمل ${done} من ${vis.length} بنداً — الناقص ${missing.length}</span></div>
        <div class="bar-track" style="height:10px"><i style="width:${pct * 100}%;background:var(--ok)"></i></div></div>
      <div class="grid g2" style="align-items:start">

          const items = g.items.filter((x) => (showHidden || !x.hidden) && (!onlyMissing || !x.done));
          const vs = g.items.filter((x) => !x.hidden), dn = vs.filter((x) => x.done).length;
          if (!items.length && !g.items.some((x) => x.manual)) return '';
          return `<div class="card"><h3>${esc(g.name)}<span class="sp"></span><span class="tag ${dn === vs.length ? 'ok' : 'risk'} num">${dn}/${vs.length}</span></h3>
            ${items.map((x) => `<div class="qrow ck ${x.hidden ? 'dim' : ''}">
              ${x.manual ? `<input type="checkbox" data-mdone="${esc(x.id)}" ${x.done ? 'checked' : ''}>` : `<span class="ckm ${x.done ? 'ok' : 'no'}">${x.done ? '✓' : '✕'}</span>`}
              <span style="flex:1" dir="auto">${esc(x.label)}${x.detail ? `<div class="t-mut" style="font-size:12px">${esc(x.detail)}</div>` : ''}</span>
              ${!x.done && x.link ? `<a class="link" href="#/${x.link}">استكمال</a>` : ''}
              ${x.manual ? `<button class="btn sm icon-btn" data-mdel="${esc(x.id)}" title="حذف">${PF.icon('trash', 14)}</button>` : `<button class="link" style="text-decoration:none" data-hide="${esc(x.id)}" title="${x.hidden ? 'إعادة البند' : 'إخفاء (غير مطلوب)'}">${x.hidden ? 'إعادة' : '⊘'}</button>`}
            </div>`).join('') || '<div class="empty">لا شيء للعرض.</div>'}
            ${g.name === 'بنود إضافية' ? '' : ''}</div>`;
        }).join('')}
        <div class="card"><h3>إضافة بند خاص بكم</h3><div class="row"><label class="fld" style="flex:3 1 200px"><span>البند</span><input dir="auto" id="mn" placeholder="مثال: استلام جدول المقاول من الموقع"></label>
          <label class="fld"><span>المجموعة</span><input dir="auto" id="mg" placeholder="بنود إضافية"></label>
          <div class="fld"><span>&nbsp;</span><button class="btn primary" data-act="addm">${PF.icon('plus', 14)} إضافة</button></div></div></div>
      </div>`;
    root.onchange = (e) => {
      const el = e.target;
      if (el.id === 'om') { onlyMissing = el.checked; PF.App.render(false); }
      else if (el.id === 'sh') { showHidden = el.checked; PF.App.render(false); }
      else if (el.dataset.mdone) PF.Store.mutate((st) => { const m = st.checklist.manual.find((x) => x.id === el.dataset.mdone); if (m) m.done = el.checked; });
    };
    root.onclick = (e) => {
      const h = e.target.closest('[data-hide]'), md = e.target.closest('[data-mdel]'), a = e.target.closest('[data-act="addm"]');
      if (h) PF.Store.mutate((st) => { if (st.checklist.hidden[h.dataset.hide]) delete st.checklist.hidden[h.dataset.hide]; else st.checklist.hidden[h.dataset.hide] = true; });
      else if (md) PF.Store.mutate((st) => { st.checklist.manual = st.checklist.manual.filter((x) => x.id !== md.dataset.mdel); });

          <label class="fld"><span>من تاريخ</span><input type="date" data-f="from" value="${F.from}"></label>
          <label class="fld"><span>إلى تاريخ</span><input type="date" data-f="to" value="${F.to}"></label>
          <label class="fld"><span>المصدر (الملف)</span><select data-f="src"><option value="">الكل</option>${srcs.map((x) => `<option ${F.src === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label></div>
        <div class="row" style="margin-top:4px"><label class="fld" style="flex:3 1 260px"><span>أضف ملاحظة يدوية للسجل</span><input dir="auto" id="note" placeholder="مثال: اجتماع مع الاستشاري — اتُّفق على…"></label>
          <div class="fld"><span>&nbsp;</span><button class="btn" data-act="note">إضافة</button></div></div></div>
      ${byDay.map((g) => `<div class="card" style="margin-bottom:10px"><h3>${PF.D.fmtLong(PF.D.toNum(g.d))}<span class="sp"></span><span class="t-mut" style="font-size:12px">${g.items.length}</span></h3>
        ${g.items.map((e) => `<details class="lg-e"><summary><span class="lg-i ${e.type}">${ICON[e.type] || '•'}</span><span style="flex:1" dir="auto">${esc(e.title)}</span>${e.source ? `<span class="tag none" dir="auto">${esc(e.source)}</span>` : ''}<span class="tag info">${T[e.type] || e.type}</span><span class="t-mut num">${tm(e)}</span></summary>
          ${e.detail.length ? `<ul class="sub" style="margin:6px 0 4px;padding-inline-start:22px">${e.detail.map((d) => `<li dir="auto">${esc(d)}</li>`).join('')}</ul>` : '<div class="sub" style="margin:6px 22px">لا تفاصيل.</div>'}</details>`).join('')}</div>`).join('') || '<div class="card"><div class="empty"><b>لا توجد مدخلات</b>ستظهر هنا التحديثات فور حدوثها.</div></div>'}`;
    root.onclick = (e) => {
      const t = e.target.closest('[data-t]'), a = e.target.closest('[data-act]');
      if (t) { F.types.has(t.dataset.t) ? F.types.delete(t.dataset.t) : F.types.add(t.dataset.t); PF.App.render(false); }
      else if (a && a.dataset.act === 'clear') { F.types.clear(); PF.App.render(false); }
      else if (a && a.dataset.act === 'note') { const n = root.querySelector('#note').value.trim(); if (!n) return; PF.Store.mutate(() => {}, { type: 'other', title: n, detail: [] }); }
      else if (a && a.dataset.act === 'csv') {
        const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        PF.download('update-log.csv', '﻿' + ['التاريخ والوقت,النوع,العنوان,المصدر,التفاصيل'].concat(list.map((x) => [x.ts, T[x.type] || x.type, x.title, x.source, x.detail.join(' | ')].map(q).join(','))).join('\r\n'), 'text/csv;charset=utf-8');
      }
    };
    root.onchange = (e) => { const f = e.target.dataset.f; if (f) { F[f] = e.target.value; PF.App.render(false); } };
  }
  PF.Views.log = { render };
})(window);

</script>
  <script>
/* PlanFlow — شاشة البداية: مساران (تعبئة من الصفر / سحب ملف Primavera) + مشروع تجريبي */
(function (g) {
  const PF = g.PF;
  function render(root) {
    root.innerHTML = `
      <div class="pagehead"><div><h2>ابدأ مشروعك</h2><div class="sub" style="margin:2px 0 0">اختر الطريقة. في الحالتين ستجد في «قائمة التحقق» ما اكتمل وما ينقص.</div></div></div>
      <div class="grid g3" style="max-width:1000px">
        <div class="card startc"><h3>1. ابدأ من الصفر</h3><p class="sub">املأ بيانات المشروع ثم أنشئ WBS والأنشطة والعلاقات هنا مباشرة، واعمل بالموقع كبديل عن Primavera.</p>
          <button class="btn primary" data-act="blank">مشروع جديد فارغ</button></div>
        <div class="card startc"><h3>2. ارفع ملفاتك</h3><p class="sub">XER من Primavera (الهيكل والأنشطة والعلاقات والتقاويم والتقدّم) و/أو Master Sheet بصيغة Excel (بيانات المشروع). يمكن رفع النوعين، وكل رفع يُسجَّل في سجل التحديثات.</p>
          <button class="btn primary" data-act="xer">اختر ملف (XER / Excel)</button><input type="file" id="xf" accept=".xer,.XER,.xlsx,.xlsm" hidden></div>
        <div class="card startc"><h3>3. جرّب مشروعاً تجريبياً</h3><p class="sub">مبنى من 4 طوابق ببيانات كاملة تقريباً لتتعرف على الصفحات.</p>
          <button class="btn" data-act="sample">افتح المشروع التجريبي</button></div>
      </div>
      <p class="sub" style="margin-top:14px">لن تحتاج لإعادة هذه الشاشة: يمكنك لاحقاً البدء من جديد أو الاستيراد من «البيانات والاستيراد».
        <button class="link" data-act="skip">تخطّي</button></p>`;
    const done = (to) => PF.App.show(to);
    root.onclick = (e) => {
      const a = e.target.closest('[data-act]'); if (!a) return;
      const k = a.dataset.act;
      if (k === 'blank') { PF.Store.blank(); done('projectdata'); }
      else if (k === 'sample') { PF.Store.reset(); done('dashboard'); }
      else if (k === 'skip') { PF.Store.replace(PF.Store.state); done('dashboard'); }
      else if (k === 'xer') root.querySelector('#xf').click();
    };

      if (e.target.id !== 'xf') return;

      PF.Views.settings.importFile(f);
    };
  }
  PF.Views.start = { render };
})(window);
