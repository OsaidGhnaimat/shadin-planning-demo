    S.activities.forEach((a) => {
      const r = C.byId[a.id], b = bl && bl.data[a.id], w = S.wbs.find((x) => x.id === a.wbs);
      lines.push([a.id, a.name, w ? w.name : '', a.dur, D.toIso(r.s), D.toIso(r.lastDay), r.tf, r.ff, r.status === 'complete' ? 100 : a.pct, r.critical ? 'نعم' : '', b ? D.toIso(b.s) : '', b ? D.toIso(b.dur > 0 ? r.cal.prev(b.f - 1) : b.s) : '', a.budget, a.actualCost].map(q).join(','));
    });
    return '﻿' + lines.join('\r\n'); // BOM لعرض العربية صحيحاً في Excel
  }


  // استيراد XER: قراءة → اختيار المشروع إن تعدّدت → ملخص ومقارنة مع تواريخ P6 → تأكيد
  function importXer(buf) {
    let P;
    try { P = PF.XER.parse(PF.XER.decode(buf)); } catch (x) { PF.toast('تعذّر قراءة الملف: ' + x.message, 'err'); return; }
    if (P.projects.length > 1) {
      let pick = P.projects[0].id;
      const m = PF.modal({
        title: 'اختر المشروع', body: '<p style="margin-top:0">الملف يحتوي أكثر من مشروع. أي واحد تريد استيراده؟</p><select id="xp" style="width:100%">' + P.projects.map((p) => `<option value="${esc(p.id)}">${esc(p.name)} (${p.tasks} نشاط)</option>`).join('') + '</select>',
        actions: [{ label: 'إلغاء' }, { label: 'متابعة', kind: 'primary', onClick: (api) => { pick = api.body.querySelector('#xp').value; setTimeout(() => review(P, pick), 0); } }],
      });
      return m;
    }
    review(P, P.projects[0] && P.projects[0].id);
  }

  function review(P, projId) {
    let R, C2, cmp;
    try { R = PF.XER.toState(P, { projId }); C2 = PF.CPM.run(R.state); cmp = PF.XER.compare(R.state, C2, R.p6); } catch (x) { PF.toast('تعذّر الاستيراد: ' + x.message, 'err'); return; }
    const S = R.state, n = S.activities.length;
    const rel = S.activities.reduce((k, a) => k + a.preds.length, 0);
    const pctOf = (k) => (cmp.total ? Math.round((k / cmp.total) * 100) : 0);
    const good = cmp.total && cmp.matchStart === cmp.total && cmp.matchFinish === cmp.total;
    const rows = cmp.diffs.slice(0, 8).map((d) => `<tr><td class="num">${esc(d.id)}</td><td dir="auto">${esc(d.name)}</td><td class="n num">${D.fmt(D.toNum(d.p6s))} ← ${D.fmt(D.toNum(d.p6f))}</td><td class="n num">${D.fmt(D.toNum(d.s))} ← ${D.fmt(D.toNum(d.f))}</td></tr>`).join('');
    const body = `
      <p style="margin:0 0 8px"><b dir="auto">${esc(S.meta.name)}</b> — ${n} نشاط، ${rel} علاقة، ${S.calendars.length} تقويم، ${S.resources.length} مورد. تاريخ البيانات ${D.fmtLong(D.toNum(S.meta.dataDate))}.</p>
      <div class="note ${good ? '' : 'warn'}" style="margin:8px 0">${cmp.total
        ? `<b>مقارنة مع P6:</b> تطابقت بداية ${cmp.matchStart} من ${cmp.total} نشاط (${pctOf(cmp.matchStart)}%) ونهاية ${cmp.matchFinish} من ${cmp.total} (${pctOf(cmp.matchFinish)}%).${good ? ' الحسابات مطابقة تماماً.' : ' الفروقات أدناه (P6 | PlanFlow):'}`
        : 'لا توجد تواريخ مبكرة في الملف للمقارنة.'}</div>
      ${rows ? `<div class="tw" style="max-height:220px;overflow:auto"><table class="t"><thead><tr><th>الرقم</th><th>النشاط</th><th class="n">P6</th><th class="n">PlanFlow</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${cmp.diffs.length > 8 ? `<div class="sub">+${cmp.diffs.length - 8} فروقات أخرى.</div>` : ''}
        <div class="sub">أسباب الفروقات الشائعة: خيار Progress Override بدل Retained Logic في P6، أو تقويم مختلف للـ Lag، أو قيود غير مدعومة.</div>` : ''}
      ${R.warnings.length ? `<ul class="sub" style="margin:10px 0 0;padding-inline-start:18px">${R.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="xbl" checked> احفظ الجدول المستورد كخط أساس (لتظهر مقارنة الإنجاز وSPI)</label>
      <p class="sub" style="margin:10px 0 0">سيُستبدل المشروع الحالي. صدّر نسخة احتياطية أولاً إن كنت تحتاجه.</p>`;
    PF.modal({
      title: 'استيراد من Primavera (XER)', body, wide: true,
      actions: [{ label: 'إلغاء' }, {
        label: 'استيراد', kind: 'primary',
        onClick: (api) => {
          const withBl = api.body.querySelector('#xbl').checked;
          PF.Store.replace(S);
          if (withBl) PF.Store.mutate((st) => { PF.Actions.captureBaseline(st, PF.Store.C, 'عند الاستيراد من XER'); });
          PF.toast('تم استيراد ' + n + ' نشاط من XER', 'ok');
          location.hash = '#/schedule';
        },
      }],
    });
  }

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    root.innerHTML = `
      <div class="pagehead"><h2>الإعدادات والبيانات</h2></div>
      <div class="grid g2" style="margin-bottom:14px">
        <div class="card"><h3>بيانات المشروع</h3>
          <label class="fld"><span>اسم المشروع</span><input dir="auto" data-m="name" value="${esc(S.meta.name)}"></label>
          <div class="row"><label class="fld"><span>الرمز</span><input data-m="code" value="${esc(S.meta.code)}"></label><label class="fld"><span>العميل</span><input dir="auto" data-m="client" value="${esc(S.meta.client)}"></label></div>
          <div class="row"><label class="fld"><span>تاريخ البداية</span><input type="date" data-m="startDate" value="${S.meta.startDate}"></label>
            <label class="fld"><span>العملة</span><input data-m="currency" value="${esc(S.meta.currency)}"></label></div>
          <div class="row"><label class="fld"><span>تقويم المشروع الافتراضي</span><select data-m="defaultCal">${PF.opts(S.calendars.map((c) => [c.id, c.name]), S.meta.defaultCal)}</select></label></div>
          <div class="row"><label class="fld"><span>النشاط حرج إذا Float ≤</span><input type="number" data-m="criticalFloat" data-n value="${S.meta.criticalFloat}"></label>
            <label class="fld"><span>شبه حرج إذا Float ≤</span><input type="number" data-m="nearCritical" data-n value="${S.meta.nearCritical}"></label></div>
        </div>
        <div class="card"><h3>البيانات والنسخ الاحتياطي</h3>
          <p class="sub" style="margin-top:0">كل شيء يُحفظ تلقائياً في هذا المتصفح فقط. صدّر نسخة احتياطية بانتظام، أو لنقل المشروع لجهاز آخر.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <button class="btn primary" data-act="json">${PF.icon('download')} تصدير المشروع (JSON)</button>
            <button class="btn" data-act="csv">${PF.icon('download')} تصدير الجدول (CSV/Excel)</button>
            <button class="btn" data-act="import">${PF.icon('upload')} استيراد مشروع</button><input type="file" id="file" accept=".json,.xer,application/json" hidden></div>
          <h3 style="margin-top:18px">Primavera P6 (XER)</h3>
          <p class="sub" style="margin-top:0">استورد ملف XER واحصل على مقارنة مع تواريخ P6 نفسها، أو صدّر المشروع إلى XER لفتحه في P6.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <button class="btn" data-act="import">${PF.icon('upload')} استيراد XER</button>
            <button class="btn" data-act="xer">${PF.icon('download')} تصدير XER</button></div>
          <h3 style="margin-top:18px">ابدأ من جديد</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" data-act="blank">مشروع فارغ</button>
            <button class="btn" data-act="sample">استعادة المشروع التجريبي</button></div>
          <p class="sub" style="margin:10px 0 0">هذه الأزرار تستبدل المشروع الحالي (يمكن التراجع عنها بـ Ctrl+Z في نفس الجلسة).</p>
        </div>
      </div>
      <div class="card"><h3>التقويمات<span class="sp"></span><button class="btn sm" data-act="addcal">${PF.icon('plus', 14)} تقويم جديد</button></h3>
        <p class="sub" style="margin-top:0">التقويم يحدد أيام العمل والعطل. يمكن إسناد تقويم مختلف لأي نشاط من «تفاصيل النشاط» (مثلاً أعمال الموقع 6 أيام في الأسبوع).</p>
        ${S.calendars.map((c, ci) => `
          <div class="card" style="margin-bottom:10px;background:#fff">
            <div class="row"><label class="fld" style="flex:3 1 260px"><span>اسم التقويم</span><input dir="auto" data-cal="${ci}" data-k="name" value="${esc(c.name)}"></label>
              <div class="fld"><span>&nbsp;</span>${S.calendars.length > 1 ? `<button class="btn sm" data-delcal="${ci}">حذف التقويم</button>` : ''}</div></div>
            <div class="fld"><span>أيام العمل</span><div style="display:flex;gap:12px;flex-wrap:wrap">${WD.map((n, d) => `<label style="display:inline-flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" data-cal="${ci}" data-wd="${d}" ${c.workdays.includes(d) ? 'checked' : ''}>${n}</label>`).join('')}</div></div>
            <div class="fld"><span>العطل الرسمية</span><div class="chips">${(c.holidays || []).map((h, hi) => `<span class="chip">${D.fmtLong(D.toNum(h))} <button class="link" style="margin-inline-start:6px;text-decoration:none" data-cal="${ci}" data-delhol="${hi}" aria-label="حذف">✕</button></span>`).join('') || '<span class="t-mut">لا توجد عطل</span>'}
              <input type="date" data-cal="${ci}" data-addhol style="width:auto" aria-label="إضافة عطلة"></div></div>
          </div>`).join('')}
      </div>
      <div class="sub" style="margin-top:14px">محرك الجدولة: مسار حرج (CPM) بعلاقات FS/SS/FF/SF مع Lag، قيود زمنية، تقويمات متعددة، Total/Free Float. ${C.project.errors.length ? '' : 'لا توجد أخطاء في العلاقات.'}</div>`;

    root.onchange = (e) => {
      const el = e.target;
      if (el.dataset.m) { PF.Store.mutate((st) => { st.meta[el.dataset.m] = el.dataset.n !== undefined ? +el.value : el.value; }); return; }
      if (el.id === 'file') {
        const f = el.files[0]; if (!f) return;
        const rd = new FileReader();
        if (/\.xer$/i.test(f.name)) { rd.onload = () => importXer(rd.result); rd.readAsArrayBuffer(f); }
        else { rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.activities || !o.meta) throw new Error('ملف غير صالح'); PF.Store.replace(o); PF.toast('تم استيراد المشروع', 'ok'); } catch (x) { PF.toast('تعذّر الاستيراد: ' + x.message, 'err'); } }; rd.readAsText(f); }
        el.value = ''; return;
      }
      if (el.dataset.cal == null) return;
      const ci = +el.dataset.cal;
      if (el.dataset.k === 'name') PF.Store.mutate((st) => { st.calendars[ci].name = el.value; });
      else if (el.dataset.wd != null) {
        const d = +el.dataset.wd;
        const cur = S.calendars[ci].workdays.filter((x) => x !== d).concat(el.checked ? [d] : []);
        if (!cur.length) { PF.toast('يجب أن يبقى يوم عمل واحد على الأقل', 'err'); PF.App.render(false); return; }
        PF.Store.mutate((st) => { st.calendars[ci].workdays = cur.sort(); });
      } else if (el.hasAttribute('data-addhol') && el.value) PF.Store.mutate((st) => { const h = st.calendars[ci].holidays; if (!h.includes(el.value)) h.push(el.value); h.sort(); });
    };
    root.onclick = async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'json') PF.download((S.meta.code || 'project') + '.planflow.json', JSON.stringify(S, null, 1), 'application/json');
      else if (a === 'csv') PF.download((S.meta.code || 'schedule') + '.csv', csv(S, C), 'text/csv;charset=utf-8');
      else if (a === 'xer') PF.download((S.meta.code || 'project') + '.xer', PF.XER.fromState(S, C), 'text/plain;charset=utf-8');
      else if (a === 'import') PF.$('#file').click();
      else if (a === 'blank') { if (await PF.confirm('سيُستبدل المشروع الحالي بمشروع فارغ. هل تريد المتابعة؟', 'متابعة', true)) PF.Store.blank(); }
      else if (a === 'sample') { if (await PF.confirm('سيُستبدل المشروع الحالي بالمشروع التجريبي. هل تريد المتابعة؟', 'متابعة', true)) PF.Store.reset(); }
      else if (a === 'addcal') PF.Store.mutate((st) => st.calendars.push({ id: PF.uid('cal'), name: 'تقويم جديد', workdays: [0, 1, 2, 3, 4], holidays: [] }));
      else if (b.dataset.delcal != null) {
        const ci = +b.dataset.delcal, id = S.calendars[ci].id;
        PF.Store.mutate((st) => { st.calendars.splice(ci, 1); st.activities.forEach((x) => { if (x.cal === id) x.cal = ''; }); if (st.meta.defaultCal === id) st.meta.defaultCal = st.calendars[0].id; });
      } else if (b.dataset.delhol != null) PF.Store.mutate((st) => st.calendars[+b.dataset.cal].holidays.splice(+b.dataset.delhol, 1));
    };
  }

  PF.Views.settings = { render };
})(window);

</script>
  <script>
/* PlanFlow — التنقل وإعادة الرسم */
(function (g) {
  const PF = g.PF;
  const D = PF.D;
  PF.Views = PF.Views || {};

  const NAV = [
    ['dashboard', 'لوحة المشروع', 'dashboard'],
    ['schedule', 'الجدول الزمني', 'schedule'],
    ['progress', 'تحديث التقدّم', 'progress'],
    ['materials', 'المواد والمشتريات', 'materials'],
    ['baselines', 'خط الأساس', 'baselines'],
    ['scurve', 'منحنى S والأداء', 'scurve'],
    ['resources', 'الموارد', 'resources'],
    ['settings', 'الإعدادات والبيانات', 'settings'],
  ];

  let cur = 'dashboard';
  const scrollMem = {};

  function route() {
    const h = (location.hash || '').replace(/^#\/?/, '');
    return PF.Views[h] ? h : 'dashboard';
  }

  function drawNav() {
    const M = PF.Calc.metrics(PF.Store.state, PF.Store.C);
    PF.$('#nav').innerHTML = NAV.map(([id, label, ic]) => {
      let badge = '';
      if (id === 'materials' && M.matLate) badge = `<span class="badge" title="مواد متأخرة">${M.matLate}</span>`;
      if (id === 'schedule' && M.neg) badge = `<span class="badge" title="أنشطة بـ Float سالب">${M.neg}</span>`;
      return `<a href="#/${id}" class="${id === cur ? 'on' : ''}">${PF.icon(ic)}<span>${label}</span>${badge}</a>`;
    }).join('');
  }

  function drawTop() {
    const S = PF.Store.state, st = PF.Store;
    const label = NAV.find((n) => n[0] === cur)[1];
    PF.$('#top').innerHTML = `
      <h1>${label}</h1>
      <span class="proj">${PF.esc(S.meta.name)}</span>
      <span class="sp"></span>
      <span class="pill" title="تاريخ البيانات: آخر يوم تم تحديث التقدّم حتى نهايته">تاريخ البيانات <b class="num">${D.fmtLong(D.toNum(S.meta.dataDate))}</b></span>
      <button class="btn icon-btn" id="undo" title="تراجع (Ctrl+Z)" ${st.canUndo ? '' : 'disabled'}>${PF.icon('undo')}</button>
      <button class="btn icon-btn" id="redo" title="إعادة (Ctrl+Y)" ${st.canRedo ? '' : 'disabled'}>${PF.icon('redo')}</button>
      <button class="btn icon-btn" id="print" title="طباعة">${PF.icon('print')}</button>`;
    PF.$('#undo').onclick = () => st.undo();
    PF.$('#redo').onclick = () => st.redo();
    PF.$('#print').onclick = () => window.print();
  }

  function render(first) {
    const main = PF.$('#view');
    // حفظ مواضع التمرير والتركيز
    main.querySelectorAll('[data-keepscroll]').forEach((el) => (scrollMem[el.dataset.keepscroll] = [el.scrollLeft, el.scrollTop]));
    const mainTop = main.scrollTop;
    const ae = document.activeElement;
    const fkey = ae && ae.dataset && ae.dataset.fkey;
    const sel = ae && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;

    document.title = 'PlanFlow — ' + PF.Store.state.meta.name;
    drawNav();
    drawTop();
    const v = PF.Views[cur];
    main.className = 'view' + (v.flush ? ' flush' : '');
    ['onclick', 'onchange', 'ondblclick', 'oninput', 'onpointerdown'].forEach((k) => (main[k] = null));
    main.innerHTML = '';
    v.render(main);

    main.querySelectorAll('[data-keepscroll]').forEach((el) => { const m = scrollMem[el.dataset.keepscroll]; if (m && !first) { el.scrollLeft = m[0]; el.scrollTop = m[1]; } });
    if (!first && !v.flush) main.scrollTop = mainTop;
    if (fkey) {
      const el = main.querySelector('[data-fkey="' + fkey.replace(/"/g, '\\"') + '"]');
      if (el) { el.focus(); try { if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); else el.select && el.select(); } catch (e) { /* date/number */ } }
    }
  }

  function go() {
    const next = route();
    if (next !== cur) { cur = next; render(true); }
  }

  function boot() {
    PF.Store.init();
    cur = route();
    window.addEventListener('hashchange', () => { cur = route(); render(true); });
    // تنقّل لا يعتمد على الـ hash (يعمل أيضاً داخل المعاينات المعزولة)
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#/"]');
      if (!a) return;
      e.preventDefault();
      const id = a.getAttribute('href').slice(2);
      if (!PF.Views[id]) return;
      try { history.replaceState(null, '', '#/' + id); } catch (err) { /* معاينة معزولة */ }
      if (a.hasAttribute('data-crit') && PF.Views.schedule.setFilter) PF.Views.schedule.setFilter('crit');
      cur = id; render(true);
    });
    PF.Store.subscribe(() => render(false));
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? PF.Store.redo() : PF.Store.undo(); }
      if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); PF.Store.redo(); }
    });
    render(true);
  }

  PF.App = { go, render, NAV };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
</body>
