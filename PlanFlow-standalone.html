<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanFlow — إدارة الجداول الزمنية للمشاريع</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --bg: #eceeed; --panel: #fbfbfa; --ink: #14202b; --muted: #667380; --line: #d9dedc; --line2: #e8ebe9;
  --side: #12202c; --side2: #1b2d3c; --side-ink: #b9c6d2;
  --hv: #f4c20d;            /* لون السلامة (أصفر الموقع) */
  --primary: #1f56c4; --primary-d: #17429c;
  --crit: #d9482b; --near: #e08a00; --ok: #1e8f63; --bar: #3a64c8; --done: #8a97a3;
  --r: 8px; --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.num, td.n, .tabular { font-variant-numeric: tabular-nums; }

/* ---------- الهيكل ---------- */
.app { display: grid; grid-template-columns: 228px 1fr; height: 100vh; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding: 18px 12px; gap: 6px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; color: #fff; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
.brand small { display: block; font-size: 11px; color: var(--side-ink); font-weight: 400; margin-top: -2px; }
.mark { width: 34px; height: 34px; background: var(--hv); border-radius: 7px; position: relative; flex: none; }
.mark::before, .mark::after { content: ''; position: absolute; height: 5px; background: var(--side); border-radius: 2px; }
.mark::before { right: 7px; top: 9px; width: 14px; }
.mark::after { left: 7px; top: 19px; width: 17px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 7px; color: var(--side-ink); text-decoration: none; position: relative; cursor: pointer; transition: background .15s, color .15s; }
.nav a:hover { background: var(--side2); color: #fff; }
.nav a.on { background: var(--side2); color: #fff; font-weight: 600; }
.nav a.on::before { content: ''; position: absolute; right: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 3px 0 0 3px; background: var(--hv); }
.nav .badge { margin-inline-start: auto; background: var(--crit); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 600; }
.side .foot { margin-top: auto; font-size: 11.5px; color: #7f91a2; padding: 10px 8px 0; line-height: 1.7; }
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { font-size: 18px; }
.top .proj { color: var(--muted); font-size: 13px; }
.top .sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 3px 11px; font-size: 12.5px; white-space: nowrap; }
.pill b { font-weight: 600; }
.view { flex: 1; overflow: auto; padding: 20px 22px 40px; min-height: 0; }
.view.flush { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- أزرار وحقول ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 13px; cursor: pointer; font-weight: 500; transition: background .12s, border-color .12s; white-space: nowrap; }
.btn:hover { background: #f1f3f2; border-color: #c4cbc8; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-d); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 32px; height: 32px; padding: 0; justify-content: center; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.fld > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea { border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 6px 9px; min-width: 0; width: 100%; }
input:not([type=checkbox]):not([type=hidden]), select { height: 34px; }
textarea { height: auto; }
.num { direction: ltr; unicode-bidi: isolate; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }
textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row > .fld { flex: 1 1 130px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip i { font-style: normal; opacity: .65; margin-inline-start: 4px; }

/* ---------- بطاقات ---------- */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g21 { grid-template-columns: 2fr 1fr; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card > h3 { font-size: 14.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.kpi { padding: 14px 16px; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi .v { font-size: 25px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.bad { border-top: 3px solid var(--crit); } .kpi.warn { border-top: 3px solid var(--near); } .kpi.good { border-top: 3px solid var(--ok); } .kpi.neutral { border-top: 3px solid var(--line); }
.t-bad { color: var(--crit); } .t-warn { color: var(--near); } .t-good { color: var(--ok); } .t-mut { color: var(--muted); }
.bar-track { height: 7px; background: var(--line2); border-radius: 4px; overflow: hidden; position: relative; margin-top: 7px; }
.bar-track i { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 4px; }
.bar-track b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.stack { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: var(--line2); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 12.5px; margin: -4px 0 12px; }
.pagehead { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.pagehead h2 { font-size: 20px; } .pagehead .sp { flex: 1; }

/* ---------- جداول ---------- */
.tw { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { background: #f0f2f1; text-align: start; font-weight: 600; font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: #f6f8f7; }
table.t td.n, table.t th.n { text-align: center; }
table.t input, table.t select { padding: 3px 6px; font-size: 13px; }
table.t input[type=number] { text-align: center; }
.tag { display: inline-block; border-radius: 5px; padding: 1px 8px; font-size: 12px; font-weight: 500; background: var(--line2); white-space: nowrap; }
.tag.late, .tag.crit { background: #fbe3dd; color: #a6301a; } .tag.risk, .tag.near { background: #fdecd0; color: #8f5600; }
.tag.ok, .tag.done { background: #d9f0e6; color: #146845; } .tag.info { background: #dfe8fa; color: #1d3f8f; }
.tag.none { background: var(--line2); color: var(--muted); }
.link { color: var(--primary); cursor: pointer; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line2); }
.qrow:last-child { border-bottom: 0; }
.qrow .c { min-width: 28px; text-align: center; font-weight: 700; border-radius: 5px; padding: 0 6px; background: #d9f0e6; color: #146845; }
.qrow .c.bad { background: #fbe3dd; color: #a6301a; } .qrow .c.warn { background: #fdecd0; color: #8f5600; }

/* ---------- الجدول الزمني + Gantt ---------- */
.stool { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.stool .sp { flex: 1; }
.stool input[type=text], .stool select { width: auto; min-width: 120px; }
.stool label.cb { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; cursor: pointer; }
.sgrid { flex: 1; overflow: auto; background: #fff; direction: ltr; position: relative; min-height: 0; }
.sinner { position: relative; min-width: 100%; }
.shead, .srow { display: flex; }
.shead { position: sticky; top: 0; z-index: 6; height: 44px; background: #eef0ef; border-bottom: 1px solid var(--line); }
.scells { display: flex; align-items: center; flex: none; position: sticky; left: 0; z-index: 4; background: #fff; border-right: 2px solid var(--line); width: var(--tblw, 640px); }
.shead .scells { background: #eef0ef; z-index: 7; font-size: 12px; font-weight: 600; height: 100%; }
.c { flex: none; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.c-id { width: 74px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.c-name { width: 244px; }
.c-dur { width: 52px; text-align: center; } .c-s, .c-f { width: 80px; text-align: center; font-size: 12.5px; } .c-tf { width: 52px; text-align: center; } .c-pct { width: 56px; text-align: center; }
.srow { height: 34px; border-bottom: 1px solid var(--line2); }
.srow .scells { height: 34px; }
.srow.sel .scells, .srow.sel .gcell { background: #eaf0fc; }
.srow:hover .scells { background: #f6f8f7; } .srow.sel:hover .scells { background: #eaf0fc; }
.srow.grp .scells { background: #f0f2f1; font-weight: 600; }
.srow.grp .c-name { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.srow.grp .caret { transition: transform .15s; } .srow.grp.col .caret { transform: rotate(90deg); }
.cell-in { border: 1px solid transparent !important; background: transparent !important; width: 100%; padding: 3px 4px !important; border-radius: 5px; height: 26px; }
.cell-in:hover { border-color: var(--line) !important; } .cell-in:focus { border-color: var(--primary) !important; background: #fff !important; }
.cell-in[type=number] { text-align: center; -moz-appearance: textfield; }
.cell-in::-webkit-outer-spin-button, .cell-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); flex: none; } .sdot.crit { background: var(--crit); } .sdot.near { background: var(--near); } .sdot.done { background: var(--ok); }
.tfv.neg { color: var(--crit); font-weight: 700; } .tfv.zero { color: var(--crit); font-weight: 600; } .tfv.low { color: var(--near); }
.gcell { position: relative; flex: none; height: 34px; }
.mth, .wk { position: absolute; top: 0; border-left: 1px solid var(--line); font-size: 11.5px; padding: 0 5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.mth { height: 22px; line-height: 22px; font-weight: 600; color: var(--ink); direction: rtl; } .wk { top: 22px; height: 22px; line-height: 22px; }
.gbg { position: absolute; top: 44px; bottom: 0; left: var(--tblw, 640px); right: 0; pointer-events: none; z-index: 0; }
.nw { position: absolute; top: 0; bottom: 0; background: rgba(20, 32, 43, .045); }
.dline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--crit); z-index: 2; } .dline.today { border-left: 1.5px dashed var(--primary); }
.dline span { position: absolute; top: 2px; left: 4px; font-size: 11px; background: var(--crit); color: #fff; padding: 0 5px; border-radius: 3px; direction: rtl; white-space: nowrap; } .dline.today span { background: var(--primary); }
.rows { position: relative; }
.links { position: absolute; top: 0; left: var(--tblw, 640px); pointer-events: none; z-index: 1; overflow: visible; }
.links path { fill: none; stroke: #8b98a5; stroke-width: 1.2; } .links path.crit { stroke: var(--crit); stroke-width: 1.5; } .links polygon { fill: #8b98a5; } .links polygon.crit { fill: var(--crit); }
.bar { position: absolute; top: 8px; height: 18px; border-radius: 4px; background: var(--bar); z-index: 3; cursor: grab; min-width: 3px; box-shadow: 0 1px 0 rgba(0,0,0,.12); touch-action: none; }
.bar.crit { background: var(--crit); } .bar.near { background: var(--near); } .bar.done { background: var(--done); cursor: default; } .bar.prog { cursor: default; }
.bar .pf { position: absolute; inset: 0 auto 0 0; background: rgba(0, 0, 0, .32); border-radius: 4px 0 0 4px; }
.bar .rh { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.bar.dragging { opacity: .75; cursor: grabbing; z-index: 8; }
.ms { position: absolute; top: 9px; width: 16px; height: 16px; background: var(--ink); transform: translateX(-8px) rotate(45deg); z-index: 3; border-radius: 2px; cursor: default; } .ms.crit { background: var(--crit); } .ms.done { background: var(--done); }
.gsum { position: absolute; top: 12px; height: 8px; background: var(--ink); z-index: 3; border-radius: 1px; }
.gsum::before, .gsum::after { content: ''; position: absolute; top: 5px; border: 5px solid transparent; border-top: 6px solid var(--ink); } .gsum::before { left: 0; } .gsum::after { right: 0; }
.fl { position: absolute; top: 16px; height: 3px; background: repeating-linear-gradient(90deg, rgba(20, 32, 43, .35) 0 3px, transparent 3px 5px); z-index: 2; }
.bl { position: absolute; top: 27px; height: 4px; background: #9aa6b0; border-radius: 2px; z-index: 2; }
.blabel { position: absolute; top: 8px; line-height: 18px; font-size: 12px; color: #45525e; white-space: nowrap; z-index: 3; direction: rtl; pointer-events: none; }
.sched-empty { padding: 40px; text-align: center; color: var(--muted); direction: rtl; }
.collapsed-tbl .c-dur, .collapsed-tbl .c-s, .collapsed-tbl .c-f, .collapsed-tbl .c-tf, .collapsed-tbl .c-pct { display: none; }

/* ---------- نوافذ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 25, 35, .5); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; z-index: 100; overflow-y: auto; }
.modal { background: var(--panel); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); animation: pop .16s ease-out; }
.modal.wide { width: min(860px, 100%); }
@keyframes pop { from { transform: translateY(8px); opacity: .4; } }
.modal header { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal header h3 { flex: 1; font-size: 16px; }
.modal .x { border: 0; background: none; font-size: 16px; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; } .modal .x:hover { background: var(--line2); }
.mbody { padding: 16px 18px; max-height: 68vh; overflow-y: auto; }
.modal footer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); justify-content: flex-start; }
.msec { margin-bottom: 18px; } .msec > h4 { font-size: 13.5px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line2); }
.rel { display: grid; grid-template-columns: 1fr 86px 78px 32px; gap: 6px; margin-bottom: 6px; align-items: center; }
.rel.res { grid-template-columns: 1fr 100px 32px; }
#toasts { position: fixed; bottom: 18px; left: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); font-size: 13.5px; animation: pop .2s; transition: opacity .3s; max-width: 380px; }
.toast.err { background: var(--crit); } .toast.ok { background: var(--ok); } .toast.out { opacity: 0; }

/* ---------- مخططات ---------- */
.chart { width: 100%; } .chart-svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line2); stroke-width: 1; } .chart .grid.v { stroke: #f0f2f1; }
.chart .ax { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-inline-end: 6px; vertical-align: middle; }

.note { background: #fff8e1; border: 1px solid #f0dc9a; border-radius: 8px; padding: 9px 13px; font-size: 13px; margin-bottom: 14px; }
.note.bad { background: #fdeceb; border-color: #f1b9ae; }

@media (max-width: 1100px) { .g4, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; } .g21 { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
  .side { flex-direction: row; overflow-x: auto; padding: 8px; align-items: center; } .brand, .side .foot { display: none; }
  .nav { display: flex; gap: 4px; } .nav a { white-space: nowrap; padding: 8px 11px; } .nav a.on::before { display: none; }
  .main { height: auto; } .view { overflow: visible; padding: 14px; } .g2, .g3, .g4, .g6 { grid-template-columns: 1fr; }
  .view.flush { min-height: 80vh; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print {
  .side, .top .btn, .stool, .no-print { display: none !important; } .app { display: block; height: auto; } .main, .view { height: auto; overflow: visible; }
  body { background: #fff; } .card { break-inside: avoid; }
}

</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark"></div><div><b>PlanFlow</b><small>جدولة وتحكّم بالمشاريع</small></div></div>
      <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
      <div class="foot">تُحفظ التعديلات تلقائياً في المتصفح.<br>للنسخ الاحتياطي: الإعدادات ← تصدير.</div>
    </aside>
    <div class="main">
      <header class="top" id="top"></header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- ترتيب التحميل مهم: الأدوات ← المحرك ← الحالة ← الواجهات -->
  <script>
/* PlanFlow — أدوات التواريخ. التاريخ يُخزَّن كنص ISO ويُحسب كرقم أيام (أيام منذ 1970-01-01). */
(function (g) {
  const PF = (g.PF = g.PF || {});
  const MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const D = {
    MONTHS, DAYS,
    toNum(iso) {
      const p = String(iso).slice(0, 10).split('-');
      return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
    },
    toIso(n) { return new Date(n * 86400000).toISOString().slice(0, 10); },
    dow(n) { return (((n + 4) % 7) + 7) % 7; }, // 0 = الأحد
    parts(n) { const d = new Date(n * 86400000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; },
    fmt(n) {
      if (n == null || isNaN(n)) return '';
      const p = D.parts(n);
      return String(p.d).padStart(2, '0') + '/' + String(p.m + 1).padStart(2, '0') + '/' + String(p.y).slice(2);
    },
    fmtLong(n) { const p = D.parts(n); return p.d + ' ' + MONTHS[p.m] + ' ' + p.y; },
    today() { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000); },

    return S.materials.map((m) => {

      else if (req == null) { health = 'none'; reason = 'غير مربوطة بنشاط'; }
      else if (delta > 0) { health = 'late'; reason = (projected ? 'ستتأخر ' : 'متأخرة ') + delta + ' يوم'; }

        const left = due - dd;

    s.baselines = s.baselines || [];
    s.snapshots = s.snapshots || [];
    s.activities = s.activities || [];

      a.resources = a.resources || [];
      a.type = a.type || 'task';
      a.pct = a.pct || 0;

    init() {
      let s = null;
      try { const raw = localStorage.getItem(KEY); if (raw) s = JSON.parse(raw); } catch (e) { s = null; }

      recompute();

    get state() { return state; },
    get C() { return comp; },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    mutate(fn, label) {
      const before = JSON.stringify(state);

        fn(state);

        recompute();
        persist();
        emit();
      } catch (e) {
        console.error(e);
        state = JSON.parse(before);

        wbs: [{ id: 'w1', name: 'المجموعة الرئيسية' }],

  const PRED = { PR_FS: 'FS', PR_SS: 'SS', PR_FF: 'FF', PR_SF: 'SF' };
  const PRED_BACK = { FS: 'PR_FS', SS: 'PR_SS', FF: 'PR_FF', SF: 'PR_SF' };
  const CSTR = { CS_MSOA: 'SNET', CS_MEOA: 'FNET', CS_MSOB: 'SNLT', CS_MEOB: 'FNLT', CS_MSO: 'MSO', CS_MEO: 'MFO', CS_MANDSTART: 'MSO', CS_MANDFIN: 'MFO' };
  const CSTR_BACK = { SNET: 'CS_MSOA', FNET: 'CS_MEOA', SNLT: 'CS_MSOB', FNLT: 'CS_MEOB', MSO: 'CS_MSO', MFO: 'CS_MEO' };
  const RTYPE = { RT_Labor: 'عمالة', RT_Equip: 'معدات', RT_Mat: 'مواد' };
  const RTYPE_BACK = { 'عمالة': 'RT_Labor', 'معدات': 'RT_Equip', 'مواد': 'RT_Mat' };

  /* ───────────── قراءة النص إلى جداول ───────────── */
  function parse(text) {

      const st = t.status_code;
      if (st === 'TK_Complete') {
        a.pct = 100; a.actualStart = dpart(t.act_start_date) || null; a.actualFinish = dpart(t.act_end_date) || a.actualStart; a.remaining = 0;
        if (!a.actualStart) a.actualStart = a.actualFinish;
      } else if (st === 'TK_Active') {
        a.actualStart = dpart(t.act_start_date) || null;
        const phys = hrs(t.phys_complete_pct);
        const byDur = target > 0 ? Math.round((1 - rem / target) * 100) : 0;
        a.pct = Math.min(99, Math.max(1, t.complete_pct_type === 'CP_Phys' && phys > 0 ? Math.round(phys) : byDur));
        a.remaining = Math.max(1, Math.round(rem / hd));
      }
      const cs = CSTR[t.cstr_type];
      if (cs && dpart(t.cstr_date)) a.constraint = { type: cs, date: dpart(t.cstr_date) };
      else if (t.cstr_type && t.cstr_type !== 'CS_ALAP' && !cs) unsupported++;
      // موارد وتكلفة
      (trByTask[t.task_id] || []).forEach((tr) => {
        a.budget += hrs(tr.target_cost);
        a.actualCost += hrs(tr.act_reg_cost) + hrs(tr.act_ot_cost);
        const r = rById[tr.rsrc_id];
        if (!r) return;
        const qty = hrs(tr.target_qty);
        if (a.dur > 0 && qty > 0) {
          const perDay = r.rsrc_type === 'RT_Mat' ? qty / a.dur : qty / (a.dur * hd);
          resUsed.add(tr.rsrc_id);
          a.resources.push({ rid: 'r' + tr.rsrc_id, perDay: Math.round(perDay * 10) / 10 });

    tasks.forEach((t) => { calHd[t.task_id] = dayHr(t.clndr_id || defCid); });

    const startIso = dpart(pr.plan_start_date) || starts[0] || D.toIso(D.today());

  // يقارن تواريخ PlanFlow المحسوبة بتواريخ P6 المخزّنة في الملف (Early Start / Early Finish)
  function compare(S, C, p6) {
    let n = 0, okS = 0, okF = 0;
    const diffs = [];
    S.activities.forEach((a) => {
      const ref = p6[a.id], r = C.byId[a.id];
      if (!ref || !ref.s || !ref.f || !r) return;
      n++;
      const s = D.toIso(r.s), f = D.toIso(r.lastDay);
      const gs = s === ref.s, gf = f === ref.f;
      if (gs) okS++;
      if (gf) okF++;
      if (!gs || !gf) diffs.push({ id: a.id, name: a.name, p6s: ref.s, p6f: ref.f, s, f, ds: D.toNum(s) - D.toNum(ref.s), df: D.toNum(f) - D.toNum(ref.f) });
    });
    diffs.sort((x, y) => Math.max(Math.abs(y.ds), Math.abs(y.df)) - Math.max(Math.abs(x.ds), Math.abs(x.df)));
    return { total: n, matchStart: okS, matchFinish: okF, diffs };

  /* ───────────── من مشروع PlanFlow إلى XER ───────────── */
  function fromState(S, C) {
    const HD = 8;
    const q = (v) => (v == null ? '' : String(v).replace(/[\t\r\n]+/g, ' '));
    const out = [];
    const table = (name, fields, rows) => {
      out.push('%T\t' + name, '%F\t' + fields.join('\t'));
      rows.forEach((r) => out.push('%R\t' + r.map(q).join('\t')));
      out.push('%E');
    };
    const today = D.toIso(D.today());
    out.push(['ERMHDR', '19.12', today, 'Project', 'admin', 'admin', 'PlanFlow', 'Project Management', 'USD'].join('\t'));

    const cid = {}; S.calendars.forEach((c, i) => { cid[c.id] = 100 + i; });
    const defCid = cid[S.meta.defaultCal] || cid[S.calendars[0].id];
    const tid = {}; S.activities.forEach((a, i) => { tid[a.id] = 1000 + i; });
    const wid = {}; S.wbs.forEach((w, i) => { wid[w.id] = 10 + i; });
    const rid = {}; S.resources.forEach((r, i) => { rid[r.id] = 500 + i; });
    const ROOT = 1, PROJ = 1;

    table('CURRTYPE', ['curr_id', 'decimal_digit_cnt', 'curr_symbol', 'decimal_symbol', 'digit_group_symbol', 'pos_curr_fmt_type', 'neg_curr_fmt_type', 'curr_type', 'curr_short_name', 'group_digit_cnt', 'base_exch_rate'],
      [[1, 2, '$', '.', ',', '#1.1', '(#1.1)', 'US Dollar', S.meta.currency || 'USD', 3, 1]]);

    const calData = (c) => {
      const days = [];
      for (let d = 1; d <= 7; d++) {
        const on = c.workdays.includes(d - 1);
        days.push(on ? '(0||' + d + '()((0||0(s|08:00|f|16:00)())))' : '(0||' + d + '()())');
      }
      const ex = (c.holidays || []).map((h, i) => '(0||' + i + '(d|' + (D.toNum(h) + EXCEL_EPOCH) + ')())').join('');

      S.calendars.map((c) => [cid[c.id], cid[c.id] === defCid ? 'Y' : 'N', c.name, '', '', today + ' 00:00', 'CA_Base', HD, HD * c.workdays.length, HD * c.workdays.length * 4, HD * c.workdays.length * 52, 'N', calData(c)]));

    table('PROJECT', ['proj_id', 'proj_short_name', 'clndr_id', 'project_flag', 'def_complete_pct_type', 'def_duration_type', 'critical_path_type', 'last_recalc_date', 'plan_start_date', 'add_date'],
      [[PROJ, S.meta.code || 'PRJ', defCid, 'Y', 'CP_Drtn', 'DT_FixedDUR2', 'CT_TotFloat', ddIso + ' 08:00', startIso + ' 08:00', today + ' 00:00']]);

    const wbsRows = [[ROOT, PROJ, 0, 'Y', 'WS_Open', S.meta.code || 'PRJ', S.meta.name, '']];
    S.wbs.forEach((w, i) => wbsRows.push([wid[w.id], PROJ, i + 1, 'N', 'WS_Open', 'W' + (i + 1), w.name, ROOT]));
    table('PROJWBS', ['wbs_id', 'proj_id', 'seq_num', 'proj_node_flag', 'status_code', 'wbs_short_name', 'wbs_name', 'parent_wbs_id'], wbsRows);

    const bl = CPM.baselineOf(S);
    const dt = (iso, t) => (iso ? iso + ' ' + (t || '08:00') : '');
    const taskRows = S.activities.map((a) => {
      const r = C.byId[a.id], mile = a.type === 'milestone';
      const status = r.status === 'complete' ? 'TK_Complete' : r.status === 'inprogress' ? 'TK_Active' : 'TK_NotStart';
      const rem = status === 'TK_Complete' ? 0 : status === 'TK_Active' ? (a.remaining != null ? a.remaining : Math.max(1, Math.round(a.dur * (100 - a.pct) / 100))) : a.dur;
      const b = bl && bl.data[a.id];

      const cs = a.constraint && CSTR_BACK[a.constraint.type];
      return [tid[a.id], PROJ, wid[a.wbs] || ROOT, cid[a.cal] || defCid, a.pct, status === 'TK_Active' ? 'CP_Phys' : 'CP_Drtn', mile ? 'TT_Mile' : 'TT_Task', 'DT_FixedDUR2', status, a.id, a.name,
        a.dur * HD, rem * HD, dt(D.toIso(r.s), '08:00'), dt(D.toIso(mile ? r.s : r.lastDay), mile ? '08:00' : '16:00'),
        dt(tS), dt(tF, mile ? '08:00' : '16:00'), dt(a.actualStart), dt(a.actualFinish, mile ? '08:00' : '16:00'),
        cs ? a.constraint.date + ' 08:00' : '', cs || '', r.tf * HD, r.ff * HD];
    });
    table('TASK', ['task_id', 'proj_id', 'wbs_id', 'clndr_id', 'phys_complete_pct', 'complete_pct_type', 'task_type', 'duration_type', 'status_code', 'task_code', 'task_name', 'target_drtn_hr_cnt', 'remain_drtn_hr_cnt', 'early_start_date', 'early_end_date', 'target_start_date', 'target_end_date', 'act_start_date', 'act_end_date', 'cstr_date', 'cstr_type', 'total_float_hr_cnt', 'free_float_hr_cnt'], taskRows);

    const preds = [];
    let pn = 5000;
    S.activities.forEach((a) => a.preds.forEach((p) => {
      if (tid[p.id] == null) return;
      preds.push([pn++, tid[a.id], tid[p.id], PROJ, PROJ, PRED_BACK[p.type] || 'PR_FS', (p.lag || 0) * HD]);

    table('TASKPRED', ['task_pred_id', 'task_id', 'pred_task_id', 'proj_id', 'pred_proj_id', 'pred_type', 'lag_hr_cnt'], preds);

    if (S.resources.length) {
      table('RSRC', ['rsrc_id', 'parent_rsrc_id', 'clndr_id', 'rsrc_name', 'rsrc_short_name', 'rsrc_type', 'active_flag'],
        S.resources.map((r) => [rid[r.id], '', defCid, r.name, 'R' + rid[r.id], RTYPE_BACK[r.type] || 'RT_Labor', 'Y']));
      const tr = []; let tn = 9000;
      S.activities.forEach((a) => {
        const w = a.resources.filter((x) => rid[x.rid] != null);
        w.forEach((x) => {
          const r = S.resources.find((y) => y.id === x.rid);
          const qty = r.type === 'مواد' ? x.perDay * a.dur : x.perDay * a.dur * HD;
          tr.push([tn++, tid[a.id], PROJ, rid[x.rid], qty, w.length ? Math.round((+a.budget || 0) / w.length) : 0, Math.round((+a.actualCost || 0) / (w.length || 1))]);
        });
      });
      table('TASKRSRC', ['taskrsrc_id', 'task_id', 'proj_id', 'rsrc_id', 'target_qty', 'target_cost', 'act_reg_cost'], tr);
    }

  }

  // يفك ترميز ملف XER: UTF-8 أولاً، وإلا Windows-1256 (العربية) ثم Windows-1252

(function (g) {
  const PF = (g.PF = g.PF || {});
  const D = PF.D, esc = PF.esc;
  const MS = ['ك2', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'ت1', 'ت2', 'ك1'];

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  // مخطط خطوط على محور زمني
  // opts: {w,h,series:[{name,color,pts:[[t,v]],dash,width,dots}], xmin,xmax, vlines:[{x,label,color}], yfmt}
  function lines(o) {
    const w = o.w || 760, h = o.h || 320, pl = 56, pr = 14, pt = 16, pb = 34;
    const iw = w - pl - pr, ih = h - pt - pb;
    const all = o.series.flatMap((s) => s.pts);
    const xmin = o.xmin != null ? o.xmin : Math.min(...all.map((p) => p[0]));
    const xmax = o.xmax != null ? o.xmax : Math.max(...all.map((p) => p[0]));
    const ymax = o.ymax || niceMax(Math.max(1, ...all.map((p) => p[1])));

    const Y = (v) => pt + ih - (v / ymax) * ih;
    const yfmt = o.yfmt || PF.compact;
    let s = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'مخطط')}">`;
    for (let i = 0; i <= 4; i++) {
      const v = (ymax / 4) * i, y = Y(v);
      s += `<line x1="${pl}" x2="${w - pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl - 8}" y="${y + 4}" class="ax" text-anchor="end">${yfmt(v)}</text>`;
    }
    // تسميات الأشهر
    const p0 = D.parts(xmin);
    let y0 = p0.y, m0 = p0.m + 1;
    if (m0 > 11) { m0 = 0; y0++; }
    const step = xmax - xmin > 330 ? 2 : 1;
    let k = 0;
    for (let yy = y0, mm = m0; ; mm++, k++) {
      if (mm > 11) { mm = 0; yy++; }
      const t = Math.round(Date.UTC(yy, mm, 1) / 86400000);
      if (t > xmax) break;
      if (k % step === 0) s += `<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${pt + ih}" class="grid v"/><text x="${X(t)}" y="${h - 12}" class="ax" text-anchor="middle">${MS[mm]}${mm === 0 ? ' ' + yy : ''}</text>`;
    }
    (o.vlines || []).forEach((v) => {
      if (v.x < xmin || v.x > xmax) return;
      s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${pt}" y2="${pt + ih}" stroke="${v.color || '#e4572e'}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${X(v.x) + 5}" y="${pt + 11}" class="ax" fill="${v.color || '#e4572e'}">${esc(v.label)}</text>`;
    });
    o.series.forEach((se) => {
      if (!se.pts.length) return;
      const d = se.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
      s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2.2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      if (se.dots) se.pts.forEach((p) => (s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.4" fill="${se.color}" stroke="#fff" stroke-width="1.2"><title>${esc(se.name)} — ${D.fmt(p[0])}: ${PF.num(p[1])}</title></circle>`));
    });
    s += '</svg>';
    const legend = `<div class="legend">${o.series.map((se) => `<span><i style="background:${se.color};${se.dash ? 'background:repeating-linear-gradient(90deg,' + se.color + ' 0 4px,transparent 4px 7px)' : ''}"></i>${esc(se.name)}</span>`).join('')}</div>`;
    return `<div class="chart">${s}${legend}</div>`;
  }

  // أعمدة أسبوعية مع خط سعة. opts: {values:[{t,v}], cap, w,h, label}
  function bars(o) {
    const w = o.w || 760, h = o.h || 240, pl = 40, pr = 10, pt = 14, pb = 30;
    const iw = w - pl - pr, ih = h - pt - pb;
    const n = o.values.length || 1;
    const ymax = niceMax(Math.max(o.cap || 0, ...o.values.map((x) => x.v), 1) * 1.1);
    const bw = iw / n;
    const Y = (v) => pt + ih - (v / ymax) * ih;
    let s = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'مخطط')}">`;
    for (let i = 0; i <= 4; i++) { const v = (ymax / 4) * i; s += `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pl - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${PF.num(v)}</text>`; }
    o.values.forEach((x, i) => {
      const over = o.cap && x.v > o.cap;
      s += `<rect x="${pl + i * bw + 1}" y="${Y(x.v)}" width="${Math.max(2, bw - 2)}" height="${Math.max(0, pt + ih - Y(x.v))}" rx="1.5" fill="${over ? '#e4572e' : '#2b59c3'}"><title>أسبوع ${D.fmt(x.t)}: ${PF.num(x.v, 1)}${over ? ' (فوق السعة)' : ''}</title></rect>`;
      if (i % Math.ceil(n / 9) === 0) s += `<text x="${pl + i * bw + bw / 2}" y="${h - 10}" class="ax" text-anchor="middle">${D.parts(x.t).d}/${D.parts(x.t).m + 1}</text>`;
    });
    if (o.cap) s += `<line x1="${pl}" x2="${w - pr}" y1="${Y(o.cap)}" y2="${Y(o.cap)}" stroke="#172033" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${w - pr}" y="${Y(o.cap) - 5}" class="ax" text-anchor="end">السعة ${o.cap}</text>`;

  }

  // شريط مكدّس أفقي صغير

    const tot = parts.reduce((a, p) => a + p.v, 0) || 1;
    return `<div class="stack">${parts.map((p) => `<i style="width:${(p.v / tot) * 100}%;background:${p.color}" title="${esc(p.label)}: ${p.v}"></i>`).join('')}</div>`;
  }

  PF.Charts = { lines, bars, stack };

      case 'late': return !!(bl && bl.data[a.id] && r.status !== 'complete' && r.cal.wdb(bl.data[a.id].f, r.f) > 0);
      case 'prog': return r.status === 'inprogress';
      case 'todo': return r.status === 'notstarted';
      case 'done': return r.status === 'complete';
      case 'nolink': return !a.preds.length || !C.succ[a.id].length;
      default: return true;
    }
  }

  function render(root) {
    const S = S_(), C = C_();
    const bl = PF.CPM.baselineOf(S);
    const filtering = UI.filter !== 'all' || UI.q;
    const groups = S.wbs.map((w) => ({ w, acts: S.activities.filter((a) => a.wbs === w.id) }));
    const orphan = S.activities.filter((a) => !S.wbs.some((w) => w.id === a.wbs));
    if (orphan.length) groups.push({ w: { id: '', name: 'بدون مجموعة' }, acts: orphan });

    const rows = [];
    groups.forEach((gr) => {
      const vis = gr.acts.filter((a) => passes(a, S, C));
      if (filtering && !vis.length) return;
      rows.push({ t: 'g', gr });
      if (!UI.collapsed[gr.w.id]) vis.forEach((a) => rows.push({ t: 'a', a }));
    });

    // نطاق الزمن
    let mn = Infinity, mx = -Infinity;
    S.activities.forEach((a) => {
      const r = C.byId[a.id];
      mn = Math.min(mn, r.s); mx = Math.max(mx, r.f, r.lf || 0);
      if (bl && bl.data[a.id]) { mn = Math.min(mn, bl.data[a.id].s); mx = Math.max(mx, bl.data[a.id].f); }
    });
    if (!isFinite(mn)) { mn = D.toNum(S.meta.startDate); mx = mn + 60; }
    let gs = mn - 4; while (D.dow(gs) !== 0) gs--;
    const ge = mx + 12;
    const dw = UI.zoom, W = (ge - gs) * dw;
    const X = (d) => (d - gs) * dw;
    const tblW = UI.tbl ? 640 : 330;
    const idx = {}; // صف كل نشاط
    rows.forEach((r, i) => { if (r.t === 'a') idx[r.a.id] = i; });

    // ---- الرأس
    let head = '';
    for (let y = D.parts(gs).y, m = D.parts(gs).m; ; m++) {
      if (m > 11) { m = 0; y++; }
      const st = Math.max(gs, Math.round(Date.UTC(y, m, 1) / 86400000));
      if (st >= ge) break;
      const en = Math.min(ge, Math.round(Date.UTC(y, m + 1, 1) / 86400000));
      head += `<div class="mth" style="left:${X(st)}px;width:${(en - st) * dw}px">${D.MONTHS[m]} ${y}</div>`;
    }
    for (let d = gs; d < ge; d += dw >= 22 ? 1 : 7) head += `<div class="wk" style="left:${X(d)}px;width:${(dw >= 22 ? 1 : 7) * dw}px">${dw >= 8 ? D.parts(d).d : ''}</div>`;

    // ---- خلفية العطل
    let bg = '';
    for (let d = gs; d < ge; d++) {
      if (!C.defCal.isWork(d)) { let e = d; while (e + 1 < ge && !C.defCal.isWork(e + 1)) e++; bg += `<div class="nw" style="left:${X(d)}px;width:${(e - d + 1) * dw}px"></div>`; d = e; }
    }
    const dd = D.toNum(S.meta.dataDate) + 1, td = D.today();
    bg += `<div class="dline" style="left:${X(dd)}px"><span>تاريخ البيانات</span></div>`;
    if (td >= gs && td <= ge && td !== dd) bg += `<div class="dline today" style="left:${X(td)}px"><span>اليوم</span></div>`;

    // ---- الصفوف
    const rowsHtml = rows.map((row) => {
      if (row.t === 'g') {
        const { gr } = row;
        const rs = gr.acts.map((a) => C.byId[a.id]);
        const has = rs.length > 0;
        const s = has ? Math.min(...rs.map((r) => r.s)) : 0, f = has ? Math.max(...rs.map((r) => r.f)) : 0;
        const tot = gr.acts.reduce((t, a) => t + Math.max(1, a.dur || 0), 0) || 1;
        const pc = gr.acts.reduce((t, a) => t + Math.max(1, a.dur || 0) * (C.byId[a.id].status === 'complete' ? 100 : a.pct || 0), 0) / tot;
        return `<div class="srow grp ${UI.collapsed[gr.w.id] ? 'col' : ''}" data-g="${esc(gr.w.id)}">
          <div class="scells"><div class="c c-id"></div><div class="c c-name" data-gtoggle="${esc(gr.w.id)}" title="انقر للطي والفتح — انقر نقراً مزدوجاً لإعادة التسمية"><span class="caret">${PF.icon('caret', 14)}</span><span dir="auto">${esc(gr.w.name)}</span><span class="t-mut" style="font-weight:400">(${gr.acts.length})</span></div>
          <div class="c c-dur"></div><div class="c c-s">${has ? D.fmt(s) : ''}</div><div class="c c-f">${has ? D.fmt(f - 1) : ''}</div><div class="c c-tf"></div><div class="c c-pct">${has ? Math.round(pc) + '%' : ''}</div></div>
          <div class="gcell" style="width:${W}px">${has ? `<div class="gsum" style="left:${X(s)}px;width:${Math.max(4, (f - s) * dw)}px"></div>` : ''}</div></div>`;
      }
      const a = row.a, r = C.byId[a.id], isM = a.type === 'milestone';
      const tf = r.tf, tfc = r.status === 'complete' ? '' : tf < 0 ? 'neg' : tf === 0 ? 'zero' : tf <= S.meta.nearCritical ? 'low' : '';
      const cls = r.status === 'complete' ? 'done' : r.critical ? 'crit' : r.near ? 'near' : '';
      const b = bl && bl.data[a.id];
      let g2 = '';
      if (UI.base && b) {
        if (b.dur > 0) g2 += `<div class="bl" style="left:${X(b.s)}px;width:${Math.max(3, (b.f - b.s) * dw)}px" title="خط الأساس: ${D.fmt(b.s)} → ${D.fmt(b.f - 1)}"></div>`;
        else g2 += `<div class="bl" style="left:${X(b.s) - 3}px;width:6px"></div>`;
      }
      let endX;
      if (isM) {
        g2 += `<div class="ms ${cls}" data-bar="${esc(a.id)}" style="left:${X(r.s)}px" title="${esc(a.name)} — ${D.fmt(r.s)}"></div>`;
        endX = X(r.s) + 12;
      } else {
        const bw = Math.max(3, (r.f - r.s) * dw);
        if (UI.float && r.status !== 'complete' && r.lf > r.f) g2 += `<div class="fl" style="left:${X(r.f)}px;width:${(r.lf - r.f) * dw}px" title="Float: ${tf} يوم"></div>`;
        const pct = r.status === 'complete' ? 100 : a.pct || 0;
        const drag = r.status === 'notstarted' ? '' : ' prog';
        g2 += `<div class="bar ${cls}${drag}" data-bar="${esc(a.id)}" style="left:${X(r.s)}px;width:${bw}px" title="${esc(a.name)}&#10;${D.fmt(r.s)} → ${D.fmt(r.lastDay)} · ${a.dur} يوم · إنجاز ${pct}%"><div class="pf" style="width:${pct}%"></div>${r.status === 'notstarted' ? '<div class="rh" data-rh></div>' : ''}</div>`;
        endX = X(r.s) + bw;
      }
      g2 += `<div class="blabel" style="left:${endX + 8}px" dir="auto">${esc(a.name)}</div>`;
      const dot = r.status === 'complete' ? 'done' : r.critical ? 'crit' : r.near ? 'near' : '';
      return `<div class="srow ${UI.sel === a.id ? 'sel' : ''}" data-row="${esc(a.id)}">
        <div class="scells">
          <div class="c c-id"><span class="sdot ${dot}"></span>${esc(a.id)}</div>
          <div class="c c-name"><input class="cell-in" dir="auto" value="${esc(a.name)}" data-f="name" data-id="${esc(a.id)}" data-fkey="${esc(a.id)}:name"></div>
          <div class="c c-dur">${isM ? '<span class="t-mut">◆</span>' : `<input class="cell-in" type="number" min="1" value="${a.dur}" data-f="dur" data-id="${esc(a.id)}" data-fkey="${esc(a.id)}:dur" ${r.status === 'complete' ? 'disabled' : ''}>`}</div>
          <div class="c c-s num">${D.fmt(r.s)}</div><div class="c c-f num">${D.fmt(r.lastDay)}</div>
          <div class="c c-tf num tfv ${tfc}">${r.status === 'complete' ? '—' : tf}</div>
          <div class="c c-pct"><input class="cell-in" type="number" min="0" max="100" value="${r.status === 'complete' ? 100 : a.pct || 0}" data-f="pct" data-id="${esc(a.id)}" data-fkey="${esc(a.id)}:pct"></div>
        </div>
        <div class="gcell" style="width:${W}px">${g2}</div></div>`;
    }).join('');

    // ---- الروابط
    let links = '';
    if (UI.links) {
      const yc = (i) => i * ROWH + ROWH / 2;
      rows.forEach((row) => {
        if (row.t !== 'a') return;
        const a = row.a, r = C.byId[a.id], j = idx[a.id];
        a.preds.forEach((p) => {
          const pi = idx[p.id];
          if (pi == null) return;
          const pr = C.byId[p.id], t = p.type || 'FS';
          const fromFinish = t === 'FS' || t === 'FF', toStart = t === 'FS' || t === 'SS';
          const pxs = (pr.dur === 0 ? X(pr.s) + (fromFinish ? 8 : -8) : fromFinish ? X(pr.f) : X(pr.s));
          const sxs = (r.dur === 0 ? X(r.s) + (toStart ? -8 : 8) : toStart ? X(r.s) : X(r.f));
          const y1 = yc(pi), y2 = yc(j);
          const o1 = pxs + (fromFinish ? 7 : -7), o2 = sxs + (toStart ? -7 : 7);
          const ym = y2 > y1 ? y1 + ROWH / 2 : y1 - ROWH / 2;
          const crit = pr.critical && r.critical && pr.status !== 'complete' ? ' crit' : '';
          const dir = toStart ? 1 : -1;
          links += `<path class="${crit.trim()}" d="M${pxs} ${y1} L${o1} ${y1} L${o1} ${ym} L${o2} ${ym} L${o2} ${y2} L${sxs - dir * 1} ${y2}"/>`;
          links += `<polygon class="${crit.trim()}" points="${sxs},${y2} ${sxs - dir * 6},${y2 - 3.5} ${sxs - dir * 6},${y2 + 3.5}"/>`;
        });
      });
    }

    const selA = UI.sel && S.activities.find((a) => a.id === UI.sel);
    root.innerHTML = `
      <div class="stool no-print">
        <button class="btn primary" data-act="add">${PF.icon('plus')} نشاط</button>
        <button class="btn" data-act="addm">${PF.icon('plus')} معلم</button>
        <button class="btn" data-act="addg">${PF.icon('plus')} مجموعة</button>
        <button class="btn" data-act="edit" ${selA ? '' : 'disabled'}>${PF.icon('edit')} تفاصيل النشاط</button>
        <button class="btn" data-act="del" ${selA ? '' : 'disabled'}>${PF.icon('trash')} حذف</button>
        <span class="sp"></span>
        <select id="flt" aria-label="تصفية">${PF.opts(FILTERS, UI.filter)}</select>
        <input type="text" id="q" placeholder="بحث بالاسم أو الرقم…" value="${esc(UI.q)}" aria-label="بحث">
        <div class="seg" id="zoom">${[[5, 'شهري'], [12, 'أسبوعي'], [26, 'يومي']].map(([v, l]) => `<button data-z="${v}" class="${UI.zoom === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <label class="cb"><input type="checkbox" data-tg="float" ${UI.float ? 'checked' : ''}>Float</label>
        <label class="cb"><input type="checkbox" data-tg="base" ${UI.base ? 'checked' : ''}>خط الأساس</label>
        <label class="cb"><input type="checkbox" data-tg="links" ${UI.links ? 'checked' : ''}>الروابط</label>
        <button class="btn sm" data-act="tbl">${UI.tbl ? 'تصغير الجدول' : 'توسيع الجدول'}</button>
      </div>
      ${C.project.errors.length ? `<div class="note bad" style="margin:10px 16px 0">يوجد حلقة مغلقة في العلاقات بين الأنشطة: ${C.project.errors[0].ids.join('، ')} — عدّل العلاقات حتى يحسب الجدول بشكل صحيح.</div>` : ''}
      <div class="sgrid ${UI.tbl ? '' : 'collapsed-tbl'}" data-keepscroll="sched" style="--tblw:${tblW}px">
        <div class="sinner" style="width:${tblW + W}px">
          <div class="shead"><div class="scells">
            <div class="c c-id">الرقم</div><div class="c c-name" dir="rtl">اسم النشاط</div><div class="c c-dur">المدة</div><div class="c c-s">البداية</div><div class="c c-f">النهاية</div><div class="c c-tf" title="Total Float بأيام العمل">Float</div><div class="c c-pct">%</div></div>
            <div style="position:relative;width:${W}px;flex:none">${head}</div></div>
          <div class="gbg" style="height:${rows.length * ROWH}px">${bg}</div>
          <div class="rows">${rowsHtml || '<div class="sched-empty"><b>لا توجد أنشطة مطابقة</b><br>غيّر التصفية أو أضف نشاطاً جديداً.</div>'}
            <svg class="links" width="${W}" height="${rows.length * ROWH}">${links}</svg></div>
        </div>
      </div>`;
    bind(root, { gs, dw });
  }

  function bind(root, geo) {
    const S = S_();
    const mut = (fn) => PF.Store.mutate(fn);
    root.onclick = (e) => {
      const t = e.target;
      const z = t.closest('[data-z]'); if (z) { UI.zoom = +z.dataset.z; saveUI(); PF.App.render(false); return; }
      const gt = t.closest('[data-gtoggle]');
      if (gt) { const id = gt.dataset.gtoggle; UI.collapsed[id] = !UI.collapsed[id]; saveUI(); PF.App.render(false); return; }
      const act = t.closest('[data-act]');
      if (act) { actions[act.dataset.act] && actions[act.dataset.act](); return; }
      if (t.closest('input,select')) return;
      const row = t.closest('[data-row]');
      if (row) { UI.sel = row.dataset.row; PF.App.render(false); }
    };
    root.ondblclick = (e) => {
      const gt = e.target.closest('[data-gtoggle]');
      if (gt) { renameGroup(gt.dataset.gtoggle); return; }
      const row = e.target.closest('[data-row]');
      if (row && !e.target.closest('input')) editActivity(row.dataset.row);
    };
    root.onchange = (e) => {
      const t = e.target;
      if (t.id === 'flt') { UI.filter = t.value; PF.App.render(false); return; }
      if (t.dataset.tg) { UI[t.dataset.tg] = t.checked; saveUI(); PF.App.render(false); return; }
      if (!t.dataset.f) return;
      const id = t.dataset.id;
      mut((st) => {
        const a = st.activities.find((x) => x.id === id);
        if (t.dataset.f === 'name') a.name = t.value.trim() || a.name;
        else if (t.dataset.f === 'dur') a.dur = Math.max(1, Math.round(+t.value || 1));
        else if (t.dataset.f === 'pct') PF.Actions.setPct(st, a, t.value);
      });
    };
    const q = root.querySelector('#q');
    if (q) q.oninput = () => { UI.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { PF.App.render(false); const n = PF.$('#q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); };

    // ---- سحب الأشرطة
    root.onpointerdown = (e) => {
      const bar = e.target.closest('.bar');
      if (!bar || e.button !== 0) return;
      const id = bar.dataset.bar, r = PF.Store.C.byId[id];
      if (bar.classList.contains('prog')) { PF.toast('النشاط بدأ تنفيذه — عدّل التقدّم من صفحة «تحديث التقدّم».'); return; }
      const resize = !!e.target.closest('[data-rh]');
      const x0 = e.clientX, w0 = bar.offsetWidth;
      let days = 0, moved = false;
      bar.setPointerCapture(e.pointerId);
      bar.classList.add('dragging');
      const mv = (ev) => {
        const dx = ev.clientX - x0;
        days = Math.round(dx / geo.dw);
        if (Math.abs(dx) > 3) moved = true;
        if (resize) bar.style.width = Math.max(3, w0 + days * geo.dw) + 'px';
        else bar.style.transform = `translateX(${days * geo.dw}px)`;
      };
      const up = () => {
        bar.removeEventListener('pointermove', mv);
        bar.removeEventListener('pointerup', up);
        bar.classList.remove('dragging');
        if (!moved || days === 0) { bar.style.transform = ''; bar.style.width = w0 + 'px'; UI.sel = id; PF.App.render(false); return; }
        if (resize) {
          const newLast = r.lastDay + days;
          const nd = Math.max(1, r.cal.wdb(r.s, newLast + 1));
          mut((st) => { st.activities.find((a) => a.id === id).dur = nd; });
          PF.toast('المدة الجديدة: ' + nd + ' يوم عمل', 'ok');
        } else {
          const want = r.cal.next(r.s + days);
          mut((st) => { const a = st.activities.find((x) => x.id === id); a.constraint = { type: 'SNET', date: D.toIso(want) }; });
          const got = PF.Store.C.byId[id].s;
          if (got !== want) PF.toast('الجدول محكوم بالعلاقات — لن يبدأ النشاط قبل ' + D.fmt(got) + '. عدّل العلاقة من «تفاصيل النشاط».');
          else PF.toast('تم تثبيت قيد: يبدأ ليس قبل ' + D.fmt(want) + ' (يمكن إزالته من التفاصيل)', 'ok');
        }
      };
      bar.addEventListener('pointermove', mv);
      bar.addEventListener('pointerup', up);
      e.preventDefault();
    };
  }

  const actions = {
    add() { addActivity('task'); },
    addm() { addActivity('milestone'); },
    async addg() {
      const n = await PF.prompt('مجموعة جديدة (WBS)', 'اسم المجموعة', '');
      if (n) PF.Store.mutate((st) => st.wbs.push({ id: PF.uid('w'), name: n }));
    },
    edit() { UI.sel && editActivity(UI.sel); },
    async del() {
      const S = S_(), a = S.activities.find((x) => x.id === UI.sel);
      if (!a) return;
      if (await PF.confirm(`حذف النشاط «${a.name}»؟ ستُحذف علاقاته أيضاً (يمكنك التراجع بـ Ctrl+Z).`, 'حذف', true)) {
        PF.Store.mutate((st) => PF.Actions.deleteActivity(st, a.id));
        UI.sel = null; PF.App.render(false);
      }
    },
    tbl() { UI.tbl = !UI.tbl; saveUI(); PF.App.render(false); },
  };

  function addActivity(type) {
    const S = S_();
    const sel = UI.sel && S.activities.find((a) => a.id === UI.sel);
    const id = PF.Actions.nextId(S);
    PF.Store.mutate((st) => {
      const wbs = sel ? sel.wbs : st.wbs[0] ? st.wbs[0].id : '';
      const a = { id, name: type === 'milestone' ? 'معلم جديد' : 'نشاط جديد', wbs, type, dur: type === 'milestone' ? 0 : 5, cal: '', constraint: null, pct: 0, actualStart: null, actualFinish: null, remaining: null, budget: 0, actualCost: 0, notes: '', preds: sel ? [{ id: sel.id, type: 'FS', lag: 0 }] : [], resources: [] };
      const i = sel ? st.activities.findIndex((x) => x.id === sel.id) : st.activities.length - 1;
      st.activities.splice(i + 1, 0, a);
    });
    UI.sel = id;
    PF.App.render(false);
    editActivity(id);
  }

  async function renameGroup(id) {
    const w = S_().wbs.find((x) => x.id === id);
    if (!w) return;
    const n = await PF.prompt('إعادة تسمية المجموعة', 'الاسم', w.name);
    if (n) PF.Store.mutate((st) => { st.wbs.find((x) => x.id === id).name = n; });
  }

  // ---------- نافذة تفاصيل النشاط ----------
  function editActivity(id) {
    const S = S_(), C = C_();
    const orig = S.activities.find((a) => a.id === id);
    if (!orig) return;
    const d = PF.clone(orig);
    const r = C.byId[id];
    const mats = S.materials.filter((m) => m.activityId === id);
    const others = S.activities.filter((a) => a.id !== id);
    const REL = [['FS', 'نهاية→بداية (FS)'], ['SS', 'بداية→بداية (SS)'], ['FF', 'نهاية→نهاية (FF)'], ['SF', 'بداية→نهاية (SF)']];

    const body = () => `
      <div class="msec"><h4>البيانات الأساسية</h4>
        <div class="row"><label class="fld" style="flex:3 1 260px"><span>اسم النشاط</span><input dir="auto" data-p="name" value="${esc(d.name)}"></label>
          <label class="fld"><span>الرقم</span><input value="${esc(d.id)}" disabled></label></div>
        <div class="row">
          <label class="fld"><span>المجموعة (WBS)</span><select data-p="wbs">${PF.opts(S.wbs.map((w) => [w.id, w.name]), d.wbs)}</select></label>
          <label class="fld"><span>النوع</span><select data-p="type">${PF.opts([['task', 'نشاط'], ['milestone', 'معلم (مدة صفر)']], d.type)}</select></label>
          <label class="fld"><span>المدة (أيام عمل)</span><input type="number" min="0" data-p="dur" data-n value="${d.type === 'milestone' ? 0 : d.dur}" ${d.type === 'milestone' ? 'disabled' : ''}></label>
          <label class="fld"><span>التقويم</span><select data-p="cal">${PF.opts([['', 'تقويم المشروع'], ...S.calendars.map((c) => [c.id, c.name])], d.cal || '')}</select></label>
        </div>
        <div class="row">
          <label class="fld"><span>القيد الزمني</span><select data-p="constraint.type">${PF.opts(CONSTRAINTS, d.constraint ? d.constraint.type : '')}</select></label>
          <label class="fld"><span>تاريخ القيد</span><input type="date" data-p="constraint.date" value="${d.constraint ? d.constraint.date || '' : ''}" ${d.constraint ? '' : 'disabled'}></label>
          <label class="fld"><span>الميزانية (${esc(S.meta.currency)})</span><input type="number" min="0" data-p="budget" data-n value="${d.budget}"></label>
          <label class="fld"><span>التكلفة الفعلية</span><input type="number" min="0" data-p="actualCost" data-n value="${d.actualCost}"></label>
        </div></div>
      <div class="msec"><h4>الأنشطة السابقة (Predecessors)</h4>
        ${d.preds.map((p, i) => `<div class="rel"><select data-p="preds.${i}.id">${PF.opts(others.map((a) => [a.id, a.id + ' — ' + a.name]), p.id)}</select>
          <select data-p="preds.${i}.type">${PF.opts(REL, p.type)}</select>
          <input type="number" data-p="preds.${i}.lag" data-n value="${p.lag || 0}" title="التأخير (Lag) بأيام العمل — سالب = تقدّم"><button class="btn icon-btn" data-del-pred="${i}" title="حذف">${PF.icon('trash', 15)}</button></div>`).join('') || '<div class="t-mut" style="margin-bottom:8px">لا يوجد سابق — يبدأ النشاط مع بداية المشروع.</div>'}
        <button class="btn sm" data-add-pred>${PF.icon('plus', 14)} إضافة سابق</button>
        <div class="sub" style="margin:8px 0 0">اللاحقة: ${C.succ[id].map((e) => esc(e.to)).join('، ') || 'لا يوجد'}</div></div>
      <div class="msec"><h4>التقدّم</h4>
        <div class="row">
          <label class="fld"><span>نسبة الإنجاز %</span><input type="number" min="0" max="100" data-p="pct" data-n value="${d.pct}"></label>
          <label class="fld"><span>البداية الفعلية</span><input type="date" data-p="actualStart" value="${d.actualStart || ''}"></label>
          <label class="fld"><span>النهاية الفعلية</span><input type="date" data-p="actualFinish" value="${d.actualFinish || ''}"></label>
          <label class="fld"><span>المتبقي (أيام)</span><input type="number" min="0" data-p="remaining" data-n value="${d.remaining == null ? '' : d.remaining}" placeholder="تلقائي"></label></div></div>
      <div class="msec"><h4>الموارد المطلوبة (وحدات/يوم)</h4>
        ${d.resources.map((x, i) => `<div class="rel res"><select data-p="resources.${i}.rid">${PF.opts(S.resources.map((q) => [q.id, q.name]), x.rid)}</select>
          <input type="number" min="0" data-p="resources.${i}.perDay" data-n value="${x.perDay}"><button class="btn icon-btn" data-del-res="${i}">${PF.icon('trash', 15)}</button></div>`).join('')}
        <button class="btn sm" data-add-res ${S.resources.length ? '' : 'disabled'}>${PF.icon('plus', 14)} إضافة مورد</button></div>
      ${mats.length ? `<div class="msec"><h4>المواد المرتبطة</h4>${mats.map((m) => `<div class="qrow"><span>${esc(m.name)}</span><span class="tag info" style="margin-inline-start:auto">${esc((PF.Calc.MAT_STATUS.find((s) => s[0] === m.status) || [])[1] || '')}</span></div>`).join('')}</div>` : ''}
      <div class="msec"><h4>ملاحظات</h4><textarea data-p="notes" dir="auto">${esc(d.notes || '')}</textarea></div>
      <div class="sub">الحالي: ${D.fmt(r.s)} → ${D.fmt(r.lastDay)} · Float: ${r.tf} · Free Float: ${r.ff}</div>`;

    const m = PF.modal({
      title: `${orig.id} — ${orig.name}`, body: body(), wide: true, noFocus: true,
      actions: [
        { label: 'إلغاء' },
        { label: 'حفظ', kind: 'primary', onClick: () => save() },
      ],
    });
    const redraw = () => { const sc = m.body.scrollTop; m.body.innerHTML = body(); m.body.scrollTop = sc; };
    const val = (el) => (el.dataset.n !== undefined ? (el.value === '' ? null : +el.value) : el.value);

    m.body.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset.p) return;
      const p = el.dataset.p;
      if (p === 'constraint.type') return;
      if (p === 'constraint.date') { d.constraint = d.constraint || { type: 'SNET' }; d.constraint.date = el.value; return; }
      PF.setPath(d, p, val(el));
    });
    m.body.addEventListener('change', (e) => {
      const el = e.target, p = el.dataset.p;
      if (p === 'constraint.type') { d.constraint = el.value ? { type: el.value, date: (d.constraint && d.constraint.date) || D.toIso(C.byId[id].s) } : null; redraw(); }
      else if (p === 'type') { d.type = el.value; if (d.type === 'milestone') d.dur = 0; else if (!d.dur) d.dur = 5; redraw(); }
      else if (p === 'actualFinish') { PF.Actions.setActualFinish(S, d, el.value); redraw(); }
      else if (p === 'actualStart') { PF.Actions.setActualStart(S, d, el.value); redraw(); }
      else if (p === 'pct') { const f = { meta: S.meta }; PF.Actions.setPct(f, d, el.value); redraw(); }
    });
    m.body.addEventListener('click', (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.hasAttribute('data-add-pred')) { const free = others.find((a) => !d.preds.some((p) => p.id === a.id)); if (free) { d.preds.push({ id: free.id, type: 'FS', lag: 0 }); redraw(); } }
      else if (t.dataset.delPred != null) { d.preds.splice(+t.dataset.delPred, 1); redraw(); }
      else if (t.hasAttribute('data-add-res')) { d.resources.push({ rid: S.resources[0].id, perDay: 1 }); redraw(); }
      else if (t.dataset.delRes != null) { d.resources.splice(+t.dataset.delRes, 1); redraw(); }
    });

    function save() {
      if (!String(d.name || '').trim()) { PF.toast('اكتب اسم النشاط', 'err'); return false; }
      if (d.type !== 'milestone' && !(+d.dur >= 1)) { PF.toast('المدة يجب أن تكون يوماً واحداً على الأقل', 'err'); return false; }
      if (d.constraint && !d.constraint.date) { PF.toast('حدّد تاريخ القيد أو اختر «بدون قيد»', 'err'); return false; }
      d.preds = d.preds.filter((p, i, arr) => p.id && arr.findIndex((q) => q.id === p.id && q.type === p.type) === i);
      const test = PF.clone(PF.Store.state);
      Object.assign(test.activities.find((a) => a.id === id), d);
      if (PF.Actions.wouldCycle(test)) { PF.toast('هذه العلاقات تُنشئ حلقة مغلقة (نشاط يعتمد على نفسه) — عدّل السوابق.', 'err'); return false; }
      PF.Store.mutate((st) => { Object.assign(st.activities.find((a) => a.id === id), d); });
      return true;
    }
  }

  PF.Views.schedule = { render, flush: true, edit: editActivity, setFilter(f) { UI.filter = f; UI.q = ''; } };
})(window);

</script>
  <script>
/* PlanFlow — تحديث التقدّم الدوري (Data Date + نسب الإنجاز + سجل الفترات) */
(function (g) {
  const PF = g.PF;
  const D = PF.D, esc = PF.esc, CPM = PF.CPM;
  let filter = 'attention';

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    const bl = CPM.baselineOf(S);
    const dd = D.toNum(S.meta.dataDate), t = dd + 1;

    const rowsAll = S.activities.map((a) => {
      const r = C.byId[a.id], b = bl && bl.data[a.id];
      const planned = b ? Math.round(CPM.frac(C.cals[b.cal] || C.defCal, b.s, b.f, b.dur, t) * 100) : null;
      const actual = r.status === 'complete' ? 100 : a.pct || 0;
      // يحتاج تحديث: كان مفروضاً أن يبدأ/يتقدم حسب الخطة ولم يُسجَّل
      const needs = r.status !== 'complete' && planned != null && (planned > actual + 4 || (planned >= 100 && actual < 100) || (b && b.s <= dd && r.status === 'notstarted'));
      return { a, r, b, planned, actual, needs };
    });
    const flt = { attention: (x) => x.needs, prog: (x) => x.r.status === 'inprogress', todo: (x) => x.r.status === 'notstarted', done: (x) => x.r.status === 'complete', all: () => true };
    const list = rowsAll.filter(flt[filter]);
    const cnt = (k) => rowsAll.filter(flt[k]).length;
    const last = S.snapshots[S.snapshots.length - 1];

    root.innerHTML = `
      <div class="pagehead"><h2>تحديث التقدّم</h2><span class="sp"></span></div>
      <div class="card" style="margin-bottom:14px">
        <div class="row">
          <label class="fld" style="max-width:200px"><span>تاريخ البيانات (نهاية اليوم)</span><input type="date" id="dd" value="${S.meta.dataDate}"></label>
          <div class="fld" style="flex:2 1 300px"><span>&nbsp;</span><div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" data-act="week">ترحيل أسبوع</button>
            <button class="btn primary" data-act="snap">${PF.icon('check')} حفظ فترة التحديث</button></div></div>
        </div>
        <div class="sub" style="margin:0">سجّل الإنجاز حتى نهاية هذا التاريخ؛ العمل المتبقي سيُعاد جدولته من اليوم التالي. «حفظ فترة التحديث» يضيف نقطة للمنحنى الفعلي في صفحة S-Curve${last ? ` (آخر فترة محفوظة: ${D.fmtLong(D.toNum(last.date))})` : ''}.</div>
      </div>
      <div class="chips" style="margin-bottom:12px">
        ${[['attention', 'تحتاج تحديثاً'], ['prog', 'قيد التنفيذ'], ['todo', 'لم تبدأ'], ['done', 'مكتملة'], ['all', 'الكل']].map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${l}<i>${cnt(k)}</i></button>`).join('')}
      </div>
      <div class="tw"><table class="t">
        <thead><tr><th>الرقم</th><th>النشاط</th><th class="n">المخطط %</th><th class="n">الفعلي %</th><th>بداية فعلية</th><th>نهاية فعلية</th><th class="n">متبقي (يوم)</th><th class="n">النهاية المتوقعة</th><th class="n">الانحراف</th><th></th></tr></thead>
        <tbody>${list.map(({ a, r, b, planned, actual, needs }) => {
          const v = b && r.status !== 'complete' ? r.cal.wdb(b.f, r.f) : b ? r.cal.wdb(b.f, r.f) : null;
          const isM = a.type === 'milestone';
          return `<tr>
            <td class="t-mut">${esc(a.id)}</td><td dir="auto">${esc(a.name)} ${needs ? '<span class="tag risk">يحتاج تحديثاً</span>' : ''}</td>
            <td class="n num">${planned == null ? '—' : planned + '%'}</td>
            <td class="n" style="width:80px">${isM ? `<input type="checkbox" data-id="${esc(a.id)}" data-f="ms" ${actual === 100 ? 'checked' : ''} title="تحقّق المعلم">` : `<input type="number" min="0" max="100" value="${actual}" data-id="${esc(a.id)}" data-f="pct" data-fkey="${esc(a.id)}:pct">`}</td>
            <td style="width:140px"><input type="date" value="${a.actualStart || ''}" data-id="${esc(a.id)}" data-f="as" data-fkey="${esc(a.id)}:as"></td>
            <td style="width:140px"><input type="date" value="${a.actualFinish || ''}" data-id="${esc(a.id)}" data-f="af" data-fkey="${esc(a.id)}:af"></td>
            <td class="n" style="width:84px">${r.status === 'inprogress' ? `<input type="number" min="1" value="${r.rem}" data-id="${esc(a.id)}" data-f="rem" data-fkey="${esc(a.id)}:rem" title="يُحسب تلقائياً من النسبة، عدّله إن كان تقديرك مختلفاً">` : '<span class="t-mut">—</span>'}</td>
            <td class="n num">${D.fmt(r.lastDay)}</td>
            <td class="n num ${v > 0 ? 't-bad' : v < 0 ? 't-good' : 't-mut'}">${v == null ? '—' : v === 0 ? '0' : (v > 0 ? '+' : '') + v}</td>
            <td class="n">${r.status !== 'complete' && !isM ? `<button class="btn sm" data-id="${esc(a.id)}" data-f="done">أنجز</button>` : ''}</td></tr>`;
        }).join('') || '<tr><td colspan="10"><div class="empty"><b>لا توجد أنشطة هنا</b>غيّر التصفية لعرض أنشطة أخرى.</div></td></tr>'}</tbody></table></div>`;

    root.onclick = (e) => {
      const f = e.target.closest('[data-f]');
      if (f && f.classList.contains('chip')) { filter = f.dataset.f; PF.App.render(false); return; }
      if (f && f.dataset.f === 'done') PF.Store.mutate((st) => PF.Actions.setPct(st, st.activities.find((a) => a.id === f.dataset.id), 100));
      const act = e.target.closest('[data-act]');
      if (!act) return;
      if (act.dataset.act === 'week') PF.Store.mutate((st) => { st.meta.dataDate = D.toIso(D.toNum(st.meta.dataDate) + 7); });
      if (act.dataset.act === 'snap') { PF.Store.mutate((st) => PF.Actions.saveSnapshot(st, PF.Store.C)); PF.toast('تم حفظ فترة التحديث ' + D.fmt(dd), 'ok'); }
    };
    root.onchange = (e) => {
      const el = e.target;
      if (el.id === 'dd') { if (el.value) PF.Store.mutate((st) => { st.meta.dataDate = el.value; }); return; }
      const f = el.dataset.f, id = el.dataset.id;
      if (!f || f === 'done') return;
      PF.Store.mutate((st) => {
        const a = st.activities.find((x) => x.id === id);
        if (f === 'pct') PF.Actions.setPct(st, a, el.value);
        else if (f === 'ms') PF.Actions.setPct(st, a, el.checked ? 100 : 0);
        else if (f === 'as') PF.Actions.setActualStart(st, a, el.value);
        else if (f === 'af') PF.Actions.setActualFinish(st, a, el.value);
        else if (f === 'rem') a.remaining = Math.max(1, +el.value || 1);
      });
    };
  }

  PF.Views.progress = { render };
})(window);

</script>
  <script>
/* PlanFlow — المواد والمشتريات: مربوطة بأنشطة الجدول، وتنبّه للتأخير قبل أن يصيب المسار الحرج */
(function (g) {
  const PF = g.PF;
  const D = PF.D, esc = PF.esc;
  const ST = PF.Calc.MAT_STATUS;
  const stLabel = (k) => (ST.find((s) => s[0] === k) || [])[1] || k;
  let filter = 'all';
  const HL = { late: 'متأخرة', risk: 'معرّضة', ok: 'ضمن الجدول', done: 'وصلت', none: 'غير مربوطة' };

  function render(root) {
    const S = PF.Store.state, C = PF.Store.C;
    const all = PF.Calc.analyzeMaterials(S, C);
    const cnt = (h) => all.filter((x) => (h === 'all' ? true : h === 'critical' ? x.critical : x.health === h)).length;
    const list = all.filter((x) => (filter === 'all' ? true : filter === 'critical' ? x.critical : x.health === filter));
    const ordered = all.filter((x) => ['ordered', 'shipped', 'delivered'].includes(x.m.status)).length;

    root.innerHTML = `
      <div class="pagehead"><div><h2>المواد والمشتريات</h2><div class="sub" style="margin:2px 0 0">كل مادة مربوطة بالنشاط الذي يحتاجها؛ يُحسب تاريخ «مطلوب بالموقع» تلقائياً من الجدول ويتحدّث معه.</div></div><span class="sp"></span>
        <button class="btn primary" data-act="add">${PF.icon('plus')} مادة جديدة</button></div>
      <div class="grid g4" style="margin-bottom:14px">
        <div class="card kpi ${cnt('late') ? 'bad' : 'good'}"><div class="l">متأخرة</div><div class="v">${cnt('late')}</div><div class="s">وصولها بعد تاريخ الحاجة</div></div>
        <div class="card kpi ${cnt('risk') ? 'warn' : 'good'}"><div class="l">معرّضة للتأخير</div><div class="v">${cnt('risk')}</div><div class="s">اقترب آخر موعد للطلب أو الهامش قليل</div></div>
        <div class="card kpi ${cnt('critical') ? 'bad' : 'neutral'}"><div class="l">تؤثر على مسار حرج</div><div class="v">${cnt('critical')}</div><div class="s">أي تأخير فيها يؤخر الانتهاء</div></div>
        <div class="card kpi neutral"><div class="l">تم طلبها أو وصلت</div><div class="v">${ordered} / ${all.length}</div><div class="s">من إجمالي المواد</div></div>
      </div>
      <div class="chips" style="margin-bottom:12px">${[['all', 'الكل'], ['late', 'متأخرة'], ['risk', 'معرّضة'], ['critical', 'تؤثر على مسار حرج'], ['ok', 'ضمن الجدول'], ['done', 'وصلت']].map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${l}<i>${cnt(k)}</i></button>`).join('')}</div>
      <div class="tw"><table class="t">
        <thead><tr><th>المادة</th><th>النشاط المرتبط</th><th>الحالة</th><th class="n">مطلوب بالموقع</th><th class="n">آخر موعد للطلب</th><th class="n">الوصول المتوقع</th><th class="n">الفرق</th><th>الوضع</th><th></th></tr></thead>
        <tbody>${list.map((x) => {
          const { m } = x;
          return `<tr>
            <td dir="auto"><b>${esc(m.name)}</b><div class="t-mut" style="font-size:12px">${PF.num(m.qty)} ${esc(m.unit)} · ${esc(m.supplier || 'بدون مورد')}</div></td>
            <td dir="auto">${x.a ? `<button class="link" data-edit-act="${esc(x.a.id)}">${esc(x.a.name)}</button>${x.r.critical ? ' <span class="tag crit">حرج</span>' : x.r.near ? ' <span class="tag near">شبه حرج</span>' : ''}` : '<span class="t-mut">—</span>'}</td>
            <td><select data-id="${esc(m.id)}" data-f="status">${PF.opts(ST, m.status)}</select></td>
            <td class="n num">${x.req != null ? D.fmt(x.req) : '—'}</td>
            <td class="n num">${x.latestOrder != null && m.status !== 'delivered' ? D.fmt(x.latestOrder) : '—'}</td>
            <td class="n num">${x.eta != null ? D.fmt(x.eta) + (x.projected ? ' <span class="t-mut" title="تقدير: لم يُحدَّد تاريخ وصول">~</span>' : '') : '—'}</td>
            <td class="n num ${x.delta > 0 ? 't-bad' : 't-good'}">${x.delta == null || m.status === 'delivered' ? '—' : (x.delta > 0 ? '+' : '') + x.delta}</td>
            <td><span class="tag ${x.health}">${HL[x.health]}</span>${x.health === 'ok' || x.health === 'done' ? '' : `<div class="t-mut" style="font-size:12px">${esc(x.reason)}</div>`}</td>
            <td style="white-space:nowrap">${x.health === 'late' && x.a && x.eta != null && x.delta > 0 ? `<button class="btn sm" data-id="${esc(m.id)}" data-apply title="يثبّت قيد «يبدأ ليس قبل» على النشاط المرتبط لمعرفة أثر التأخير على الجدول">طبّق على الجدول</button> ` : ''}
              <button class="btn sm icon-btn" data-id="${esc(m.id)}" data-edit title="تعديل">${PF.icon('edit', 15)}</button>
              <button class="btn sm icon-btn" data-id="${esc(m.id)}" data-del title="حذف">${PF.icon('trash', 15)}</button></td></tr>`;
        }).join('') || `<tr><td colspan="9"><div class="empty"><b>${all.length ? 'لا توجد مواد في هذه التصفية' : 'لم تُضف مواد بعد'}</b>${all.length ? '' : 'أضف المواد التي قد تؤخر الأعمال (حديد، مصاعد، ألمنيوم…) واربطها بالنشاط الذي يحتاجها.'}</div></td></tr>`}</tbody></table></div>
      <div class="sub" style="margin-top:10px">آخر موعد للطلب = المطلوب بالموقع − مدة التوريد. «الفرق» بالأيام التقويمية: موجب = تأخير عن تاريخ الحاجة.</div>`;

    root.onclick = (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.classList.contains('chip')) { filter = t.dataset.f; PF.App.render(false); return; }
      if (t.dataset.act === 'add') { edit(null); return; }
      if (t.dataset.editAct) { PF.Views.schedule.edit(t.dataset.editAct); return; }
      const id = t.dataset.id; if (!id) return;
      if (t.hasAttribute('data-edit')) edit(id);
      else if (t.hasAttribute('data-del')) PF.confirm('حذف هذه المادة؟', 'حذف', true).then((ok) => ok && PF.Store.mutate((st) => { st.materials = st.materials.filter((m) => m.id !== id); }));
      else if (t.hasAttribute('data-apply')) {
        const x = all.find((y) => y.m.id === id);
        const date = D.toIso(x.eta + (+x.m.bufferDays || 0));
        PF.Store.mutate((st) => { st.activities.find((a) => a.id === x.m.activityId).constraint = { type: 'SNET', date }; });
        PF.toast('تم تثبيت قيد «يبدأ ليس قبل ' + D.fmt(D.toNum(date)) + '» على النشاط. شاهد الأثر في الجدول.', 'ok');
      }
    };
    root.onchange = (e) => {
      const el = e.target;
      if (el.dataset.f === 'status') PF.Store.mutate((st) => { const m = st.materials.find((x) => x.id === el.dataset.id); m.status = el.value; if (el.value === 'delivered' && !m.eta) m.eta = st.meta.dataDate; });
    };
  }

  function edit(id) {
    const S = PF.Store.state;
    const d = id ? PF.clone(S.materials.find((m) => m.id === id)) : { id: 'M' + (S.materials.length + 1) + PF.uid('').slice(0, 2), name: '', qty: 1, unit: 'وحدة', supplier: '', activityId: '', approvalDays: 7, leadDays: 14, bufferDays: 5, status: 'planned', eta: '', notes: '' };
    const body = `
      <div class="row"><label class="fld" style="flex:3 1 220px"><span>اسم المادة</span><input dir="auto" data-p="name" value="${esc(d.name)}"></label>
        <label class="fld"><span>الكمية</span><input type="number" data-p="qty" data-n value="${d.qty}"></label>

(function (g) {
  const PF = g.PF;
  const D = PF.D, esc = PF.esc;
  let selRes = null;

  function weekly(S, C, rid) {
    let mn = Infinity, mx = -Infinity;
    S.activities.forEach((a) => { const r = C.byId[a.id]; if (r.status !== 'complete') { mn = Math.min(mn, r.s); mx = Math.max(mx, r.f); } });

    const out = [];

      let peak = 0;
      for (let d = w; d < w + 7; d++) {
        let tot = 0;
        S.activities.forEach((a) => {
          const r = C.byId[a.id];
          if (r.status === 'complete' || d < r.s || d >= r.f || !r.cal.isWork(d)) return;
          (a.resources || []).forEach((x) => { if (x.rid === rid) tot += +x.perDay || 0; });

          <td style="white-space:nowrap"><button class="btn sm" data-view="${r.id}">عرض الرسم</button> <button class="btn sm icon-btn" data-del="${r.id}" title="حذف">${PF.icon('trash', 15)}</button></td></tr>`).join('') || '<tr><td colspan="5"><div class="empty"><b>لا توجد موارد</b>أضف مورداً لتبدأ.</div></td></tr>'}</tbody></table></div>
      ${res ? `<div class="card"><h3>الطلب الأسبوعي: ${esc(res.name)}<span class="sp"></span>
        ${over ? `<span class="tag late">${over} أسبوع فوق السعة</span>` : '<span class="tag ok">ضمن السعة</span>'}</h3>
